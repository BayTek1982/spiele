<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farbton-Jagd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#ff4fa0;--acc-ink:#ffffff}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.board{display:grid;gap:2px;background:#15151c;padding:6px;border-radius:14px;box-shadow:0 10px 26px var(--shadow);user-select:none;touch-action:manipulation;margin:0 auto;max-width:100%}
.board .c{aspect-ratio:1/1;border-radius:3px;position:relative;cursor:pointer}
.board .lab{color:#9aa;font-size:9px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;aspect-ratio:auto}
.board .c.sel{outline:3px solid #fff;outline-offset:-1px;z-index:2;box-shadow:0 0 0 2px #000}
.board .c.frame{box-shadow:inset 0 0 0 2px #fff}
.board .c.frame5{box-shadow:inset 0 0 0 1px #fff8}
.board .c.target{outline:3px solid #fff;z-index:3;animation:tg 1s infinite alternate}
@keyframes tg{to{outline-color:#000}}
.cones{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px;pointer-events:none}
.cones i{width:46%;height:46%;max-width:12px;max-height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.5px solid #fff;box-shadow:0 1px 2px #000a}
.hintbox{background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:12px;text-align:center;margin-bottom:10px}
.hintbox .w{font-size:26px;font-weight:900;letter-spacing:.5px}
.hintbox small{display:block;color:var(--mut);font-weight:800;font-size:12px;font-family:'JetBrains Mono',monospace}
.card4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.card4 button{aspect-ratio:1/1;border-radius:14px;border:4px solid transparent;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;font-size:13px;display:flex;align-items:flex-end;justify-content:center;padding:6px}
.card4 button.on{border-color:var(--txt);transform:scale(1.05)}
.zoom{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:200px;margin:8px auto}
.zoom div{aspect-ratio:1/1;border-radius:6px;cursor:pointer;position:relative}
.zoom div.mid{outline:3px solid var(--txt);outline-offset:2px}
.zoom div span{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;font-family:'JetBrains Mono',monospace;color:#fff;text-shadow:0 1px 2px #000}
.place{position:sticky;bottom:8px;z-index:20;background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:10px;margin-top:10px;box-shadow:0 8px 24px var(--shadow)}
.status{text-align:center;font-weight:900;font-size:17px;margin:6px 0 10px}
.scores{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.scores div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:5px}
.scores div.on{border-color:var(--acc)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #0004}
.plist{display:grid;gap:8px}.plist .pr{display:flex;gap:8px;align-items:center}
.plist input,.inp{flex:1;min-width:0;font:inherit;font-weight:700;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--txt)}
.cover{text-align:center;padding:30px 10px}
.cover .big{font-size:60px}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">🎨</span><h1>Farbton-<b>Jagd</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="setup">
    <div class="card opts">
      <div><div class="lbl">Spielart</div><div class="seg" id="modeSeg"><button data-v="fam">👨‍👩‍👧‍👦 Familie (ein Handy)</button><button data-v="solo">🤖 Allein – Computer gibt Hinweise</button></div></div>
      <div id="famBox"><div class="lbl">Mitspieler (3–8)</div><div class="plist" id="plist"></div><div class="row"><button class="small" id="btnAddP">+ Spieler</button></div>
        <div class="lbl" style="margin-top:8px">Runden (jeder gibt so oft Hinweise)</div><div class="seg" id="roundSeg"><button data-v="1">1×</button><button data-v="2">2×</button><button data-v="3">3×</button></div></div>
      <div id="soloBox" class="hidden"><div class="lbl">Schwierigkeit</div><div class="seg" id="lvlSeg"><button data-v="1">😊 Leicht</button><button data-v="2">🙂 Mittel</button><button data-v="3">😎 Schwer</button></div></div>
      <div class="row"><button class="primary" id="btnStart">Spiel starten 🎨</button></div>
    </div>
    <div class="note" id="best" style="text-align:center"></div>
  </section>
  <section id="game" class="hidden">
    <div class="scores" id="scores"></div>
    <div class="status" id="status"></div>
    <div id="panel"></div>
    <div id="boardWrap"><div class="board" id="board"></div></div>
    <div id="placeBox"></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="small" id="btnMenu">‹ Menü</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js"></script><script src="/online/online.js"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>🎨 So spielst du Farbton-Jagd</h2>
<h3>Ziel</h3><p>Errate die geheime Farbe auf dem großen Farbbrett – nur mit ein paar Wörtern als Hinweis!</p>
<h3>👨‍👩‍👧‍👦 Familie (ein Handy)</h3><ol><li>Wer dran ist, bekommt 4 Farben und wählt <b>heimlich</b> eine aus.</li><li>Dann gibt er einen Hinweis mit <b>nur einem Wort</b> (z. B. „Banane“). Kein Farbname wie „gelb“ und keine Feld-Nummer!</li><li>Das Handy geht reihum: jeder tippt ein Feld an und setzt seinen 1. Kegel.</li><li>Danach ein Hinweis mit <b>zwei Wörtern</b> (z. B. „reife Zitrone“) – jeder setzt seinen 2. Kegel.</li><li>Auflösung! Um die richtige Farbe kommt ein Rahmen.</li></ol>
<h3>Punkte</h3><ul><li><b>3 Punkte</b> – genau getroffen</li><li><b>2 Punkte</b> – im weißen 3×3-Rahmen</li><li><b>1 Punkt</b> – im äußeren 5×5-Rahmen</li><li>Der <b>Hinweisgeber</b> bekommt 1 Punkt für jeden Kegel im 3×3-Rahmen.</li></ul>
<h3>🤖 Allein</h3><p>Der Computer denkt sich eine Farbe aus und gibt dir die Hinweise. 10 Runden – wie viele Punkte schaffst du?</p>
<div class="tip">💡 Tipp: Am Handy kannst du nach dem Antippen mit der Lupe noch ein Feld daneben wählen.</div>`;
const COLS=30,ROWS=16,RL='ABCDEFGHIJKLMNOP';
// Farbe für Spalte x (0..29) und Reihe y (0..15)
function col(x,y){const h=(330-x*12+360)%360;const t=y/(ROWS-1);const l=78-t*50;const s=62+Math.sin(t*Math.PI)*30;return `hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%)`;}
const nameOf=(x,y)=>RL[y]+(x+1);
const PCOL=['#e0453a','#2f7de1','#2fa35a','#f2c21b','#8e5cf0','#ff7a1a','#ff6ad5','#21c3e6'];
let cfg={mode:KIT.get('ft-mode','fam'),rounds:+KIT.get('ft-r',1),lvl:+KIT.get('ft-lvl',2)};let names=KIT.get('ft-pl',['Papa','Mama','Alea','David']);let G=null;
function bindSeg(id,val,cb){const el=$(id);const set=v=>{el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==String(v)));};set(val);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;set(b.dataset.v);cb(b.dataset.v);};}
const upd=()=>{$('#famBox').classList.toggle('hidden',cfg.mode!=='fam');$('#soloBox').classList.toggle('hidden',cfg.mode!=='solo');};
bindSeg('#modeSeg',cfg.mode,v=>{cfg.mode=v;KIT.set('ft-mode',v);upd();});bindSeg('#roundSeg',cfg.rounds,v=>{cfg.rounds=+v;KIT.set('ft-r',+v);});bindSeg('#lvlSeg',cfg.lvl,v=>{cfg.lvl=+v;KIT.set('ft-lvl',+v);});upd();
function plist(){$('#plist').innerHTML=names.map((n,i)=>`<div class="pr"><span class="dot" style="background:${PCOL[i]}"></span><input data-i="${i}" value="${esc(n)}" maxlength="12">${names.length>3?`<button class="small" data-x="${i}">✕</button>`:''}</div>`).join('');}
$('#plist').oninput=e=>{const i=e.target.dataset.i;if(i!=null){names[i]=e.target.value;KIT.set('ft-pl',names);}};
$('#plist').onclick=e=>{const x=e.target.dataset.x;if(x!=null){names.splice(+x,1);KIT.set('ft-pl',names);plist();}};
$('#btnAddP').onclick=()=>{if(names.length<8){names.push('Spieler '+(names.length+1));KIT.set('ft-pl',names);plist();}};
/* ---------- Brett ---------- */
let portrait=false;
function buildBoard(){portrait=innerWidth<720;const b=$('#board');let h='';
  if(!portrait){b.style.gridTemplateColumns=`14px repeat(${COLS},1fr)`;h+='<div class="lab"></div>'+[...Array(COLS)].map((_,x)=>`<div class="lab">${x+1}</div>`).join('');
    for(let y=0;y<ROWS;y++){h+=`<div class="lab">${RL[y]}</div>`;for(let x=0;x<COLS;x++)h+=`<div class="c" data-x="${x}" data-y="${y}" style="background:${col(x,y)}"><div class="cones"></div></div>`;}}
  else{b.style.gridTemplateColumns=`16px repeat(${ROWS},1fr)`;h+='<div class="lab"></div>'+[...RL].map(r=>`<div class="lab">${r}</div>`).join('');
    for(let x=0;x<COLS;x++){h+=`<div class="lab">${x+1}</div>`;for(let y=0;y<ROWS;y++)h+=`<div class="c" data-x="${x}" data-y="${y}" style="background:${col(x,y)}"><div class="cones"></div></div>`;}}
  b.innerHTML=h;}
const cell=(x,y)=>$(`#board .c[data-x="${x}"][data-y="${y}"]`);
function drawCones(){$$('#board .cones').forEach(c=>c.innerHTML='');if(!G)return;for(const c of G.cones){const el=cell(c.x,c.y);if(el)el.querySelector('.cones').insertAdjacentHTML('beforeend',`<i style="background:${PCOL[c.p]}"></i>`);}}
let pick=null;
$('#board').onclick=e=>{const el=e.target.closest('.c');if(!el||!G||G.phase!=='guess')return;pick={x:+el.dataset.x,y:+el.dataset.y};tone(600,.04);showPlace();};
function showPlace(){$$('#board .c.sel').forEach(c=>c.classList.remove('sel'));if(!pick){$('#placeBox').innerHTML='';return;}cell(pick.x,pick.y).classList.add('sel');
  let z='';for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=pick.x+dx,y=pick.y+dy;if(x<0||y<0||x>=COLS||y>=ROWS){z+='<div style="background:transparent"></div>';continue;}z+=`<div data-x="${x}" data-y="${y}" class="${dx||dy?'':'mid'}" style="background:${col(x,y)}">${dx||dy?'':`<span>${nameOf(x,y)}</span>`}</div>`;}
  const P=G.players[G.guesser];$('#placeBox').innerHTML=`<div class="place"><div style="text-align:center;font-weight:800">${G.solo?'':`<span class="dot" style="background:${PCOL[G.guesser]}"></span> ${esc(P.n)}: `}Feld <b>${nameOf(pick.x,pick.y)}</b> – genauer wählen:</div><div class="zoom" id="zoom">${z}</div><div class="row" style="justify-content:center"><button class="primary" id="btnPlace">📍 Kegel hier setzen</button></div></div>`;
  $('#zoom').onclick=e=>{const d=e.target.closest('[data-x]');if(!d)return;pick={x:+d.dataset.x,y:+d.dataset.y};tone(700,.03);showPlace();};$('#btnPlace').onclick=place;
  $('#placeBox').scrollIntoView({block:'nearest',behavior:'smooth'});}
/* ---------- Computer-Hinweise ---------- */
// Wort → [Spalte 1-30, Reihe A-P]
const WORDS=`Zitrone 55 60;Banane 50 65;Sonne 48 55;Senf 45 40;Mais 52 62;Honig 40 50;Orange 30 55;Mandarine 32 58;Kürbis 28 45;Karotte 22 52;Lachs 12 70;Pfirsich 25 75;Tomate 5 48;Erdbeere 352 55;Feuerwehr 0 45;Kirsche 345 35;Rost 18 35;Schokolade 20 28;Zimt 25 38;Flamingo 340 70;Rosa 330 75;Himbeere 335 50;Pink 320 58;Brombeere 290 30;Pflaume 300 35;Lavendel 270 72;Flieder 285 70;Veilchen 275 50;Aubergine 290 28;Mitternacht 235 28;Jeans 220 42;Himmel 205 72;Ozean 210 42;Babyblau 200 78;Eis 190 78;Gletscher 185 72;Türkis 175 52;Lagune 180 58;Pfefferminz 160 75;Tanne 150 30;Gras 110 50;Frosch 115 45;Avocado 85 38;Kiwi 90 52;Limette 75 58;Salat 95 68;Pistazie 90 72;Olive 65 35;Moos 95 35;Wald 130 28;Nebel 210 78;Vanille 55 78;Sand 40 70;Kamel 35 40;Kakao 15 28;Wein 335 28;Blut 355 32;Papagei 120 48;Schlumpf 210 58;Saphir 225 40;Smaragd 140 42;Bernstein 38 45;Koralle 8 62`.split(';').map(t=>{const [w,h,l]=t.split(' ');return [w,+h,+l];});
const W2=WORDS.map(([w,h,l])=>({w,x:Math.max(0,Math.min(COLS-1,Math.round(((330-h+720)%360)/12))),y:Math.max(0,Math.min(ROWS-1,Math.round((78-l)/50*(ROWS-1))))}));
function hueDir(dx){/* dx>0 → nach rechts (Hue sinkt) */const map=[[0,'rötlich'],[2,'orange'],[5,'gelblich'],[8,'grünlich'],[12,'grünlich'],[14,'bläulich'],[19,'bläulich'],[24,'lila'],[27,'rosa'],[30,'rötlich']];return dx;}
function famName(x){const h=(330-x*12+360)%360;return h<15||h>=345?'rot':h<40?'orange':h<70?'gelb':h<165?'grün':h<200?'türkis':h<255?'blau':h<290?'lila':'pink';}
function soloRound(){const lvl=cfg.lvl;const a=W2[Math.floor(Math.random()*W2.length)];const sp=[0,1,2,3][lvl];let tx=Math.max(0,Math.min(COLS-1,a.x+Math.round((Math.random()*2-1)*sp))),ty=Math.max(0,Math.min(ROWS-1,a.y+Math.round((Math.random()*2-1)*sp)));
  const dy=ty-a.y,dx=tx-a.x;const F={rot:'Rot',orange:'Orange',gelb:'Gelb',grün:'Grün',türkis:'Türkis',blau:'Blau',lila:'Lila',pink:'Pink'};const lw=dy<0?'heller':dy>0?'dunkler':'gleich hell';const hw=dx===0?'gleicher Farbton':'mehr '+F[famName(Math.max(0,Math.min(COLS-1,tx+Math.sign(dx)*3)))];const hint2=dx===0&&dy===0?'genau so':lw+' · '+hw;
  return {tx,ty,h1:a.w,h2:hint2};}
/* ---------- Ablauf ---------- */
function start(){if(cfg.mode==='fam'){const n=names.filter(x=>x.trim());if(n.length<3){infoBox('<p>Für die Familien-Runde braucht ihr mindestens <b>3 Spieler</b> (einer gibt Hinweise, die anderen raten). Allein spielen? Wähle „Allein“.</p>');return;}}
  G={solo:cfg.mode==='solo',players:(cfg.mode==='solo'?['Du']:names).map((n,i)=>({n:n||('Spieler '+(i+1)),s:0})),giver:0,round:0,cones:[],phase:'',turnsLeft:0,soloRound:0};
  $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');buildBoard();if(G.solo)nextSolo();else nextFam();}
function scores(){$('#scores').innerHTML=G.players.map((p,i)=>`<div class="${(!G.solo&&i===G.giver)?'on':''}"><span class="dot" style="background:${PCOL[i]}"></span>${esc(p.n)} ${p.s}${!G.solo&&i===G.giver?' 💬':''}</div>`).join('')+(G.solo?`<div>Runde ${G.soloRound}/10</div>`:'');}
function setPanel(h){$('#panel').innerHTML=h;}
function clearBoard(){G.cones=[];$$('#board .c').forEach(c=>c.classList.remove('sel','frame','frame5','target'));drawCones();pick=null;showPlace();}
// Familie
function nextFam(){clearBoard();scores();$('#boardWrap').classList.add('hidden');const P=G.players[G.giver];
  setPanel(`<div class="card cover"><div class="big">🤫</div><h2>${esc(P.n)} gibt jetzt den Hinweis</h2><p>Gib das Handy an <b>${esc(P.n)}</b>. Die anderen schauen bitte weg!</p><button class="primary" id="go">Ich bin ${esc(P.n)} – los!</button></div>`);$('#status').textContent=`Runde ${G.round+1} von ${cfg.rounds}`;
  $('#go').onclick=()=>{const opts=[];while(opts.length<4){const x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS);if(!opts.some(o=>Math.abs(o.x-x)<4&&Math.abs(o.y-y)<3))opts.push({x,y});}G.opts=opts;G.secret=null;
    setPanel(`<div class="card"><h2>🎴 Deine Farbkarte</h2><p>Wähle <b>heimlich</b> eine der 4 Farben aus:</p><div class="card4" id="c4">${opts.map((o,i)=>`<button data-i="${i}" style="background:${col(o.x,o.y)}">${nameOf(o.x,o.y)}</button>`).join('')}</div>
      <div class="lbl">Dein Hinweis (1 Wort) – sag ihn laut oder tipp ihn ein</div><input class="inp" id="h1" maxlength="20" placeholder="z. B. Banane" style="width:100%"><div class="row" style="margin-top:10px"><button class="primary" id="ok1" disabled>Fertig – Handy weitergeben</button></div></div>`);
    $('#c4').onclick=e=>{const b=e.target.closest('button');if(!b)return;G.secret=G.opts[+b.dataset.i];$$('#c4 button').forEach(x=>x.classList.toggle('on',x===b));$('#ok1').disabled=false;tone(600,.05);};
    $('#ok1').onclick=()=>{const v=$('#h1').value.trim().split(/\s+/)[0]||'';G.h1=v;G.h2='';G.stage=1;startGuessing();};};}
function guessers(){return G.players.map((_,i)=>i).filter(i=>i!==G.giver);}
function startGuessing(){G.queue=guessers();$('#boardWrap').classList.remove('hidden');nextGuesser();}
function hintHTML(){return `<div class="hintbox"><small>${G.solo?(G.stage===1?'1. HINWEIS':'2. HINWEIS (GENAUER)'):(G.stage===1?'HINWEIS (1 WORT)':'HINWEIS (2 WÖRTER)')}</small><div class="w">${G.stage===1?(G.h1?esc(G.h1):'🗣️ laut gesagt'):(esc(G.h1||'🗣️')+' → '+(G.h2?esc(G.h2):'🗣️ laut gesagt'))}</div></div>`;}
function nextGuesser(){if(!G.queue.length){if(G.solo){if(G.stage===1){G.stage=2;G.queue=[0];setPanel(hintHTML());nextGuesser();}else reveal();return;}
    if(G.stage===1){const P=G.players[G.giver];G.phase='hint2';setPanel(`<div class="card cover"><div class="big">💬</div><h2>${esc(P.n)}: jetzt der 2. Hinweis!</h2><p>Gib einen Hinweis mit <b>zwei Wörtern</b>.</p><input class="inp" id="h2" maxlength="30" placeholder="z. B. reife Zitrone" style="width:100%"><div class="row" style="margin-top:10px;justify-content:center"><button class="primary" id="ok2">Weiter</button></div></div>`);$('#ok2').onclick=()=>{G.h2=$('#h2').value.trim();G.stage=2;G.queue=guessers();nextGuesser();};return;}
    reveal();return;}
  G.guesser=G.queue.shift();G.phase='guess';pick=null;showPlace();const P=G.players[G.guesser];if(!G.solo)setPanel(hintHTML());
  $('#status').innerHTML=G.solo?`Setze deinen ${G.stage}. Kegel`:`<span class="dot" style="background:${PCOL[G.guesser]}"></span> ${esc(P.n)}: setze deinen ${G.stage}. Kegel`;}
function place(){if(!pick)return;G.cones.push({p:G.guesser,x:pick.x,y:pick.y});tone(400,.06,0,'triangle',.12);pick=null;showPlace();drawCones();nextGuesser();}
function reveal(){G.phase='reveal';const s=G.solo?{x:G.target.tx,y:G.target.ty}:G.secret;const pts=G.players.map(()=>0);let giverPts=0;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const el=cell(s.x+dx,s.y+dy);if(el)el.classList.add(Math.abs(dx)<=1&&Math.abs(dy)<=1?'frame':'frame5');}cell(s.x,s.y).classList.add('target');
  for(const c of G.cones){const d=Math.max(Math.abs(c.x-s.x),Math.abs(c.y-s.y));const p=d===0?3:d===1?2:d===2?1:0;pts[c.p]+=p;if(d<=1)giverPts++;}
  if(!G.solo)pts[G.giver]+=giverPts;pts.forEach((p,i)=>G.players[i].s+=p);[523,659,784].forEach((f,k)=>tone(f,.12,k*.1,'triangle',.12));if(pts.some((p,i)=>p>=5))confetti();
  cell(s.x,s.y).scrollIntoView({block:'center',behavior:'smooth'});scores();
  const list=G.players.map((p,i)=>`<li><span class="dot" style="background:${PCOL[i]}"></span> ${esc(p.n)}: <b>+${pts[i]}</b>${!G.solo&&i===G.giver?` (Hinweisgeber, ${giverPts} Kegel im Rahmen)`:''}</li>`).join('');
  setPanel(`<div class="card"><h2>🎯 Die Farbe war ${nameOf(s.x,s.y)}</h2><div style="display:flex;gap:12px;align-items:center"><div style="width:64px;height:64px;border-radius:14px;background:${col(s.x,s.y)};flex:none"></div><ul style="margin:0;padding-left:18px">${list}</ul></div><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="primary" id="nx">Weiter ➜</button></div></div>`);
  $('#status').textContent='Auflösung!';$('#nx').onclick=G.solo?nextSolo:afterFam;}
function afterFam(){G.giver++;if(G.giver>=G.players.length){G.giver=0;G.round++;}if(G.round>=cfg.rounds){end();return;}nextFam();}
// Solo
function nextSolo(){if(G.soloRound>=10){end();return;}G.soloRound++;$('#boardWrap').classList.remove('hidden');clearBoard();G.target=soloRound();G.h1=G.target.h1;G.h2=G.target.h2;G.stage=1;G.queue=[0];scores();setPanel(hintHTML());nextGuesser();}
function end(){const r=[...G.players].map((p,i)=>({...p,i})).sort((a,b)=>b.s-a.s);sWin();confetti();
  if(G.solo){const b=KIT.get('ft-best-'+cfg.lvl,0);const rec=r[0].s>b;if(rec)KIT.set('ft-best-'+cfg.lvl,r[0].s);
    modal(`<div class="big">🎨</div><h2 style="text-align:center">${r[0].s} Punkte!</h2><p style="text-align:center">von höchstens 60 Punkten${rec?'<br>⭐ Neuer Rekord!':''}</p><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Nochmal</button></div>`,null,false).then(v=>v==='a'?start():menu());return;}
  modal(`<div class="big">🏆</div><h2 style="text-align:center">${esc(r[0].n)} gewinnt!</h2><ol>${r.map(p=>`<li><span class="dot" style="background:${PCOL[p.i]}"></span> <b>${esc(p.n)}</b>: ${p.s} Punkte</li>`).join('')}</ol><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Nochmal</button></div>`,null,false).then(v=>v==='a'?start():menu());}
function menu(){G=null;$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');const b=[1,2,3].map(l=>KIT.get('ft-best-'+l,0));$('#best').textContent=b.some(x=>x)?`Allein-Rekorde: 😊 ${b[0]} · 🙂 ${b[1]} · 😎 ${b[2]}`:'';}
$('#btnMenu').onclick=async()=>{if(!G||await confirmBox('Spiel beenden?','Beenden','Weiterspielen'))menu();};$('#btnStart').onclick=start;
addEventListener('resize',()=>{if(!G)return;const p=innerWidth<720;if(p!==portrait){buildBoard();drawCones();}});
applyTheme();plist();menu();

initHelp('farbton-jagd');
</script>
</body>
</html>
