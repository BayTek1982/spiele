<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhythmus-Trommler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#ff4fa0;--acc-ink:#ffffff}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 26px var(--shadow);border:1px solid #3a1a4a;background:#0c0614;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:auto}
.hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-family:'JetBrains Mono',monospace;font-weight:800;color:#fff}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;user-select:none;-webkit-user-select:none}
.pads button{height:84px;border-radius:50%/40%;font-size:28px;border:4px solid #0004;touch-action:none;color:#fff}
.pads button.hit{filter:brightness(1.5);transform:scale(.94)}
.songs{display:grid;gap:8px}
.song{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.song .e{font-size:30px}.song b{display:block}.song small{color:var(--mut)}.song .st{margin-left:auto;font-size:13px;text-align:right}
.song.lock{opacity:.35;cursor:default}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">🥁</span><h1>Rhythmus-<b>Trommler</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="menu">
    <div class="card"><h2>🥁 Spiel im Takt!</h2><p>Die Noten fallen herunter. Tippe auf die passende Trommel, genau wenn die Note die <b>Leuchtlinie</b> erreicht. Alle Lieder sind eigene Bayazit-Beats!</p></div>
    <div class="card"><div class="lbl">Lied wählen</div><div class="songs" id="songs"></div></div>
  </section>
  <section id="game" class="hidden">
    <div class="wrap"><canvas id="cv" width="480" height="640"></canvas><div class="hud"><div id="score">0</div><div id="combo"></div></div></div>
    <div class="pads" id="pads"></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="small" id="btnMenu">‹ Lieder</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=4"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>🥁 So spielst du Rhythmus-Trommler</h2>
<h3>Ziel</h3><p>Triff die Noten genau im Takt!</p>
<h3>So geht's</h3><ol><li>Noten fallen in 4 Bahnen herunter.</li><li>Wenn eine Note die <b>Leuchtlinie</b> unten erreicht, tippe auf die Trommel in dieser Bahn.</li><li>Genau getroffen = <b>PERFEKT</b> (100), knapp = <b>GUT</b> (50).</li><li>Viele Treffer hintereinander geben eine <b>Combo</b> – die Punkte zählen dann doppelt und dreifach!</li></ol>
<h3>Tasten am Computer</h3><p><b>D F J K</b> für die vier Trommeln.</p>
<div class="tip">💡 Ton anlassen! Hör auf den Beat – dann klappt's viel leichter.</div>`;
const W=480,H=640,HL=560;const cv=$('#cv'),ctx=cv.getContext('2d');
const LANES=[{n:'Bass',e:'🥁',c:'#ff4fa0',k:'d'},{n:'Snare',e:'🪘',c:'#ffb21a',k:'f'},{n:'Tom',e:'🔵',c:'#21c3e6',k:'j'},{n:'Becken',e:'✨',c:'#7dff8a',k:'k'}];
const SONGS=[{n:'Schneeflocken-Groove',e:'❄️',bpm:84,dens:.35,seed:7,key:[0,3,7,10],len:24},{n:'Wichtel-Polka',e:'🎅',bpm:104,dens:.45,seed:21,key:[0,4,7,9],len:28},{n:'Drachen-Tanz',e:'🐉',bpm:118,dens:.55,seed:42,key:[0,3,5,7],len:32},{n:'Turbo-Trommel',e:'🏎️',bpm:132,dens:.62,seed:99,key:[0,2,4,7],len:36},{n:'Gewitter-Profi',e:'⚡',bpm:148,dens:.72,seed:5,key:[0,3,6,10],len:40}];
let prog=KIT.get('rt-prog',{}),G=null,raf=0;
$('#pads').innerHTML=LANES.map((l,i)=>`<button data-i="${i}" style="background:radial-gradient(circle at 50% 35%,${l.c},#000a 140%)">${l.e}</button>`).join('');
function menu(){cancelAnimationFrame(raf);if(G)stopAudio();G=null;$('#game').classList.add('hidden');$('#menu').classList.remove('hidden');const unl=Object.keys(prog).length;
  $('#songs').innerHTML=SONGS.map((s,i)=>{const p=prog[i],lock=i>unl;return `<div class="song ${lock?'lock':''}" data-i="${i}"><span class="e">${lock?'🔒':s.e}</span><div><b>${s.n}</b><small>${s.bpm} BPM · ${'●'.repeat(i+1)}${'○'.repeat(4-i)}</small></div><div class="st">${p?'⭐'.repeat(p.st)+'<br>'+p.sc:''}</div></div>`;}).join('');}
$('#songs').onclick=e=>{const el=e.target.closest('.song');if(!el||el.classList.contains('lock'))return;start(+el.dataset.i);};
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function makeChart(S){const r=rng(S.seed);const beat=60/S.bpm,step=beat/2;const notes=[];const bars=S.len;
  // Grundmuster (8 Achtel pro Takt) – pro 4 Takte neu variiert
  let pat=null;for(let b=0;b<bars;b++){if(b%4===0){pat=[];for(let k=0;k<8;k++){const ln=[];if(k%4===0)ln.push(0);if(k%4===2)ln.push(1);if(r()<S.dens*.5&&k%2===1)ln.push(2);if(r()<S.dens*.35)ln.push(3);if(r()<S.dens*.3&&!ln.length)ln.push(Math.floor(r()*4));pat.push(ln);}}
    const fill=b%4===3;for(let k=0;k<8;k++){let ln=pat[k].slice();if(fill&&k>=4){ln=[2+(k%2)];if(S.dens>.5&&k===7)ln=[0,3];}
      if(b<2)ln=ln.filter(x=>x<2);for(const l of [...new Set(ln)])notes.push({t:2+ (b*8+k)*step,l,hit:false,miss:false});}}
  return {notes,beat,step,end:2+bars*8*step+1.5};}
/* Audio */
let master=null,sched=[];function drum(l,t,v=1){if(!soundOn||!actx)return;try{const g=actx.createGain();g.connect(master);
  if(l===0){const o=actx.createOscillator();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.9*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);o.start(t);o.stop(t+.3);}
  else{const len=l===3?.35:.15;const b=actx.createBuffer(1,actx.sampleRate*len,actx.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;const s=actx.createBufferSource();s.buffer=b;const f=actx.createBiquadFilter();f.type=l===3?'highpass':l===1?'bandpass':'lowpass';f.frequency.value=l===3?7000:l===1?1800:600;
    g.gain.setValueAtTime((l===3?.25:.5)*v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f).connect(g);s.start(t);
    if(l===2){const o=actx.createOscillator();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(110,t+.2);const g2=actx.createGain();g2.gain.setValueAtTime(.5*v,t);g2.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g2).connect(master);o.start(t);o.stop(t+.25);}}}catch(e){}}
function synth(f,t,d,type='triangle',v=.08){if(!soundOn||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05);sched.push(o);}catch(e){}}
function stopAudio(){try{if(master){master.gain.setValueAtTime(0,actx.currentTime);}}catch(e){}sched=[];master=null;}
function backing(S,C,t0){// eigene Begleitmusik: Bass + Akkorde + Melodie aus der Song-Tonleiter
  const r=rng(S.seed+3);const base=110;const prog4=[0,5,3,4];const sc=[0,2,3,5,7,8,10,12];
  for(let b=0;b<S.len;b++){const root=S.key[prog4[b%4]%S.key.length]+(prog4[b%4]===5?-3:0);const bt=t0+2+b*8*C.step;
    for(let k=0;k<4;k++)synth(base/2*Math.pow(2,root/12),bt+k*C.beat,C.beat*.8,'square',.035);
    for(const iv of [0,4,7])synth(base*2*Math.pow(2,(root+iv)/12),bt,C.beat*3.5,'sine',.02);
    if(b>=2)for(let k=0;k<8;k++)if(r()<.45){const n=sc[Math.floor(r()*sc.length)];synth(base*4*Math.pow(2,(root+n)/12),bt+k*C.step,C.step*.9,'triangle',.035);}}}
function start(i){const S=SONGS[i];const C=makeChart(S);G={si:i,S,C,score:0,combo:0,maxc:0,perf:0,good:0,miss:0,fx:[],laneFx:[0,0,0,0],state:'play'};
  $('#menu').classList.add('hidden');$('#game').classList.remove('hidden');
  if(actx&&soundOn){if(actx.state==='suspended')actx.resume();master=actx.createGain();master.gain.value=.9;master.connect(actx.destination);G.a0=actx.currentTime+.1;backing(S,C,G.a0);
    // Metronom-Einzähler
    for(let k=0;k<4;k++)synth(k===0?1320:880,G.a0+2-4*C.beat+k*C.beat,.05,'square',.06);}
  G.p0=performance.now()+100;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
const now=()=>G.a0!=null&&actx?actx.currentTime-G.a0:(performance.now()-G.p0)/1000;
function hit(l){if(!G||G.state!=='play')return;const t=now();G.laneFx[l]=.15;const btn=$$('#pads button')[l];btn.classList.add('hit');setTimeout(()=>btn.classList.remove('hit'),90);
  let best=null;for(const n of G.C.notes){if(n.l!==l||n.hit||n.miss)continue;const d=Math.abs(n.t-t);if(d<.16&&(!best||d<Math.abs(best.t-t)))best=n;if(n.t>t+.2)break;}
  if(best){best.hit=true;const d=Math.abs(best.t-t);const perf=d<.07;G.combo++;G.maxc=Math.max(G.maxc,G.combo);const mult=G.combo>=30?3:G.combo>=10?2:1;G.score+=(perf?100:50)*mult;perf?G.perf++:G.good++;
    G.fx.push({l,t:perf?'PERFEKT':'GUT',c:perf?'#7dff8a':'#ffd23f',life:.5});drum(l,actx?actx.currentTime:0,1);}
  else{drum(l,actx?actx.currentTime:0,.4);}}
function step(){const t=now();for(const n of G.C.notes){if(!n.hit&&!n.miss&&t-n.t>.16){n.miss=true;G.miss++;G.combo=0;G.fx.push({l:n.l,t:'DANEBEN',c:'#ff6b6b',life:.5});}}
  for(const f of G.fx)f.life-=1/60;G.fx=G.fx.filter(f=>f.life>0);G.laneFx=G.laneFx.map(v=>Math.max(0,v-1/60));
  $('#score').textContent=G.score;$('#combo').textContent=G.combo>=5?`🔥 ${G.combo}er Combo${G.combo>=30?' ×3':G.combo>=10?' ×2':''}`:'';
  if(t>G.C.end&&G.state==='play'){G.state='end';end();}}
function draw(){const t=now();const lw=W/4;ctx.fillStyle='#0c0614';ctx.fillRect(0,0,W,H);
  const pulse=Math.max(0,1-((t-2)%(G.C.beat))/G.C.beat);
  for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#140a20':'#180c26';ctx.fillRect(i*lw,0,lw,H);if(G.laneFx[i]>0){const g=ctx.createLinearGradient(0,HL,0,0);g.addColorStop(0,LANES[i].c+'88');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(i*lw,0,lw,HL);}}
  ctx.strokeStyle='#ffffff10';for(let k=0;k<20;k++){const bt=Math.ceil(t/G.C.beat)*G.C.beat+k*G.C.beat;const y=HL-(bt-t)*360;if(y<0)break;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle=`rgba(255,79,160,${.4+pulse*.6})`;ctx.fillRect(0,HL-3,W,6);ctx.shadowColor='#ff4fa0';ctx.shadowBlur=18*pulse;ctx.fillRect(0,HL-1,W,2);ctx.shadowBlur=0;
  for(let i=0;i<4;i++){ctx.strokeStyle=LANES[i].c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(i*lw+lw/2,HL,26,0,7);ctx.stroke();}
  for(const n of G.C.notes){if(n.hit)continue;const y=HL-(n.t-t)*360;if(y<-30)break;if(y>H+30)continue;const x=n.l*lw+lw/2;ctx.globalAlpha=n.miss?.3:1;ctx.fillStyle=LANES[n.l].c;ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.fill();ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(x-6,y-6,7,0,7);ctx.fill();ctx.globalAlpha=1;}
  ctx.textAlign='center';ctx.font='900 20px Nunito';for(const f of G.fx){ctx.globalAlpha=f.life*2;ctx.fillStyle=f.c;ctx.fillText(f.t,f.l*lw+lw/2,HL-50-(.5-f.life)*60);}ctx.globalAlpha=1;
  if(t<2){ctx.fillStyle='#fff';ctx.font='900 64px JetBrains Mono';const c=Math.ceil((2-t)/G.C.beat);ctx.fillText(c>4?'':String(c),W/2,H/2);}
  const prog=Math.min(1,t/G.C.end);ctx.fillStyle='#ffffff22';ctx.fillRect(0,H-6,W,6);ctx.fillStyle='#ff4fa0';ctx.fillRect(0,H-6,W*prog,6);}
function loop(){if(G){step();draw();}raf=requestAnimationFrame(loop);}
function end(){const tot=G.C.notes.length;const acc=(G.perf+G.good*.5)/tot;const st=acc>=.9?3:acc>=.7?2:acc>=.45?1:0;const old=prog[G.si];
  if(st&&(!old||G.score>old.sc||st>old.st)){prog[G.si]={st:Math.max(st,old?.st||0),sc:Math.max(G.score,old?.sc||0)};KIT.set('rt-prog',prog);}if(st>=2){sWin();confetti();}
  modal(`<div class="big">${st?'🥁🎉':'🥁'}</div><h2 style="text-align:center">${['Weiter üben!','Gut gemacht!','Super Rhythmus!','Trommel-Profi!'][st]}</h2><p style="text-align:center;font-size:24px">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</p><p style="text-align:center"><b>${G.score}</b> Punkte · Treffer ${Math.round(acc*100)} %<br>Perfekt ${G.perf} · Gut ${G.good} · Daneben ${G.miss}<br>Beste Combo: ${G.maxc}</p><div class="row"><button data-v="m">Lieder</button><button class="primary" data-v="a">Nochmal</button></div>`,null,false).then(v=>{const i=G.si;stopAudio();v==='a'?start(i):menu();});}
const press=e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();hit(+b.dataset.i);};$('#pads').addEventListener('pointerdown',press);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();hit(Math.min(3,Math.floor((e.clientX-r.left)/r.width*4)));});
document.addEventListener('keydown',e=>{if(e.repeat)return;const i=LANES.findIndex(l=>l.k===e.key.toLowerCase());if(i>=0)hit(i);});
$('#btnMenu').onclick=menu;applyTheme();menu();

initHelp('rhythmus-trommler');
</script>
</body>
