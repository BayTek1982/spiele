<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayo-Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#ff8a1a;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


:root{--maxw:1000px}
.wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 26px var(--shadow);border:1px solid var(--line);touch-action:none;user-select:none;image-rendering:pixelated}
canvas{display:block;width:100%;height:auto}
.hud{position:absolute;top:6px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-family:'JetBrains Mono',monospace;font-weight:800;color:#fff;text-shadow:0 2px 0 #000a;font-size:15px}
.ctrl{display:flex;justify-content:space-between;gap:12px;margin-top:10px;user-select:none;-webkit-user-select:none}
.ctrl .lr{display:flex;gap:10px}
.ctrl button{width:84px;height:84px;padding:0;font-size:30px;border-radius:22px;touch-action:none}
.ctrl button.on{background:var(--acc);color:#fff}
.ctrl .jump{width:110px;height:110px;border-radius:50%;font-size:22px;font-weight:900}
@media(min-width:900px) and (pointer:fine){.ctrl{display:none}}
.worlds{display:grid;gap:10px}
.wd{border-radius:16px;padding:12px;border:1px solid var(--line);background:var(--card2)}
.wd h3{margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:15px}
.lvrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lv{padding:10px;border-radius:12px;background:var(--card);border:2px solid var(--line);cursor:pointer;font-weight:900;text-align:center}
.lv small{display:block;color:var(--mut);font-weight:700;font-size:12px}
.lv.lock{opacity:.35;cursor:default}.lv.done{border-color:#2fa35a}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">🦊</span><h1>Bayo-<b>Land</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="menu">
    <div class="card"><h2>🦊 Hilf Bayo, die Kristalle zurückzuholen!</h2><p>Der freche <b>Schleim-König</b> hat alle Kristalle aus Bayo-Land gestohlen. Lauf, spring und hüpfe durch 4 Welten mit je 2 Folgen bis zur Zielfahne!</p></div>
    <div class="worlds" id="worlds"></div>
    <div class="note" id="tot" style="text-align:center"></div>
  </section>
  <section id="game" class="hidden">
    <div class="wrap"><canvas id="cv" width="640" height="384"></canvas><div class="hud"><div id="hLives"></div><div id="hLvl"></div><div id="hCoins"></div></div></div>
    <div class="ctrl"><div class="lr"><button id="bL">◀</button><button id="bR">▶</button></div><button class="jump" id="bJ">SPRUNG</button></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="small" id="btnPause">⏸ Pause</button><button class="small" id="btnMenu">‹ Weltkarte</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js"></script><script src="/online/online.js"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>🦊 So spielst du Bayo-Land</h2>
<h3>Ziel</h3><p>Lauf mit Bayo bis zur <b>Zielfahne</b> 🚩 am Ende jeder Folge. Sammle unterwegs viele <b>Kristalle</b> 💎!</p>
<h3>Steuerung</h3><ul><li><b>◀ ▶</b> laufen</li><li><b>SPRUNG</b> springen – länger drücken = höher springen</li><li>Am Computer: Pfeiltasten + Leertaste</li></ul>
<h3>Tipps</h3><ul><li>Spring den Schleimis, Käfern und Bienen <b>auf den Kopf</b> – dann sind sie weg!</li><li>Läufst du seitlich gegen sie, verlierst du ein Leben (oder dein Schutzschild).</li><li>Stoß mit dem Kopf von unten gegen <b>!-Kisten</b> – darin sind Kristalle oder eine <b>Schutz-Beere</b> 🫐.</li><li><b>Ziegel</b> kannst du von unten zerschlagen.</li><li>Trampoline 🟣 schleudern dich hoch hinauf.</li><li>Stacheln und Abgründe sind gefährlich!</li><li>Die <b>Flagge in der Mitte</b> ist ein Kontrollpunkt.</li><li>100 Kristalle = 1 Extra-Leben!</li></ul>`;
const TS=32,VW=640,VH=384,ROWS=12;const cv=$('#cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
/* ---------- Level-Bausteine (12 Zeilen) ---------- */
const CH={
start:['        ','        ','        ','        ','        ','        ','        ','        ','        ',' P      ','########','########'],
flat:['            ','            ','            ','            ','            ','    ooo     ','            ','            ','            ','       E    ','############','############'],
gap2:['          ','          ','          ','          ','          ','    oo    ','          ','          ','          ','          ','####  ####','####  ####'],
gap3:['           ','           ','           ','           ','     o     ','    o o    ','           ','           ','           ','           ','####   ####','####   ####'],
stairs:['              ','              ','              ','              ','       o      ','      ###     ','     ####   o ','    #####     ','   ######   E ','  #######     ','##############','##############'],
boxes:['              ','              ','              ','              ','              ','   B!B!B      ','              ','              ','              ','        E     ','##############','##############'],
clouds:['              ','              ','              ','              ','              ','              ','      oo      ','              ','    ------    ','              ','###        ###','###        ###'],
logs:['              ','              ','              ','              ','              ','       o      ','              ','       #   E  ','   #   #      ','   #   #   #  ','##############','##############'],
spikes:['            ','            ','            ','            ','            ','    ooo     ','            ','            ','            ','    SSS     ','############','############'],
bees:['              ','              ','              ','     Z        ','   o   o   o  ','              ','           Z  ','              ','              ','              ','##############','##############'],
spring:['              ','  oooo        ','              ','  ######      ','              ','              ','              ','              ','              ','          J   ','##############','##############'],
beetles:['              ','              ','              ','              ','              ','    o o o     ','              ','              ','              ','   K     K    ','##############','##############'],
high:['              ','              ','              ','              ','              ',' oooooooo     ','              ','-########-    ','              ','          E   ','##############','##############'],
check:['      ','      ','      ','      ','      ','      ','      ','      ','      ','  c   ','######','######'],
pit4:['              ','              ','              ','              ','              ','              ','      o       ','              ','     ---      ','              ','####      ####','####      ####'],
tower:['              ','              ','              ','       !      ','              ','              ','    ##   E    ','    ##  ###   ','  ####  ###   ','  ####  ###   ','##############','##############'],
goal:['            ','            ','       F    ','       |    ','       |    ','       |    ','       |    ','       |    ','       |    ','       |    ','############','############']};
const EASY=['flat','gap2','boxes','logs','bees','spring','stairs'],MID=['gap3','clouds','spikes','beetles','high','tower','pit4'];
const WORLDS=[{n:'Sonnenwiese',e:'🌳',sky:['#6fc3ff','#c9ecff'],gr:'#5fbf3a',dirt:'#9a5a2a',deco:'hills',music:[0,2,4,7,9]},{n:'Kristallhöhle',e:'💎',sky:['#1a1030','#3a2a5a'],gr:'#7a6a9a',dirt:'#3a2a4a',deco:'cave',music:[0,3,5,7,10]},{n:'Sandwüste',e:'🌵',sky:['#ffcf7a','#fff1cf'],gr:'#e8c06a',dirt:'#b8864a',deco:'desert',music:[0,1,4,5,7]},{n:'Eis-Schloss',e:'🏰',sky:['#2a3a6a','#8ab4e8'],gr:'#dff4ff',dirt:'#7aa4c8',deco:'ice',music:[0,2,3,7,8]}];
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function buildLevel(li){const r=rng(1234+li*977);const w=Math.floor(li/2);const n=9+li*2;const parts=['start'];
  for(let k=0;k<n;k++){const pool=k<2?EASY:(r()<.35+li*.06?MID:EASY);let c=pool[Math.floor(r()*pool.length)];if(parts[parts.length-1]===c)c=pool[(pool.indexOf(c)+1)%pool.length];parts.push(c);if(k===Math.floor(n/2))parts.push('check');}
  parts.push('flat','goal');const rows=Array.from({length:ROWS},()=>'');for(const p of parts)for(let y=0;y<ROWS;y++)rows[y]+=CH[p][y];
  // Kisten-Inhalt deterministisch
  const map=rows.map(s=>s.split(''));const ents=[];let start=null,check=null,goal=null;const boxes={};
  for(let y=0;y<ROWS;y++)for(let x=0;x<map[0].length;x++){const ch=map[y][x];
    if(ch==='P'){start=[x,y];map[y][x]=' ';}if(ch==='c'){check=[x,y];map[y][x]=' ';}if(ch==='F'){goal=x;}
    if('EKZ'.includes(ch)){ents.push({t:ch,x:x*TS,y:y*TS,vx:ch==='K'?-90:-50,vy:0,alive:true,y0:y*TS,ph:r()*6});map[y][x]=' ';}
    if(ch==='!')boxes[x+','+y]=r()<.35?'berry':'coins';}
  return {map,ents,start,check,goal,boxes,w:map[0].length,world:w};}
/* ---------- Spielzustand ---------- */
let prog=KIT.get('bayo-prog',{}),G=null,raf=0,last=0;const keys={l:false,r:false,j:false};let jumpPressed=false;
function worldsMenu(){stopMusic();cancelAnimationFrame(raf);G=null;$('#game').classList.add('hidden');$('#menu').classList.remove('hidden');let unl=0;while(prog[unl])unl++;
  $('#worlds').innerHTML=WORLDS.map((w,wi)=>`<div class="wd" style="background:linear-gradient(135deg,${w.sky[0]}33,${w.sky[1]}22)"><h3>${w.e} Welt ${wi+1}: ${w.n}</h3><div class="lvrow">${[0,1].map(k=>{const li=wi*2+k;const p=prog[li],lock=li>unl;return `<div class="lv ${lock?'lock':''} ${p?'done':''}" data-i="${li}">${lock?'🔒':''} Folge ${wi+1}-${k+1}<small>${p?`💎 ${p.c} · ⭐ ${p.s}`:lock?'gesperrt':'neu!'}</small></div>`;}).join('')}</div></div>`).join('');
  const tot=Object.values(prog).reduce((a,p)=>a+p.c,0);$('#tot').textContent=`💎 ${tot} Kristalle gesammelt · ${Object.keys(prog).length} von 8 Folgen geschafft`;}
$('#worlds').onclick=e=>{const el=e.target.closest('.lv');if(!el||el.classList.contains('lock'))return;start(+el.dataset.i);};
function start(li,keepLives){const L=buildLevel(li);G={li,L,W:WORLDS[L.world],p:null,coins:0,score:0,lives:keepLives??3,cam:0,parts:[],pops:[],t:0,state:'play',useCheck:false,shake:0};spawn();
  $('#menu').classList.add('hidden');$('#game').classList.remove('hidden');$('#hLvl').textContent=`${G.W.e} ${L.world+1}-${li%2+1}`;hud();startMusic(G.W.music,li);last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function spawn(){const s=G.useCheck&&G.L.check?G.L.check:G.L.start;G.p={x:s[0]*TS+6,y:s[1]*TS,w:20,h:28,vx:0,vy:0,on:false,face:1,shield:G.p?.shield&&G.state!=='dead'?true:false,inv:0,coyote:0,jumpBuf:0,anim:0};G.state='play';G.cam=Math.max(0,G.p.x-VW/3);}

function draw(){drawBG();drawTiles();for(const e of G.L.ents)drawEnemy(e);drawBayo();
  for(const q of G.parts){ctx.globalAlpha=Math.max(0,Math.min(1,q.life*2));ctx.fillStyle=q.c;ctx.fillRect(q.x-G.cam-3,q.y-3,6,6);}ctx.globalAlpha=1;
  for(const q of G.pops){ctx.globalAlpha=Math.min(1,q.life*3);ctx.textAlign='left';ctx.textBaseline='top';if(q.txt){ctx.font='900 16px Nunito';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(q.t,q.x-G.cam,q.y);ctx.fillText(q.t,q.x-G.cam,q.y);}else{ctx.font='22px sans-serif';ctx.fillText(q.t,q.x-G.cam,q.y);}}ctx.globalAlpha=1;
  if(G.paused){ctx.fillStyle='#0008';ctx.fillRect(0,0,VW,VH);ctx.fillStyle='#fff';ctx.font='900 36px JetBrains Mono';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PAUSE',VW/2,VH/2);}}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(G){if(!G.paused)step(dt);draw();}raf=requestAnimationFrame(loop);}
/* ---------- Eigene Chiptune-Musik ---------- */
let mus=null;function startMusic(scale,seed){stopMusic();if(!soundOn||!actx)return;if(actx.state==='suspended')actx.resume();const r=rng(77+seed*31);const bpm=132+(seed%4)*6,st=60/bpm/2;
  const mel=[];for(let k=0;k<32;k++)mel.push(r()<.75?scale[Math.floor(r()*scale.length)]+(r()<.3?12:0):null);const bass=[0,0,5,5,7,7,3,3].map(v=>scale.includes(v)?v:scale[0]);
  const g=actx.createGain();g.gain.value=.5;g.connect(actx.destination);mus={g,step:0,next:actx.currentTime+.1,iv:null};const note=(f,t,d,type,v)=>{const o=actx.createOscillator(),a=actx.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(g);o.start(t);o.stop(t+d+.02);};
  mus.iv=setInterval(()=>{if(!mus)return;while(mus.next<actx.currentTime+.25){const k=mus.step%32,t=mus.next;const m=mel[k];if(m!=null)note(392*Math.pow(2,m/12),t,st*.9,'square',.035);if(k%2===0)note(98*Math.pow(2,bass[(k>>2)%8]/12),t,st*1.6,'triangle',.09);if(k%4===0){note(60,t,.08,'sine',.12);}if(k%4===2){const b=actx.createBufferSource(),buf=actx.createBuffer(1,2000,actx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);b.buffer=buf;const a=actx.createGain();a.gain.value=.05;b.connect(a).connect(g);b.start(t);}
      mus.step++;mus.next+=st;}},60);}
function stopMusic(){if(mus){clearInterval(mus.iv);try{mus.g.gain.setValueAtTime(0,actx.currentTime);}catch(e){}mus=null;}}
window.onSound=()=>{if(!soundOn)stopMusic();else if(G&&G.state==='play')startMusic(G.W.music,G.li);};
/* ---------- Steuerung ---------- */
function hold(id,k){const b=$(id);const on=e=>{e.preventDefault();if(k==='j'&&!keys.j)jumpPressed=true;keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}},off=()=>{keys[k]=false;b.classList.remove('on');};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.oncontextmenu=e=>e.preventDefault();}
hold('#bL','l');hold('#bR','r');hold('#bJ','j');
const KM={ArrowLeft:'l',ArrowRight:'r',a:'l',d:'r',' ':'j',ArrowUp:'j',w:'j',z:'j'};
document.addEventListener('keydown',e=>{const k=KM[e.key];if(!k||!G)return;e.preventDefault();if(k==='j'&&!keys.j)jumpPressed=true;keys[k]=true;});document.addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=false;});
$('#btnPause').onclick=()=>{if(!G)return;G.paused=!G.paused;$('#btnPause').textContent=G.paused?'▶ Weiter':'⏸ Pause';if(G.paused)stopMusic();else startMusic(G.W.music,G.li);last=performance.now();};
$('#btnMenu').onclick=worldsMenu;applyTheme();worldsMenu();

initHelp('bayo-land');
</script>
