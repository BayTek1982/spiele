<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krimi-Detektiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#c9a227;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.case{background:linear-gradient(135deg,#3a2c12,#1b140a);color:#f5e6c4;border:1px solid #6b5420;border-radius:16px;padding:14px;margin-bottom:12px;font-size:15.5px;line-height:1.5}
.case h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;color:#ffd76a;font-size:18px}
.sus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.s{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 4px 6px;text-align:center;cursor:pointer;position:relative;transition:opacity .2s}
.s .face{font-size:40px;line-height:1.1;position:relative;display:inline-block}
.s .acc{position:absolute;left:0;right:0;font-size:20px}
.s .acc.h{top:-12px}.s .acc.g{top:12px;font-size:17px}
.s .nm{font-weight:900;font-size:14px}
.s .tr{font-size:11.5px;color:var(--mut);line-height:1.35;margin-top:2px}
.s .scarf{display:inline-block;width:22px;height:7px;border-radius:4px;vertical-align:middle}
.s.out{opacity:.3}.s.out::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;color:#e0453a;font-weight:900}
.places{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.places button{padding:10px 4px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.places button span{font-size:26px}
.places button.seen{opacity:.45}
.clues{display:grid;gap:6px;margin-top:4px}
.clue{background:var(--card2);border-left:4px solid var(--acc);border-radius:8px;padding:8px 10px;font-size:14.5px;animation:cin .4s}
@keyframes cin{from{opacity:0;transform:translateX(-10px)}}
.steps{font-family:'JetBrains Mono',monospace;text-align:center;color:var(--mut);margin:6px 0}
.mag{font-size:22px}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">🕵️</span><h1>Krimi-<b>Detektiv</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="setup">
    <div class="card" style="text-align:center"><div class="big">🕵️</div><h2>Werde zum Meisterdetektiv!</h2><p>Jemand hat etwas gestohlen! Untersuche die Orte, sammle Hinweise und finde den Täter. Jeder Fall ist anders.</p>
      <div class="lbl" style="margin-top:8px">Schwierigkeit</div><div class="seg" id="lvlSeg"><button data-v="1">🐣 Junior (6 Verdächtige)</button><button data-v="2">🕵️ Profi (9 Verdächtige)</button></div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="primary" id="btnStart">Neuer Fall 🔍</button></div></div>
    <div class="note" id="stat" style="text-align:center"></div>
  </section>
  <section id="game" class="hidden">
    <div class="case" id="case"></div>
    <div class="lbl">Verdächtige (antippen = ausschließen)</div>
    <div class="sus" id="sus"></div>
    <div class="card"><div class="lbl">🔍 Orte untersuchen</div><div class="places" id="places"></div><div class="steps" id="steps"></div></div>
    <div class="card"><div class="lbl">📝 Notizbuch</div><div class="clues" id="clues"><div class="note">Noch keine Hinweise.</div></div></div>
    <div class="row" style="justify-content:center"><button class="primary" id="btnAccuse">👉 Täter beschuldigen</button><button class="small" id="btnMenu">‹ Menü</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=9"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>🕵️ So spielst du Krimi-Detektiv</h2>
<h3>Der Fall</h3><p>Etwas wurde gestohlen! Einer der Verdächtigen ist der Täter.</p>
<h3>So ermittelst du</h3><ol><li>Tippe auf einen <b>Ort</b> und untersuche ihn. Dort findest du einen <b>Hinweis</b> (z. B. „Der Täter trägt eine Brille“). Er kommt in dein Notizbuch.</li><li>Schau dir die Verdächtigen genau an: Hut? Brille? Schalfarbe? Groß oder klein?</li><li>Tippe Verdächtige an, die <b>nicht</b> passen – sie werden durchgestrichen.</li><li>Bist du sicher? Dann <b>👉 Täter beschuldigen</b>!</li></ol>
<h3>Sterne</h3><p>Je weniger Orte du brauchst, desto mehr ⭐ bekommst du. Aber Vorsicht: Beschuldigst du den Falschen, entkommt der Dieb!</p>
<div class="tip">💡 Nicht jeder Ort hat einen Hinweis – manchmal findest du nur Staub. Und manche Zeugen erzählen nur, was der Täter <b>nicht</b> hatte.</div>`;
const ANIM=[['🦊','Fuchs Frida'],['🐻','Bär Bruno'],['🐰','Hase Hanni'],['🐱','Katze Kiki'],['🐶','Hund Hugo'],['🐷','Schwein Sepp'],['🐸','Frosch Fritz'],['🐵','Affe Anton'],['🦉','Eule Ella'],['🐼','Panda Paul'],['🐭','Maus Mia'],['🦁','Löwe Leo'],['🐨','Koala Karl'],['🦝','Waschbär Willi']];
const SC={rot:'#e0453a',blau:'#2f7de1',grün:'#2fa35a',gelb:'#f2c21b'};
const LOOT=[['🎂','Omas Geburtstagskuchen'],['🏆','der goldene Fußball-Pokal'],['👑','die Krone vom Faschingsfest'],['🍪','die ganze Keksdose'],['💎','der funkelnde Glitzerstein'],['🧸','der Lieblings-Teddy'],['🍫','die Riesen-Schokolade']];
const PL=[['🍳','Küche'],['🌳','Garten'],['🛋️','Wohnzimmer'],['🚪','Keller'],['🪜','Dachboden'],['🚗','Garage'],['🛏️','Kinderzimmer'],['🌷','Blumenbeet'],['🐕','Hundehütte']];
let lvl=+KIT.get('kd-lvl',1),G=null;let stat=KIT.get('kd-st',{solved:0,stars:0,lost:0});
function bindSeg(id,val,cb){const el=$(id);const set=v=>{el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==String(v)));};set(val);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;set(b.dataset.v);cb(b.dataset.v);};}
bindSeg('#lvlSeg',lvl,v=>{lvl=+v;KIT.set('kd-lvl',+v);});
const rnd=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const ATTR={hut:[true,false],brille:[true,false],schal:['rot','blau','grün','gelb'],gr:['groß','klein']};
function clueText(k,v,neg){if(k==='hut')return (v!==neg)?['🎩 Ein Zeuge sagt: „Der Dieb hatte einen <b>Hut</b> auf!“','🎩 Am Fenster hängt ein Hutband – der Täter trägt einen <b>Hut</b>.']:['🙅 Die Nachbarin sagt: „Einen Hut hatte der Dieb <b>nicht</b> auf.“','💇 Am Tatort liegen Haare – der Täter trug <b>keinen Hut</b>.'];
  if(k==='brille')return (v!==neg)?['👓 Auf dem Tisch liegt ein Brillenputztuch – der Täter trägt eine <b>Brille</b>.','👓 Ein Zeuge sah etwas im Licht blitzen: eine <b>Brille</b>!']:['👀 „Der Dieb hatte <b>keine Brille</b>, da bin ich sicher!“, sagt der Briefträger.'];
  if(k==='schal')return neg?[`🧶 Der Dieb hatte <b>keinen ${v}en Schal</b> – sagt das Mädchen von nebenan.`]:[`🧶 An einem Nagel hängt ein <b>${v}er</b> Wollfaden – vom Schal des Täters!`,`🧣 Auf dem Foto der Überwachungskamera sieht man einen <b>${v}en Schal</b>.`];
  if(k==='gr')return (v==='groß')!==neg?['👣 Die Fußspuren sind sehr tief – der Täter ist <b>groß</b>.','📏 Der Täter kam an das oberste Regal – er ist <b>groß</b>.']:['🐾 Die Fußspuren sind winzig – der Täter ist <b>klein</b>.','🕳️ Der Täter ist durch ein kleines Loch im Zaun geschlüpft – er ist <b>klein</b>.'];}
function gen(){const n=lvl===1?6:9;
  for(let tries=0;tries<500;tries++){const animals=shuffle(ANIM.slice()).slice(0,n);const sus=animals.map(([e,nm])=>({e,nm,hut:Math.random()<.5,brille:Math.random()<.5,schal:rnd(ATTR.schal),gr:rnd(ATTR.gr)}));
    const cul=Math.floor(Math.random()*n),c=sus[cul];
    // Kandidaten-Hinweise: positiv (Täter hat X) und negativ (Täter hat nicht Y)
    const cand=[];for(const k of ['hut','brille','gr','schal'])cand.push({k,v:c[k],neg:false,f:s=>s[k]===c[k]});
    for(const col of ATTR.schal)if(col!==c.schal)cand.push({k:'schal',v:col,neg:true,f:s=>s.schal!==col});
    shuffle(cand);// minimale Menge, die eindeutig ist
    let left=sus.slice(),used=[];for(const cl of cand){const nl=left.filter(cl.f);if(nl.length<left.length){used.push(cl);left=nl;}if(left.length===1)break;}
    if(left.length!==1||used.length<(lvl===1?2:3)||used.length>5)continue;
    const places=shuffle(PL.slice()).slice(0,lvl===1?6:8);const clues=shuffle(used.map(u=>({...u,t:rnd(clueText(u.k,u.v,u.neg))})));
    const pc=places.map((p,i)=>({p,clue:clues[i]||null}));shuffle(pc);
    return {sus,cul,pc,loot:rnd(LOOT),seen:new Set(),out:new Set(),found:[],needed:used.length};}}
function start(){G=gen();$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');
  $('#case').innerHTML=`<h2>📁 Fall Nr. ${100+stat.solved+stat.lost+1}</h2>Oh nein! <b>${G.loot[1]} ${G.loot[0]}</b> ist verschwunden! Alle ${G.sus.length} Verdächtigen waren heute im Haus. Untersuche die Orte und finde heraus, <b>wer es war</b>!`;render();[262,330,392,311].forEach((f,k)=>tone(f,.25,k*.22,'triangle',.1));}
function render(){if(KON)kBar();$('#sus').innerHTML=G.sus.map((s,i)=>`<div class="s ${G.out.has(i)?'out':''}" data-i="${i}"><div class="face">${s.e}${s.hut?'<span class="acc h">🎩</span>':''}${s.brille?'<span class="acc g">👓</span>':''}</div><div class="nm">${s.nm}</div><div class="tr">${s.hut?'🎩 Hut':'– kein Hut'}<br>${s.brille?'👓 Brille':'– keine Brille'}<br><span class="scarf" style="background:${SC[s.schal]}"></span> ${s.schal}<br>${s.gr==='groß'?'📏 groß':'🐾 klein'}</div></div>`).join('');
  $('#places').innerHTML=G.pc.map((p,i)=>`<button class="${G.seen.has(i)?'seen':''}" data-i="${i}"><span>${p.p[0]}</span>${p.p[1]}</button>`).join('');
  $('#steps').textContent=`Untersucht: ${G.seen.size} von ${G.pc.length} Orten`;
  $('#clues').innerHTML=G.found.length?G.found.map(t=>`<div class="clue">${t}</div>`).join(''):'<div class="note">Noch keine Hinweise.</div>';}
$('#sus').onclick=e=>{const el=e.target.closest('.s');if(!el)return;const i=+el.dataset.i;G.out.has(i)?G.out.delete(i):G.out.add(i);tone(G.out.has(i)?300:500,.06);render();};
$('#places').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;if(G.seen.has(i))return;if(KON){if(!kMy())return;NET.emit({t:'v',i});kWho=(NET.players().find(p=>p.uid===NET.myUid())||{}).name||'';}visit(i);};
async function visit(i){const b=$(`#places button[data-i="${i}"]`);if(G.seen.has(i))return;G.seen.add(i);const p=G.pc[i];
  b.innerHTML='<span class="mag">🔍</span>suche …';for(let k=0;k<3;k++){tone(700+k*90,.05,k*.18,'sine',.08);}await sleep(650);
  if(!G.dust||!G.dust.length)G.dust=shuffle(['🕸️ Hier ist nur Staub und eine Spinne.','🧦 Du findest eine alte Socke – kein Hinweis.','🐞 Nur ein Marienkäfer. Nichts Verdächtiges.','📦 Lauter Kartons, aber keine Spur.','🍂 Ein paar Blätter, sonst nichts.','🔦 Du leuchtest überall hin – leider keine Spur.']);const DU=['🕸️ Hier ist nur Staub und eine Spinne.','🧦 Du findest eine alte Socke – kein Hinweis.','🐞 Nur ein Marienkäfer. Nichts Verdächtiges.','📦 Lauter Kartons, aber keine Spur.','🍂 Ein paar Blätter, sonst nichts.','🔦 Du leuchtest überall hin – leider keine Spur.'];const t=p.clue?p.clue.t:(KON?DU[i%DU.length]:G.dust.pop());
  G.found.push(`<b>${p.p[1]}:</b> ${t}${KON&&kWho?` <small>(${esc(kWho)})</small>`:''}`);if(p.clue)tone(990,.15,0,'triangle',.15);if(KON)kNext();render();}
$('#btnAccuse').onclick=async()=>{if(KON&&!kMy()){infoBox('<p>Warte, bis du dran bist!</p>');return;}const left=G.sus.map((s,i)=>i).filter(i=>!G.out.has(i));
  const pick=await modal(`<h2>👉 Wer war es?</h2><div class="sus">${G.sus.map((s,i)=>`<button data-v="${i}" style="${G.out.has(i)?'opacity:.35':''}"><div style="font-size:30px">${s.e}</div>${s.nm.split(' ')[1]}</button>`).join('')}</div><div class="row"><button data-v="x">Abbrechen</button></div>`);
  if(pick==null||pick==='x')return;if(KON){if(!kMy())return;NET.emit({t:'acc',i:+pick});kAcc(+pick,NET.myUid());return;}const i=+pick,ok=i===G.cul,c=G.sus[G.cul];
  if(ok){const extra=G.seen.size-G.needed;const stars=G.seen.size<=G.needed+1?3:G.seen.size<=G.needed+3?2:1;stat.solved++;stat.stars+=stars;KIT.set('kd-st',stat);sWin();confetti();
    modal(`<div class="big">🚔 ${c.e}</div><h2 style="text-align:center">Fall gelöst!</h2><p style="text-align:center"><b>${c.nm}</b> war's! ${G.loot[0]} ist wieder da.<br>${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}<br><small>Du hast ${G.seen.size} Orte untersucht.</small></p><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Nächster Fall</button></div>`,null,false).then(v=>v==='a'?start():menu());}
  else{stat.lost++;KIT.set('kd-st',stat);sLose();modal(`<div class="big">💨 ${c.e}</div><h2 style="text-align:center">Falscher Verdacht!</h2><p style="text-align:center">${G.sus[i].nm} war unschuldig. Der echte Dieb war <b>${c.nm}</b> – und ist entkommen!</p><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Neuer Fall</button></div>`,null,false).then(v=>v==='a'?start():menu());}};
function menu(){$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');$('#stat').textContent=stat.solved+stat.lost?`Gelöste Fälle: ${stat.solved} · ⭐ ${stat.stars} · Entkommen: ${stat.lost}`:'';}
$('#btnMenu').onclick=menu;$('#btnStart').onclick=start;applyTheme();menu();
/* ---------- Online: zusammen ermitteln, abwechselnd ---------- */
var KON=false,kPl=[],kTurn=0,kOut=new Set(),kWho='',kClose=null;
function kAlive(){return kPl.filter(p=>!kOut.has(p.uid));}
function kCur(){const a=kAlive();return a.length?a[kTurn%a.length]:null;}
function kMy(){const c=kCur();return c&&c.uid===NET.myUid()&&!G.done;}
function kNext(){kTurn++;}
function kBar(){let b=document.getElementById('kBar');if(!b){b=document.createElement('div');b.id='kBar';b.className='card';b.style.cssText='text-align:center;font-weight:900;margin:8px 0';$('#places').before(b);}
  const c=kCur();b.innerHTML=(G.done?'🏁 Fall beendet':c&&c.uid===NET.myUid()?'👉 Du bist dran: Untersuche einen Ort – oder klage an!':`⏳ ${esc(c?c.name:'?')} ist dran …`)+'<div class="note" style="font-weight:700">'+kPl.map(p=>`${esc(p.av||'')} ${esc(p.name)}${kOut.has(p.uid)?' ❌':''}`).join(' · ')+'</div>';}
function kAcc(i,uid){const who=kPl.find(p=>p.uid===uid);const ok=i===G.cul,c=G.sus[G.cul];const me=uid===NET.myUid();
  if(ok){G.done=true;render();if(me){sWin();confetti();}else sLose();kEnd(`<div class="big">🚔 ${c.e}</div><h2 style="text-align:center">${me?'Du hast':esc(who?who.name:'?')+' hat'} den Fall gelöst!</h2><p style="text-align:center"><b>${c.nm}</b> war's! ${G.loot[0]} ist wieder da.<br><small>${G.seen.size} Orte untersucht.</small></p>`);return;}
  kOut.add(uid);tone(200,.25);ONLINE.toast(`💨 ${who?who.name:'?'} hat ${G.sus[i].nm} beschuldigt – falsch! ${who?who.name:''} ist raus.`);if(!G.out.has(i)){G.out.add(i);}
  if(!kAlive().length){G.done=true;render();sLose();kEnd(`<div class="big">💨 ${c.e}</div><h2 style="text-align:center">Der Dieb ist entkommen!</h2><p style="text-align:center">Es war <b>${c.nm}</b>.</p>`);return;}render();}
function kEnd(h){setTimeout(()=>modal(h+`<div class="row">${NET.isHost()?'<button class="primary" data-v="a">🔄 Neuer Fall</button>':''}<button data-v="l">Verlassen</button></div>`,(b,c)=>{kClose=c;},false).then(v=>{kClose=null;if(v==='a')NET.clearData().then(()=>NET.again());else if(v==='l'){NET.leave();kOff();}}),700);}
function kOff(){KON=false;const b=document.getElementById('kBar');if(b)b.remove();menu();}
function kDo(ev){if(!G)return;kWho=(kPl.find(p=>p.uid===ev.by)||{}).name||'';if(ev.t==='v')visit(ev.i);else if(ev.t==='acc')kAcc(ev.i,ev.by);}
if(window.NET&&NET.supported()){NET.coop({title:'Krimi-Detektiv',label:'Online zusammen ermitteln',note:'Ihr untersucht abwechselnd die Orte – alle sehen jeden Hinweis. Wer zuerst den richtigen Täter anklagt, gewinnt! Falsch angeklagt = raus.',max:4,
  start(){KON=true;kPl=NET.players();kTurn=0;kOut=new Set();NET.evReset();start();G.done=false;render();},
  onData(){if(KON)NET.evPump(kDo);},
  stop(){if(KON){if(kClose)kClose();kOff();}}});
  $('#btnMenu').addEventListener('click',()=>{if(KON){NET.leave();KON=false;const b=document.getElementById('kBar');if(b)b.remove();}});}

initHelp('krimi-detektiv');
</script>
</body>
</html>
