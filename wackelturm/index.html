<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wackelturm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#d9a066;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}


.players{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pchip{flex:1;min-width:90px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px;text-align:center}
.pchip.cur{border-color:var(--acc);box-shadow:0 0 16px -4px var(--acc)}
.pchip small{display:block;color:var(--mut);font-weight:700;font-family:'JetBrains Mono',monospace;font-size:11px}
#status{text-align:center;font-weight:900;font-size:17px;min-height:26px;margin:2px 0 10px}
.stage{position:relative;height:min(64vh,560px);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 7%,var(--cell)),var(--cell))}
.floor{position:absolute;left:0;right:0;bottom:0;height:16px;background:color-mix(in srgb,var(--acc) 30%,var(--card2))}
#tower{position:relative;width:min(56vw,210px);margin-bottom:16px;display:flex;flex-direction:column-reverse;transform-origin:50% 100%}
#tower.wob{animation:wob var(--wt,1.2s) ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(calc(var(--wa,0deg)*-1))}50%{transform:rotate(var(--wa,0deg))}}
.layer{display:flex;height:var(--bh,20px);gap:2px;margin-top:2px}
.brick{flex:1;border-radius:3px;cursor:pointer;position:relative;transition:transform .35s ease,opacity .35s;
  background:linear-gradient(180deg,#e8c08e,#c99360);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35)}
.layer.alt .brick{background:repeating-linear-gradient(90deg,#d6a46e 0 5px,#c9925c 5px 7px);}
.layer.alt .brick::after{content:"";position:absolute;inset:25% 30%;border-radius:50%;border:1.5px solid rgba(120,70,30,.35)}
.brick.gone{visibility:hidden}
.brick.lock{cursor:not-allowed;filter:saturate(.6) brightness(.92)}
.brick.can:hover{filter:brightness(1.12)}
.brick.pull{transform:translateX(160%);opacity:0}
.brick.new{animation:drop .4s ease-out}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.brick.fall{transition:transform 1.1s cubic-bezier(.5,0,.8,.5),opacity 1.1s;opacity:.9}
.risk{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:700}
.risk .bar{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.risk .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fa35a,#f2c21b,#e0453a);transition:width .4s}
.setup .seatrow{display:flex;gap:8px;margin-bottom:8px}
.setup input{flex:1;min-width:0;font:inherit;font-weight:700;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">🧱</span><h1>Wackel<b>turm</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="setup" class="setup">
    <div class="card">
      <h2>Wer spielt?</h2>
      <p>Zieht abwechselnd einen Stein aus dem Turm – er kommt oben wieder drauf. Wer den Turm umwirft, verliert!</p>
      <div class="lbl">Modus</div>
      <div class="seg" id="modeSeg" style="margin-bottom:12px"><button data-v="cpu">🤖 Gegen Computer</button><button data-v="pvp">👥 Mit Familie</button></div>
      <div id="names"></div>
    </div>
    <div class="row"><button class="primary" id="btnStart">Spiel starten</button></div>
  </section>
  <section id="game" class="hidden">
    <div class="players" id="players"></div>
    <div id="status"></div>
    <div class="stage" id="stage"><div class="risk"><span>Wackeln</span><div class="bar"><i id="riskBar"></i></div></div><div id="tower"></div><div class="floor"></div></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="small" id="btnMenu">‹ Menü</button><button class="small primary" id="btnAgain">Neuer Turm</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}


window.HELP=`<h2>🧱 So spielst du Wackelturm</h2>
<h3>Ziel</h3><p>Zieht abwechselnd Steine aus dem Turm. <b>Wer ihn umwirft, verliert.</b></p>
<h3>So geht's</h3><ol><li>Tippe einen Stein an – er wird herausgezogen und oben auf den Turm gelegt.</li><li>Aus den <b>obersten zwei Reihen</b> darf man nichts nehmen (diese Steine sind grau).</li><li>Jede Reihe braucht Halt: Entweder den <b>mittleren Stein</b> oder <b>beide Außensteine</b>. Fehlt das, kippt der Turm sofort!</li><li>Je mehr Steine fehlen, desto mehr wackelt der Turm – die Leiste oben zeigt es. Auch ein „sicherer“ Zug kann schiefgehen.</li></ol>
<h3>Spielarten</h3><ul><li><b>Gegen Computer:</b> Du gegen den Computer.</li><li><b>Mit Familie:</b> 2 bis 4 Spieler geben das Handy reihum weiter.</li></ul>
<div class="tip">💡 Tipp: Steine aus Reihen ziehen, die noch komplett sind – und lieber einen Außenstein als den mittleren, wenn schon einer fehlt.</div>`;
const LAYERS=18;
let cfg=KIT.get('turm-cfg',{mode:'cpu',names:['','','','']});
let tower,players,cur,moves,busy=false,over=false,instab=0;
function renderSetup(){
  $$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.mode));
  const n=cfg.mode==='cpu'?1:4;let h='';
  for(let i=0;i<n;i++)h+=`<div class="seatrow"><input data-i="${i}" maxlength="12" placeholder="${cfg.mode==='cpu'?'Dein Name':'Spieler '+(i+1)+(i>=2?' (optional)':'')}" value="${esc(cfg.names[i]||'')}"></div>`;
  $('#names').innerHTML=h;
}
$('#modeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.mode=b.dataset.v;KIT.set('turm-cfg',cfg);renderSetup();};
$('#names').oninput=e=>{cfg.names[+e.target.dataset.i]=e.target.value.trim();KIT.set('turm-cfg',cfg);};
$('#btnStart').onclick=()=>{
  if(cfg.mode==='cpu')players=[{n:cfg.names[0]||'Du',cpu:false},{n:'Computer',cpu:true}];
  else{players=cfg.names.map((n,i)=>({n:n||'',cpu:false})).filter((p,i)=>i<2||p.n);players.forEach((p,i)=>{if(!p.n)p.n='Spieler '+(i+1);});}
  players.forEach(p=>p.lost=p.lost||0);
  $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');newTower();
};
$('#btnMenu').onclick=()=>{$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');renderSetup();};
$('#btnAgain').onclick=()=>newTower();
function newTower(){
  tower=[];for(let i=0;i<LAYERS;i++)tower.push([1,1,1]);
  cur=Math.floor(Math.random()*players.length);if(cfg.mode==='cpu')cur=0;moves=0;over=false;busy=false;instab=0;
  $('#tower').classList.remove('wob');buildDom();updRisk();renderPlayers();turnMsg();
}
const topFull=()=>tower[tower.length-1].every(Boolean);
function locked(li){return li>=tower.length-2;}
function layerOk(l){return l[1]||(l[0]&&l[2]);}
function riskOf(li,bi){
  const l=tower[li].slice();l[bi]=0;if(!layerOk(l))return 1;
  const cnt=l.reduce((a,b)=>a+b,0);let r=.012+moves*.004+instab*.25;
  if(cnt===1)r+=.07+(1-li/tower.length)*.08;   // nur noch Mittelstein
  if(!l[1])r+=.035;                               // nur Außensteine
  if(bi!==1)r+=.01;
  r*=1+(1-li/tower.length)*.6;                    // unten wackelt es mehr
  return Math.min(.9,r);
}
function calcInstab(){let s=0;tower.forEach((l,i)=>{const c=l.reduce((a,b)=>a+b,0);if(c===1)s+=.035*(1-i/tower.length+.4);else if(c===2&&!l[1])s+=.018;else if(c===2)s+=.008;});return Math.min(.6,s);}
function buildDom(){
  const t=$('#tower');t.innerHTML='';const bh=Math.max(13,Math.min(22,Math.floor(($('#stage').clientHeight-60)/(tower.length+4))));t.style.setProperty('--bh',bh+'px');
  tower.forEach((l,li)=>{const d=document.createElement('div');d.className='layer'+(li%2?' alt':'');
    l.forEach((v,bi)=>{const b=document.createElement('div');b.className='brick'+(v?'':' gone');b.dataset.l=li;b.dataset.b=bi;b.onclick=()=>pick(li,bi,false);d.appendChild(b);});t.appendChild(d);});
  markLocks();
}
function markLocks(){$$('#tower .brick').forEach(b=>{const li=+b.dataset.l;const lk=locked(li)||over||players[cur].cpu||busy;b.classList.toggle('lock',lk);b.classList.toggle('can',!lk);});}
function updRisk(){instab=calcInstab();const pct=Math.min(100,Math.round((instab/.6)*70+moves*.8));$('#riskBar').style.width=pct+'%';
  const t=$('#tower');if(pct>8){t.style.setProperty('--wa',(pct/100*1.6).toFixed(2)+'deg');t.style.setProperty('--wt',(1.6-pct/100*.7).toFixed(2)+'s');t.classList.add('wob');}else t.classList.remove('wob');}
function renderPlayers(){$('#players').innerHTML=players.map((p,i)=>`<div class="pchip ${i===cur&&!over?'cur':''}">${p.cpu?'🤖 ':''}${esc(p.n)}<small>${p.lost} × umgeworfen</small></div>`).join('');}
function turnMsg(){const p=players[cur];$('#status').textContent=p.cpu?'🤖 Computer überlegt …':(cfg.mode==='cpu'?'Du bist dran – zieh einen Stein!':`${p.n} ist dran!`);markLocks();if(p.cpu)setTimeout(cpuTurn,900);}
async function pick(li,bi,byCpu){
  if(busy||over||(!byCpu&&players[cur].cpu))return;if(!tower[li][bi])return;
  if(locked(li)){$('#status').textContent='Aus den obersten Reihen darf man nichts nehmen!';tone(220,.1);return;}
  busy=true;markLocks();
  const risk=riskOf(li,bi);const el=$(`#tower .brick[data-l="${li}"][data-b="${bi}"]`);
  tone(300+Math.random()*60,.15,0,'sawtooth',.05);
  el.classList.add('pull');await sleep(380);
  tower[li][bi]=0;el.classList.add('gone');el.classList.remove('pull');moves++;
  const l=tower[li];
  if(!layerOk(l)||Math.random()<risk){return collapse();}
  // oben drauflegen
  await sleep(150);
  let top=tower[tower.length-1];if(top.every(Boolean)){tower.push([0,0,0]);top=tower[tower.length-1];}
  const slot=top.indexOf(0);top[slot]=1;
  if(Math.random()<.006+moves*.0008)return collapse();
  buildDom();const nb=$(`#tower .brick[data-l="${tower.length-1}"][data-b="${slot}"]`);if(nb)nb.classList.add('new');tone(520,.06,0,'square',.05);
  updRisk();busy=false;cur=(cur+1)%players.length;renderPlayers();turnMsg();
}
async function collapse(){
  over=true;busy=true;const loser=players[cur];loser.lost++;
  [200,160,120,90].forEach((f,k)=>tone(f,.25,k*.12,'sawtooth',.12));
  const t=$('#tower');t.classList.remove('wob');const dirn=Math.random()<.5?-1:1;
  $$('#tower .brick').forEach((b,k)=>{if(b.classList.contains('gone'))return;const li=+b.dataset.l;b.classList.add('fall');
    const dx=dirn*(80+li*14+Math.random()*60),rot=dirn*(40+Math.random()*120),dy=(LAYERS-li)*2+Math.random()*30;
    setTimeout(()=>{b.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg)`;b.style.opacity='.25';},li*25);});
  renderPlayers();
  $('#status').textContent=cfg.mode==='cpu'&&!loser.cpu?'💥 Oh nein, du hast den Turm umgeworfen!':`💥 ${loser.cpu?'Der Computer':loser.n} hat den Turm umgeworfen!`;
  await sleep(1300);
  if(cfg.mode==='cpu'){if(loser.cpu){confetti();sWin();$('#status').textContent='💥 Der Computer hat ihn umgeworfen – du gewinnst! 🎉';}else sLose();}
  else{confetti();}
}
function cpuTurn(){
  if(over||!players[cur].cpu)return;
  const opts=[];tower.forEach((l,li)=>l.forEach((v,bi)=>{if(v&&!locked(li))opts.push({li,bi,r:riskOf(li,bi)});}));
  opts.sort((a,b)=>a.r-b.r);const pickO=opts[Math.floor(Math.random()*Math.min(3,opts.length))]||opts[0];
  if(!pickO){return collapse();}
  pick(pickO.li,pickO.bi,true);
}
window.onTheme=()=>{};applyTheme();renderSetup();

initHelp('wackelturm');
</script>
