<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

$('#btnHelp').onclick=showHelp;

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});

/* ===== Würfel-Sprung: Level & Physik ===== */
const SPEED=10.4,G=95,JV=20.2,PADV=30,ORBV=19,H=7;
// Bausteine: Spalten von unten nach oben. '.'=leer '#'=Block '^'=Stachel 'P'=Sprungfeder 'O'=Ring
function seg(...rows){return rows;}             // rows: oben → unten, gleiche Länge
const S={
  run:n=>[''.padEnd(n,'.')],
  sp1:[ '....^....' ],
  sp2:[ '....^^....' ],
  sp3:[ '.....^^^.....' ],
  step:[ '.....####.....' ],
  stepSp:[ '.....####^.....' ],
  stairs:[ '.........###....', '.....#######....' ],
  blockSp:[ '.....###......', '..^..###..^^..' ],
  highPad:[ '........#####.....', '........#####.....', '........#####.....', '....P...#####^^...' ],
  padSp:[ '....P^^^^........' ],
  orbGap:[ '.......O.......', '...............', '....^^^^^^^....' ],
  orb2:[ '......O....O........', '....................', '...^^^^^^^^^^.......' ],
  plat:[ '.......#######........', '.....##......^^^^.....' ],
  tower:[ '............####.....', '........########.....', '....############^^...' ],
  zig:[ '...........###.......', '.......###...........', '...###..^^^^^^^^.....' ],
};
function build(parts){
  // jede Part = Zeilen (oben→unten); unten ausrichten auf Höhe H
  const cols=[];
  for(const p of parts){const rows=p.map(r=>r);const w=Math.max(...rows.map(r=>r.length));
    const pad=Array(H-rows.length).fill(''.padEnd(w,'.')).concat(rows.map(r=>r.padEnd(w,'.')));
    for(let x=0;x<w;x++){const col=[];for(let y=0;y<H;y++)col.push(pad[H-1-y][x]);cols.push(col);}}
  return cols; // cols[x][y] y=0 unten
}
const LEVELS=[
  {n:'Erster Sprung',d:'Leicht',c:['#2b1055','#7597de'],parts:[S.run(10),S.sp1,S.run(4),S.sp1,S.sp1,S.run(3),S.sp2,S.run(4),S.step,S.sp1,S.stepSp,S.run(3),S.sp2,S.sp1,S.step,S.run(4),S.sp2,S.sp2,S.run(10)]},
  {n:'Treppenlauf',d:'Leicht',c:['#0b3d2e','#2fd06e'],parts:[S.run(10),S.sp2,S.stairs,S.sp1,S.blockSp,S.run(2),S.stairs,S.sp2,S.stepSp,S.run(2),S.sp3,S.stairs,S.blockSp,S.sp2,S.run(10)]},
  {n:'Sprungfeder',d:'Mittel',c:['#3a0f2a','#ff6ad5'],parts:[S.run(10),S.sp2,S.padSp,S.run(3),S.highPad,S.run(2),S.sp3,S.padSp,S.stairs,S.highPad,S.sp2,S.padSp,S.run(10)]},
  {n:'Ring-Tanz',d:'Mittel',c:['#08283f','#21c3e6'],parts:[S.run(10),S.sp2,S.orbGap,S.run(2),S.sp3,S.orbGap,S.stairs,S.orb2,S.padSp,S.orbGap,S.sp2,S.orb2,S.run(10)]},
  {n:'Neon-Meister',d:'Schwer',c:['#2a0a0a','#ff8a3d'],parts:[S.run(8),S.sp3,S.plat,S.tower,S.orb2,S.zig,S.highPad,S.sp3,S.orbGap,S.plat,S.padSp,S.zig,S.orb2,S.tower,S.sp3,S.run(10)]},
];
LEVELS.forEach(L=>{L.cols=build(L.parts);L.len=L.cols.length;});
const cell=(L,x,y)=>x<0||x>=L.len||y<0||y>=H?'.':L.cols[x][y];
// Spieler: x,y = untere linke Ecke, Größe 1
function newP(x=0){return {x,y:0,vy:0,ground:true,rot:0,dead:false,done:false,usedOrb:-1,padT:0};}
function stepP(p,L,dt,hold,press){
  p.x+=SPEED*dt;const wasGround=p.ground;
  // Ring (Orb): Druck in der Luft, wenn der Würfel einen Ring berührt
  if(press&&!p.ground){for(let x=Math.floor(p.x)-1;x<=Math.floor(p.x)+1;x++)for(let y=Math.floor(p.y)-1;y<=Math.floor(p.y)+2;y++)if(cell(L,x,y)==='O'){const cx=x+.5,cy=y+.5;if(Math.abs(p.x+.5-cx)<1.1&&Math.abs(p.y+.5-cy)<1.1&&p.usedOrb!==x*10+y){p.vy=ORBV;p.usedOrb=x*10+y;}}}
  if(p.ground&&(hold||press)){p.vy=JV;p.ground=false;}
  p.vy-=G*dt;let ny=p.y+p.vy*dt;p.ground=false;
  // Boden
  if(ny<=0){ny=0;p.vy=0;p.ground=true;}
  // Blöcke
  const x0=Math.floor(p.x+.05),x1=Math.floor(p.x+.95);
  for(let x=x0;x<=x1;x++){for(let y=0;y<H;y++){const c=cell(L,x,y);
    if(c==='#'){ // Landen von oben
      if(p.vy<=0&&p.y>=y+1-0.25&&ny<y+1){ny=y+1;p.vy=0;p.ground=true;}
      else if(ny<y+1-0.02&&ny+1>y+0.02){p.dead=true;}}
    if(c==='P'&&ny<y+.4&&p.vy<=0){p.vy=PADV;p.ground=false;ny=Math.max(ny,y);p.padT=.3;}
  }}
  // Stacheln (kleinere Trefferbox)
  for(let x=Math.floor(p.x)-1;x<=Math.floor(p.x)+1;x++)for(let y=Math.floor(ny)-1;y<=Math.floor(ny)+1;y++){if(cell(L,x,y)!=='^')continue;
    const sx0=x+.3,sx1=x+.7,sy0=y,sy1=y+.55;if(p.x+.85>sx0&&p.x+.15<sx1&&ny+.85>sy0&&ny+.1<sy1)p.dead=true;}
  p.y=ny;if(p.ground){if(!wasGround)p.rot=Math.round(p.rot/90)*90;}else p.rot+=dt*360*1.25;
  if(p.x>=L.len-2)p.done=true;
}


window.HELP=`<h2>🟨 So spielst du Würfel-Rush</h2>
<h3>Ziel</h3><p>Dein Würfel rast von allein nach rechts. Spring über alle Hindernisse und schaff das Level bis <b>100 %</b>!</p>
<h3>Steuerung</h3><ul><li><b>Tippen</b> (oder Leertaste) = springen.</li><li><b>Gedrückt halten</b> = der Würfel springt immer wieder, sobald er landet.</li></ul>
<h3>Hindernisse</h3><ul><li>🔺 <b>Stacheln</b> – nicht berühren!</li><li>⬛ <b>Blöcke</b> – oben drauf landen ist okay, von der Seite dagegen = vorbei.</li><li>🟡 <b>Sprungfeder</b> (am Boden) – katapultiert dich ganz hoch.</li><li>⭕ <b>Ring</b> (in der Luft) – tippe, während du ihn berührst, dann springst du nochmal!</li></ul>
<h3>Tipps</h3><ul><li>Die Musik hilft beim Takt – viele Sprünge passen zum Beat.</li><li>Im <b>🟢 Übungsmodus</b> gibt es Speicherpunkte. Danach im normalen Modus nochmal schaffen!</li><li>Dein bester Prozentwert pro Level wird gespeichert.</li></ul>`;
const COLORS=['#ffd23f','#2fd06e','#3ba7ff','#ff5c8a','#a970ff','#ff8a3d'];
let save=KIT.get('wr-save',{best:[0,0,0,0,0],done:[0,0,0,0,0],col:0,practice:false});
function renderMenu(){
  $('#lvls').innerHTML=LEVELS.map((L,i)=>{const locked=i>0&&!save.done[i-1]&&save.best[i-1]<60;
    return `<div class="lv" data-i="${i}" style="background:linear-gradient(135deg,${L.c[0]},${L.c[1]});${locked?'opacity:.45':''}">${save.done[i]?'<span class="ok">⭐</span>':locked?'<span class="ok">🔒</span>':''}<h3>${i+1}. ${L.n}</h3><div class="d">${L.d}${save.done[i]?' · geschafft!':''}</div><div class="bar"><i style="width:${save.best[i]}%"></i></div><div class="d" style="margin-top:4px">Bestwert ${save.best[i]} %</div></div>`;}).join('');
  $('#colors').innerHTML=COLORS.map((c,i)=>`<button data-c="${i}" class="${i===save.col?'on':''}" style="background:${c}"></button>`).join('');
  $('#practice').checked=save.practice;
}
$('#lvls').onclick=e=>{const l=e.target.closest('.lv');if(!l)return;const i=+l.dataset.i;if(i>0&&!save.done[i-1]&&save.best[i-1]<60){infoBox(`<h2>🔒 Noch gesperrt</h2><p>Schaff erst mindestens 60 % im Level davor – oder spiel es im Übungsmodus durch.</p>`);return;}start(i);};
$('#colors').onclick=e=>{const b=e.target.closest('button');if(!b)return;save.col=+b.dataset.c;KIT.set('wr-save',save);renderMenu();};
$('#practice').onchange=e=>{save.practice=e.target.checked;KIT.set('wr-save',save);};
/* ===== Spiel ===== */
const cv=$('#cv'),ctx=cv.getContext('2d');let VW=16,VH=9,TS=40,dpr=1;
function resize(){const w=$('#stage').clientWidth||600;VW=w<520?11:16;VH=w<520?10:9;TS=w/VW;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=w*dpr;cv.height=TS*VH*dpr;cv.style.height=(TS*VH)+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',()=>{if(!$('#play').classList.contains('hidden'))resize();});
let L=null,LI=0,P=null,cp=null,run=false,paused=false,acc=0,last=0,hold=false,press=false,tries=1,parts=[],deadT=0,trail=[],wonT=0;
function start(i){LI=i;L=LEVELS[i];tries=1;$('#menu').classList.add('hidden');$('#play').classList.remove('hidden');resize();cp=null;reset();$('#over').innerHTML=`<h2>${i+1}. ${L.n}</h2><p>Tippe, um zu starten!</p>`;$('#over').classList.remove('hidden');run=false;draw();}
function reset(){P=cp?Object.assign({},cp):newP();parts=[];trail=[];deadT=0;hold=false;press=false;}
function go(){if(run)return;$('#over').classList.add('hidden');run=true;paused=false;last=performance.now();music.start();requestAnimationFrame(loop);}
function loop(now){if(!run)return;let dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){
    if(deadT>0){deadT-=dt;parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy-=30*dt;q.t-=dt;});if(deadT<=0){tries++;reset();}}
    else{acc+=dt;while(acc>=1/120){acc-=1/120;stepP(P,L,1/120,hold,press);press=false;
      if(P.dead){die();break;}
      if(save.practice&&P.ground&&(!cp||P.x-cp.x>14))cp=Object.assign({},P,{usedOrb:-1});
      if(P.done){win();break;}}
      trail.push([P.x,P.y]);if(trail.length>8)trail.shift();}
  }
  hud();draw();if(run)requestAnimationFrame(loop);}
function hud(){const pct=Math.min(100,Math.floor(P.x/(L.len-2)*100));$('#hBar').style.width=pct+'%';$('#hPct').textContent=pct+'%';$('#hTry').textContent=(save.practice?'🟢 ':'')+'Versuch '+tries;}
function die(){const pct=Math.min(99,Math.floor(P.x/(L.len-2)*100));if(!save.practice&&pct>save.best[LI]){save.best[LI]=pct;KIT.set('wr-save',save);}
  deadT=.7;tone(140,.2,0,'sawtooth',.14);tone(90,.25,.05,'square',.1);
  for(let k=0;k<22;k++){const a=Math.random()*6.28,s=3+Math.random()*7;parts.push({x:P.x+.5,y:P.y+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s+3,t:.7});}}
function win(){run=false;music.stop();if(!save.practice){save.best[LI]=100;save.done[LI]=1;}KIT.set('wr-save',save);confetti();sWin();
  $('#over').innerHTML=`<h2>⭐ Level geschafft!</h2><p>${save.practice?'Im Übungsmodus – jetzt noch ohne Speicherpunkte schaffen!':`Nach ${tries} ${tries===1?'Versuch':'Versuchen'}!`}</p><div class="row" style="justify-content:center">${LI<LEVELS.length-1?'<button class="primary" id="oNext">Nächstes Level ›</button>':''}<button id="oAgain">Nochmal</button><button id="oMenu">Level</button></div>`;
  $('#over').classList.remove('hidden');const n=$('#oNext');if(n)n.onclick=e=>{e.stopPropagation();start(LI+1);};$('#oAgain').onclick=e=>{e.stopPropagation();cp=null;start(LI);};$('#oMenu').onclick=e=>{e.stopPropagation();toMenu();};}
function toMenu(){run=false;music.stop();$('#play').classList.add('hidden');$('#menu').classList.remove('hidden');renderMenu();}
/* Eingabe */
const down=()=>{if(!run){if($('#over').querySelector('button'))return;go();}hold=true;press=true;};const up=()=>{hold=false;};
$('#stage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();down();});
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
document.addEventListener('keydown',e=>{if($('#play').classList.contains('hidden'))return;if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();if(!e.repeat)down();}if(e.key==='p')togglePause();});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w')up();});
function togglePause(){if(!run)return;paused=!paused;$('#btnPause').textContent=paused?'▶ Weiter':'⏸ Pause';paused?music.stop():music.start();last=performance.now();}
$('#btnPause').onclick=togglePause;$('#btnBack').onclick=toMenu;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!paused)togglePause();});
/* Zeichnen */
function draw(){
  const W=VW*TS,Hh=VH*TS,camX=(P?P.x:0)-4,gy=Hh-TS*1.4; // Bodenlinie
  const g=ctx.createLinearGradient(0,0,0,Hh);g.addColorStop(0,L.c[0]);g.addColorStop(1,L.c[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,Hh);
  // Hintergrund-Quadrate
  ctx.fillStyle='rgba(255,255,255,.06)';for(let k=0;k<14;k++){const bx=((k*173-camX*TS*.3)%(W+200)+W+200)%(W+200)-100,by=(k*67)%(Hh*.6);ctx.fillRect(bx,by,TS*1.6,TS*1.6);}
  const sx=x=>(x-camX)*TS,sy=y=>gy-y*TS;
  // Boden
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,gy,W,Hh-gy);ctx.fillStyle='#fff';ctx.fillRect(0,gy,W,2);
  // Level
  const x0=Math.floor(camX)-1,x1=x0+VW+3,t=performance.now()/1000;
  for(let x=Math.max(0,x0);x<Math.min(L.len,x1);x++)for(let y=0;y<H;y++){const c=L.cols[x][y];if(c==='.')continue;const X=sx(x),Y=sy(y+1);
    if(c==='#'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(X,Y,TS,TS);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.strokeRect(X+1,Y+1,TS-2,TS-2);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.strokeRect(X+TS*.25,Y+TS*.25,TS*.5,TS*.5);}
    else if(c==='^'){ctx.beginPath();ctx.moveTo(X+TS*.1,Y+TS);ctx.lineTo(X+TS*.5,Y+TS*.12);ctx.lineTo(X+TS*.9,Y+TS);ctx.closePath();ctx.fillStyle='#111';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
    else if(c==='P'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(X+TS/2,Y+TS,TS*.42,TS*.22,0,Math.PI,0);ctx.fill();}
    else if(c==='O'){const r=TS*(.36+Math.sin(t*6)*.03);ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.beginPath();ctx.arc(X+TS/2,Y+TS/2,r,0,7);ctx.stroke();ctx.fillStyle='rgba(255,210,63,.25)';ctx.fill();}}
  // Ziel
  const fx=sx(L.len-2);if(fx<W+TS){ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(fx,0,TS*2,gy);ctx.fillStyle='#fff';ctx.font=`bold ${TS*.5}px "JetBrains Mono",monospace`;ctx.fillText('ZIEL',fx+TS*.2,gy-TS*.3);}
  if(save.practice&&cp){ctx.fillStyle='#2fd06e';ctx.beginPath();ctx.moveTo(sx(cp.x+.5),sy(cp.y+1.6));ctx.lineTo(sx(cp.x+.2),sy(cp.y+1.15));ctx.lineTo(sx(cp.x+.8),sy(cp.y+1.15));ctx.fill();}
  if(!P)return;const col=COLORS[save.col];
  if(deadT>0){parts.forEach(q=>{ctx.globalAlpha=Math.max(0,q.t/.7);ctx.fillStyle=col;ctx.fillRect(sx(q.x)-TS*.12,sy(q.y)-TS*.12,TS*.24,TS*.24);});ctx.globalAlpha=1;return;}
  trail.forEach(([x,y],k)=>{ctx.globalAlpha=k/trail.length*.35;ctx.fillStyle=col;ctx.fillRect(sx(x)+TS*.2,sy(y+.8),TS*.6,TS*.6);});ctx.globalAlpha=1;
  // Würfel mit Gesicht
  ctx.save();ctx.translate(sx(P.x+.5),sy(P.y+.5));ctx.rotate(P.rot*Math.PI/180);const s=TS*.92;
  ctx.fillStyle=col;ctx.fillRect(-s/2,-s/2,s,s);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.strokeRect(-s/2,-s/2,s,s);
  ctx.fillStyle='#111';ctx.fillRect(-s*.28,-s*.2,s*.18,s*.2);ctx.fillRect(s*.1,-s*.2,s*.18,s*.2);ctx.fillRect(-s*.24,s*.12,s*.48,s*.1);ctx.restore();
}
/* Musik: einfacher Beat mit Bass */
const music={t:null,step:0,next:0,
  start(){if(this.t||!actx||!soundOn)return;this.next=actx.currentTime+.05;this.step=0;this.t=setInterval(()=>this.tick(),40);},
  stop(){clearInterval(this.t);this.t=null;},
  tick(){if(!soundOn){this.stop();return;}const spb=60/128/2;const notes=[[45,45,57,45,48,45,52,50],[43,43,55,43,47,43,50,48],[41,41,53,41,45,41,48,46],[40,40,52,40,43,40,47,45]][Math.floor(this.step/8)%4];
    while(this.next<actx.currentTime+.15){const s=this.step%8,t=this.next;
      if(s%2===0)this.kick(t);if(s%4===2)this.hat(t,.08);else this.hat(t,.03);
      this.bass(t,440*Math.pow(2,(notes[s]-69)/12));this.step++;this.next+=spb;}},
  kick(t){try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.16);}catch(e){}},
  hat(t,v){try{const b=actx.createBuffer(1,2205,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=b;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f).connect(g).connect(actx.destination);s.start(t);}catch(e){}},
  bass(t,f){try{const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);const fl=actx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900;o.connect(fl).connect(g).connect(actx.destination);o.start(t);o.stop(t+.22);}catch(e){}}};
window.onTheme=()=>{};applyTheme();renderMenu();

initHelp('wuerfel-rush');
</script>
