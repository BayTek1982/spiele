<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbol-Blitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#ff4fa3;--acc-ink:#ffffff}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.disc{position:relative;width:min(80vw,330px);aspect-ratio:1/1;border-radius:50%;margin:0 auto;background:var(--card);border:3px solid var(--line);box-shadow:0 8px 24px var(--shadow)}
.disc.center{border-color:var(--acc)}
.disc .sym{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .12s;padding:2px}
.disc .sym:active{transform:translate(-50%,-50%) scale(.9)}
.disc .sym.hit{animation:hit .5s}
.disc .sym.bad{animation:bad .35s}
@keyframes hit{50%{filter:drop-shadow(0 0 12px #2fd06e);transform:translate(-50%,-50%) scale(1.35)}}
@keyframes bad{25%{transform:translate(-56%,-50%)}75%{transform:translate(-44%,-50%)}}
.disc.lock{opacity:.45;filter:grayscale(.6)}
.disc.flyin{animation:fly .35s ease-out}
@keyframes fly{from{transform:scale(.6) rotate(-40deg);opacity:0}}
.lab{text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:8px 0 6px}
#status{text-align:center;font-weight:900;font-size:17px;min-height:26px;margin:8px 0}
.duo .disc{width:min(70vw,44vh,300px)}
.duo .top{transform:rotate(180deg)}
.duo .sc{text-align:center;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:20px;margin:4px 0}
.timer{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px auto 10px;width:min(80vw,330px)}.timer i{display:block;height:100%;background:var(--acc);transition:width .2s linear}
.setup{margin-bottom:12px}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">⚡</span><h1>Symbol-<b>Blitz</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="setup">
    <div class="card opts setup">
      <div><div class="lbl">Spielart</div><div class="seg" id="modeSeg"><button data-v="solo">⏱ Allein</button><button data-v="cpu">🤖 Computer</button><button data-v="duo">👥 Zu zweit</button></div></div>
      <div id="lvlBox"><div class="lbl">Wie schnell ist der Computer?</div><div class="seg" id="lvlSeg"><button data-v="1">Gemütlich</button><button data-v="2">Flott</button><button data-v="3">Blitzschnell</button></div></div>
      <div class="note" id="modeInfo"></div>
    </div>
    <div class="row"><button class="primary" id="btnStart">Los geht's</button></div>
    <div class="note" id="best"></div>
  </section>
  <section id="game" class="hidden">
    <div id="solo">
      <div class="stats"><div class="stat"><div class="k" id="k1">Treffer</div><div class="v" id="v1">0</div></div><div class="stat"><div class="k" id="k2">Zeit</div><div class="v" id="v2">60</div></div></div>
      <div class="timer" id="timer"><i id="tbar"></i></div>
      <div class="lab">Mitte</div><div class="disc center" id="dC"></div>
      <div id="status"></div>
      <div class="lab">Deine Karte – tippe das Bild, das auch in der Mitte ist</div><div class="disc" id="dP"></div>
    </div>
    <div id="duo" class="duo hidden">
      <div class="disc top" id="dT"></div><div class="sc top" id="sT">0</div>
      <div class="disc center" id="dC2" style="margin:8px auto"></div>
      <div class="sc" id="sB">0</div><div class="disc" id="dB"></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="small" id="btnMenu">‹ Menü</button><button class="small primary" id="btnAgain">Nochmal</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=3"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>⚡ So spielst du Symbol-Blitz</h2>
<h3>Das Geheimnis</h3><p>Zwei Karten haben <b>immer genau ein Bild gemeinsam</b> – nie mehr, nie weniger. Die Bilder können aber unterschiedlich groß und gedreht sein!</p>
<h3>So geht's</h3><ol><li>Vergleiche <b>deine Karte</b> mit der <b>Karte in der Mitte</b>.</li><li>Finde das Bild, das auf beiden ist, und <b>tippe es auf deiner Karte</b> an.</li><li>Richtig? Du bekommst einen Punkt und eine neue Karte. Falsch? Du bist kurz gesperrt.</li></ol>
<h3>Spielarten</h3><ul><li><b>⏱ Allein:</b> Wie viele Treffer schaffst du in 60 Sekunden? Dein Rekord wird gespeichert.</li><li><b>🤖 Computer:</b> Wettrennen! Findest du das Bild vor dem Computer? Wer zuerst 15 Punkte hat, gewinnt.</li><li><b>👥 Zu zweit:</b> Legt das Handy zwischen euch auf den Tisch. Jeder tippt auf <b>seiner</b> Karte (oben ist umgedreht für den Gegenüber). Wer schneller ist, bekommt den Punkt – bis 15.</li></ul>
<div class="tip">💡 Tipp: Nicht alle Bilder einzeln vergleichen – such dir ein Bild aus der Mitte und schau, ob es auf deiner Karte ist.</div>`;
const SYM=[...'🐶🐱🐭🐰🦊🐻🐼🐸🐵🐔🐧🐢🐙🦋🐝🐞🦀🐳🦒🦄🍎🍌🍇🍓🍉🍒🥕🌽🍕🍔🍩🍪🎂🍦⚽🏀🎸🎈🎁⭐🌙🌞⛄🔥💧🌈💖🔑⏰📚🚗🚀🚲⚓🎩🌵🍄'];
// Karten mit genau einem gemeinsamen Bild (projektive Ebene, Ordnung 7)
function deck(){const n=7,c=[];const f=[];for(let k=0;k<=n;k++)f.push(k);c.push(f);
  for(let j=0;j<n;j++){const x=[0];for(let k=0;k<n;k++)x.push(n+1+n*j+k);c.push(x);}
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const x=[i+1];for(let k=0;k<n;k++)x.push(n+1+n*k+((i*k+j)%n));c.push(x);}
  return c.sort(()=>Math.random()-.5);}
const common=(a,b)=>a.find(x=>b.includes(x));
// 8 Plätze auf einer runden Karte
const SPOTS=[[50,50,.95],[50,17,.8],[79,32,.75],[80,66,.8],[52,83,.75],[21,68,.8],[19,33,.75],[50,50,0]];
function layout(card){const off=Math.random()*Math.PI*2,c=card.slice().sort(()=>Math.random()-.5);
  return c.map((sym,i)=>{if(i===0)return {s:sym,x:50,y:50,size:.75+Math.random()*.3,rot:Math.floor(Math.random()*360)};
    const a=off+(i-1)*2*Math.PI/7,r=32+Math.random()*3;return {s:sym,x:50+Math.cos(a)*r,y:50+Math.sin(a)*r,size:.55+Math.random()*.45,rot:Math.floor(Math.random()*360)};});}
function drawDisc(el,card,onTap){const d=$(el);const w=d.clientWidth||300;
  d.innerHTML=layout(card).map(o=>`<span class="sym" data-s="${o.s}" style="left:${o.x}%;top:${o.y}%;font-size:${(w*.15*o.size).toFixed(0)}px;transform:translate(-50%,-50%) rotate(${o.rot}deg)">${SYM[o.s]}</span>`).join('');
  d.classList.remove('flyin');void d.offsetWidth;d.classList.add('flyin');
  d.onclick=e=>{const s=e.target.closest('.sym');if(s&&onTap)onTap(+s.dataset.s,s);};}
let cfg=KIT.get('blitz-cfg',{mode:'solo',lvl:2});
let D,center,mine,tp,bt,score,cpuScore,sT,sB,timer=null,cpuT=null,lockMe=0,lockT=0,lockB=0,endAt=0,run=false,round=0;
function setup(){$$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.mode));$$('#lvlSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===cfg.lvl));
  $('#lvlBox').classList.toggle('hidden',cfg.mode!=='cpu');
  $('#modeInfo').textContent={solo:'60 Sekunden – so viele Treffer wie möglich.',cpu:'Wettrennen gegen den Computer – wer zuerst 15 Punkte hat.',duo:'Handy flach zwischen euch legen. Jeder tippt auf seiner Karte – bis 15 Punkte.'}[cfg.mode];
  const b=KIT.get('blitz-best',0);$('#best').textContent=b?`Allein-Rekord: ${b} Treffer in 60 Sekunden`:'';}
$('#modeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.mode=b.dataset.v;KIT.set('blitz-cfg',cfg);setup();};
$('#lvlSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.lvl=+b.dataset.v;KIT.set('blitz-cfg',cfg);setup();};
function stop(){run=false;clearInterval(timer);clearTimeout(cpuT);}
$('#btnMenu').onclick=()=>{stop();$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');setup();};
$('#btnStart').onclick=start;$('#btnAgain').onclick=start;
function next(n){const used=[center,mine,tp,bt].filter(Boolean).map(c=>c.join());const out=[];while(out.length<n){if(!D.length)D=deck();const c=D.shift();if(!used.includes(c.join())&&!out.some(o=>o.join()===c.join()))out.push(c);}return out;}
function start(){
  stop();D=deck();center=mine=tp=bt=null;run=true;score=0;cpuScore=0;sT=0;sB=0;round=0;lockMe=lockT=lockB=0;
  $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');
  const duo=cfg.mode==='duo';$('#solo').classList.toggle('hidden',duo);$('#duo').classList.toggle('hidden',!duo);
  if(duo){[center,tp,bt]=next(3);$('#sT').textContent='0';$('#sB').textContent='0';drawDuo();return;}
  [center,mine]=next(2);
  if(cfg.mode==='solo'){$('#k1').textContent='Treffer';$('#k2').textContent='Zeit';$('#timer').classList.remove('hidden');endAt=Date.now()+60000;
    timer=setInterval(()=>{const left=Math.max(0,endAt-Date.now());$('#v2').textContent=Math.ceil(left/1000);$('#tbar').style.width=(left/600)+'%';if(!left)endSolo();},200);}
  else{$('#k1').textContent='Du';$('#k2').textContent='Computer';$('#timer').classList.add('hidden');}
  $('#v1').textContent='0';if(cfg.mode==='cpu')$('#v2').textContent='0';
  $('#status').textContent='Finde das gemeinsame Bild!';drawSolo();
}
function drawSolo(){drawDisc('#dC',center);drawDisc('#dP',mine,tapMine);$('#dP').classList.toggle('lock',Date.now()<lockMe);if(cfg.mode==='cpu')planCpu();}
function tapMine(s,el){if(!run||Date.now()<lockMe)return;
  if(s===common(center,mine)){el.classList.add('hit');tone(880,.06);tone(1175,.08,.06);score++;$('#v1').textContent=score;
    if(cfg.mode==='cpu'&&score>=15)return endCpu(true);
    center=mine;[mine]=next(1);clearTimeout(cpuT);setTimeout(()=>{if(run)drawSolo();},220);}
  else{el.classList.add('bad');tone(200,.12);lockMe=Date.now()+1200;$('#dP').classList.add('lock');$('#status').textContent='Falsch – kurz warten!';setTimeout(()=>{$('#dP').classList.remove('lock');if(run)$('#status').textContent='Finde das gemeinsame Bild!';},1200);}}
function planCpu(){clearTimeout(cpuT);const [a,b]=[[0,0],[6000,9500],[3500,6000],[1900,3300]][cfg.lvl];const t=a+Math.random()*(b-a);
  cpuT=setTimeout(()=>{if(!run)return;cpuScore++;$('#v2').textContent=cpuScore;tone(330,.1,0,'square',.08);
    const c=common(center,mine);const el=$(`#dC .sym[data-s="${c}"]`);if(el)el.classList.add('hit');$('#status').textContent='🤖 Der Computer war schneller!';
    if(cpuScore>=15)return endCpu(false);setTimeout(()=>{if(!run)return;[center]=next(1);while(!common(center,mine))[center]=next(1);$('#status').textContent='Finde das gemeinsame Bild!';drawSolo();},700);},t);}
function endSolo(){stop();const b=KIT.get('blitz-best',0),rec=score>b;if(rec)KIT.set('blitz-best',score);
  $('#status').textContent=`⏰ Zeit um! ${score} Treffer${rec&&score?' – 🏆 neuer Rekord!':''}`;if(rec&&score){confetti();sWin();}else tone(440,.2);$('#dP').classList.add('lock');}
function endCpu(win){stop();$('#status').textContent=win?'🎉 Du hast gewonnen!':'Der Computer gewinnt 🤖';if(win){confetti();sWin();}else sLose();$('#dP').classList.add('lock');}
/* Zu zweit */
function drawDuo(){drawDisc('#dC2',center);drawDisc('#dT',tp,(s,el)=>tapDuo('t',s,el));drawDisc('#dB',bt,(s,el)=>tapDuo('b',s,el));}
function tapDuo(who,s,el){if(!run)return;const now=Date.now();if(who==='t'?now<lockT:now<lockB)return;const card=who==='t'?tp:bt;
  if(s===common(center,card)){el.classList.add('hit');tone(880,.06);tone(1175,.08,.06);
    if(who==='t'){sT++;$('#sT').textContent=sT;center=tp;[tp]=next(1);}else{sB++;$('#sB').textContent=sB;center=bt;[bt]=next(1);}
    if(sT>=15||sB>=15){stop();const w=sT>=15?'Oben':'Unten';confetti();sWin();
      $('#sT').textContent=sT>=15?`🏆 ${sT} – gewonnen!`:sT;$('#sB').textContent=sB>=15?`🏆 ${sB} – gewonnen!`:sB;return;}
    run=false;setTimeout(()=>{run=true;drawDuo();},250);}
  else{el.classList.add('bad');tone(200,.12);const d=who==='t'?'#dT':'#dB';$(d).classList.add('lock');if(who==='t')lockT=now+1200;else lockB=now+1200;setTimeout(()=>$(d).classList.remove('lock'),1200);}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cfg.mode==='cpu'&&run){clearTimeout(cpuT);}else if(!document.hidden&&cfg.mode==='cpu'&&run)planCpu();});
window.onTheme=()=>{};applyTheme();setup();

initHelp('symbol-blitz');
</script>
