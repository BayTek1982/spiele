<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schneemann-Raten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#5ad1ff;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.scene{width:min(80vw,280px);margin:0 auto;display:block}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 14px;font-family:'JetBrains Mono',monospace}
.word span{width:34px;height:44px;border-bottom:3px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.word span.sp{border:0;width:14px}
.word span.show{animation:pop .3s}
.word span.miss{color:#e0453a}
@keyframes pop{from{transform:scale(1.6)}}
.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:520px;margin:0 auto}
.keys button{padding:10px 0;font-size:16px;border-radius:9px}
.keys button.ok{background:#2fa35a;color:#fff;border-color:#2fa35a}
.keys button.no{background:var(--bg2);color:var(--mut);opacity:.5}
.hint{text-align:center;color:var(--mut);font-weight:700;margin-top:4px}
.lives{text-align:center;font-size:20px;letter-spacing:3px;min-height:28px}
#secret{width:100%;font:inherit;font-size:20px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt)}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">⛄</span><h1>Schneemann-<b>Raten</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="setup">
    <div class="card opts">
      <div><div class="lbl">Spielart</div><div class="seg" id="modeSeg"><button data-v="solo">🎲 Computer wählt Wort</button><button data-v="2p">👥 Jemand gibt Wort ein</button></div></div>
      <div id="solo1"><div class="lbl">Thema</div><div class="seg" id="themeSeg" style="flex-wrap:wrap"><button data-v="tiere">🐾 Tiere</button><button data-v="essen">🍕 Essen</button><button data-v="welt">🌍 Länder</button><button data-v="winter">❄️ Winter</button><button data-v="bunt">🎨 Alles</button></div></div>
      <div id="solo2"><div class="lbl">Schwierigkeit</div><div class="seg" id="lvlSeg"><button data-v="1">😊 Kurze Wörter</button><button data-v="2">🙂 Mittel</button><button data-v="3">😎 Lange Wörter</button></div></div>
      <div id="twoBox" class="hidden"><div class="lbl">Geheimes Wort (die anderen dürfen nicht schauen!)</div><input id="secret" type="password" maxlength="20" placeholder="z. B. Schneeflocke" autocomplete="off"><div class="lbl" style="margin-top:10px">Hinweis (freiwillig)</div><input id="secretHint" style="width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt)" maxlength="40" placeholder="z. B. Es ist kalt"></div>
      <div class="row"><button class="primary" id="btnStart">Los geht's ⛄</button></div>
    </div>
    <div class="note" id="stat" style="text-align:center"></div>
  </section>
  <section id="game" class="hidden">
    <svg class="scene" id="scene" viewBox="0 0 200 200"></svg>
    <div class="lives" id="lives"></div>
    <div class="hint" id="hint"></div>
    <div class="word" id="word"></div>
    <div class="keys" id="keys"></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="small" id="btnTip">💡 Tipp</button><button class="small" id="btnMenu">‹ Menü</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=5"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>⛄ So spielst du Schneemann-Raten</h2>
<h3>Ziel</h3><p>Errate das geheime Wort, <b>bevor der Schneemann geschmolzen ist</b>!</p>
<h3>So geht's</h3><ol><li>Tippe Buchstaben an. Ist der Buchstabe im Wort, erscheint er an allen richtigen Stellen.</li><li>Ist er <b>nicht</b> im Wort, scheint die Sonne stärker und der Schneemann schmilzt ein Stück.</li><li>Nach <b>7 falschen</b> Buchstaben ist er weg – dann hast du verloren.</li></ol>
<h3>Spielarten</h3><ul><li><b>🎲 Computer wählt Wort:</b> Wähle Thema und Schwierigkeit.</li><li><b>👥 Jemand gibt Wort ein:</b> Einer tippt heimlich ein Wort ein, die anderen raten.</li></ul>
<div class="tip">💡 Tipp: Fang mit häufigen Buchstaben an: E, N, I, S, R, A. Der 💡-Knopf verrät einen Buchstaben – kostet aber ein Stück Schneemann.</div>`;
const W={tiere:'HUND KATZE PFERD HASE MAUS ELEFANT GIRAFFE PINGUIN DELFIN KROKODIL SCHILDKRÖTE EICHHÖRNCHEN SCHMETTERLING LÖWE TIGER ZEBRA AFFE FUCHS IGEL EULE PAPAGEI KÄNGURU NASHORN KAMEL ESEL SCHAF ZIEGE HUHN ENTE FROSCH SCHLANGE MARIENKÄFER REGENWURM SPINNE BIENE WAL HAI',
essen:'PIZZA NUDELN APFEL BANANE ERDBEERE KARTOFFEL BROT BUTTER KÄSE SCHOKOLADE PFANNKUCHEN SPAGHETTI BRATWURST MÖHRE TOMATE GURKE BREZEL MÜSLI JOGHURT MELONE ANANAS KIRSCHE ZITRONE HONIG MARMELADE KUCHEN KEKS EIS SUPPE SALAT POMMES HAMBURGER LEBKUCHEN',
welt:'DEUTSCHLAND TÜRKEI ITALIEN SPANIEN FRANKREICH ÖSTERREICH SCHWEIZ POLEN JAPAN CHINA INDIEN BRASILIEN KANADA MEXIKO ÄGYPTEN AUSTRALIEN NORWEGEN SCHWEDEN GRIECHENLAND PORTUGAL ENGLAND IRLAND RUSSLAND ARGENTINIEN MAROKKO KROATIEN',
winter:'SCHNEE SCHLITTEN SCHNEEMANN HANDSCHUHE MÜTZE SCHAL EISZAPFEN SCHNEEFLOCKE WEIHNACHTEN TANNENBAUM GESCHENK RENTIER PINGUIN EISBÄR KAMIN PLÄTZCHEN NIKOLAUS ADVENTSKRANZ KERZE SKI SCHLITTSCHUH IGLU LAWINE FROST WINTERJACKE'};
W.bunt=[...new Set(Object.values(W).join(' ').split(' '))].join(' ');
const AB='ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'.split('');const MAXF=7;
let cfg={mode:KIT.get('sm-mode','solo'),theme:KIT.get('sm-theme','tiere'),lvl:+KIT.get('sm-lvl',2)},G=null;let st=KIT.get('sm-st',{w:0,l:0});
function bindSeg(id,val,cb){const el=$(id);const set=v=>{el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==String(v)));};set(val);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;set(b.dataset.v);cb(b.dataset.v);};}
const upd=()=>{const two=cfg.mode==='2p';$('#twoBox').classList.toggle('hidden',!two);$('#solo1').classList.toggle('hidden',two);$('#solo2').classList.toggle('hidden',two);};
bindSeg('#modeSeg',cfg.mode,v=>{cfg.mode=v;KIT.set('sm-mode',v);upd();});bindSeg('#themeSeg',cfg.theme,v=>{cfg.theme=v;KIT.set('sm-theme',v);});bindSeg('#lvlSeg',cfg.lvl,v=>{cfg.lvl=+v;KIT.set('sm-lvl',+v);});upd();
const showStat=()=>$('#stat').textContent=st.w+st.l?`Gerettet: ${st.w} ⛄   Geschmolzen: ${st.l} 💧`:'';showStat();
const THN={tiere:'Ein Tier',essen:'Etwas zum Essen',welt:'Ein Land',winter:'Etwas aus dem Winter'};
function pickWord(){const list=W[cfg.theme].split(' ');const f=list.filter(w=>cfg.lvl===1?w.length<=5:cfg.lvl===2?w.length>=5&&w.length<=8:w.length>=8);const pool=f.length?f:list;const w=pool[Math.floor(Math.random()*pool.length)];
  let th=cfg.theme;if(th==='bunt')th=Object.keys(THN).find(k=>W[k].split(' ').includes(w));return {w,hint:THN[th]};}
function start(){let w,hint;if(cfg.mode==='2p'){w=$('#secret').value.trim().toUpperCase().replace(/[^A-ZÄÖÜß ]/g,'').replace(/ß/g,'SS');hint=$('#secretHint').value.trim();if(w.replace(/ /g,'').length<2){infoBox('<p>Bitte ein Wort mit mindestens 2 Buchstaben eingeben.</p>');return;}$('#secret').value='';$('#secretHint').value='';}
  else({w,hint}=pickWord());
  G={w,hint,g:new Set(),f:0,over:false};$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');
  $('#keys').innerHTML=AB.map(a=>`<button data-k="${a}">${a}</button>`).join('');render();}
function render(){$('#word').innerHTML=[...G.w].map(ch=>ch===' '?'<span class="sp"></span>':`<span class="${G.g.has(ch)?'show':G.over?'miss':''}">${G.g.has(ch)||G.over?ch:''}</span>`).join('');
  $('#hint').textContent=G.hint?'💬 '+G.hint:'';$('#lives').textContent='❄️'.repeat(MAXF-G.f)+'💧'.repeat(G.f);drawScene();}
function drawScene(){const f=G.f,melt=f/MAXF;const sunR=14+f*3,sunCol=`hsl(${48-f*4},100%,${60-f*2}%)`;
  const parts=[];parts.push(`<rect x="0" y="0" width="200" height="200" rx="18" fill="${theme==='dark'?'#1a2a44':'#cfe9ff'}"/>`);
  parts.push(`<circle cx="165" cy="35" r="${sunR}" fill="${sunCol}" opacity="${.5+melt*.5}"/>`);
  for(let k=0;k<f;k++)parts.push(`<line x1="165" y1="35" x2="${165+Math.cos(k*0.9)*(sunR+12)}" y2="${35+Math.sin(k*0.9)*(sunR+12)}" stroke="${sunCol}" stroke-width="3" stroke-linecap="round"/>`);
  parts.push(`<ellipse cx="100" cy="182" rx="${70+f*6}" ry="${10+f*1.2}" fill="#eaf6ff"/>`);
  if(f>0)parts.push(`<ellipse cx="100" cy="184" rx="${10+f*9}" ry="${2+f}" fill="#7cc8ff" opacity=".8"/>`);
  const sq=1-melt*0.55;// Körper wird kleiner
  const b1=f<7?30*sq+6:0,b2=f<5?22*sq+4:0,b3=f<3?16:f<4?12:0;
  if(b1)parts.push(`<circle cx="100" cy="${178-b1}" r="${b1}" fill="#fff" stroke="#cde" />`);
  if(b2)parts.push(`<circle cx="100" cy="${178-2*b1-b2+6}" r="${b2}" fill="#fff" stroke="#cde"/>`,`<circle cx="100" cy="${178-2*b1-b2+2}" r="2.5" fill="#333"/>`,`<circle cx="100" cy="${178-2*b1-b2+12}" r="2.5" fill="#333"/>`);
  if(b3){const hy=178-2*b1-2*b2-b3+12;parts.push(`<circle cx="100" cy="${hy}" r="${b3}" fill="#fff" stroke="#cde"/>`,`<circle cx="94" cy="${hy-3}" r="2" fill="#222"/>`,`<circle cx="106" cy="${hy-3}" r="2" fill="#222"/>`,`<polygon points="100,${hy} 100,${hy+4} ${118-f*3},${hy+3}" fill="#ff8c1a"/>`,
    f<2?`<path d="M93 ${hy+7} Q100 ${hy+12} 107 ${hy+7}" stroke="#222" fill="none" stroke-width="1.6"/>`:`<path d="M93 ${hy+10} Q100 ${hy+6} 107 ${hy+10}" stroke="#222" fill="none" stroke-width="1.6"/>`);
    if(f<1)parts.push(`<rect x="86" y="${hy-b3-14}" width="28" height="14" fill="#2b2b2b"/><rect x="80" y="${hy-b3-2}" width="40" height="4" fill="#2b2b2b"/>`);}
  else if(f<7){parts.push(`<polygon points="${92+f},170 ${92+f},174 ${108},172" fill="#ff8c1a"/>`);}
  if(f>=1&&f<7)parts.push(`<rect x="${140}" y="170" width="24" height="9" fill="#2b2b2b" transform="rotate(-15 152 174)"/>`);
  if(b2&&f<6)parts.push(`<line x1="${100-b2}" y1="${178-2*b1-b2+8}" x2="${100-b2-22}" y2="${178-2*b1-b2-8}" stroke="#7a4a1d" stroke-width="3"/><line x1="${100+b2}" y1="${178-2*b1-b2+8}" x2="${100+b2+22}" y2="${178-2*b1-b2-8+f*4}" stroke="#7a4a1d" stroke-width="3"/>`);
  $('#scene').innerHTML=parts.join('');}
function guess(ch){if(!G||G.over||G.g.has(ch))return;G.g.add(ch);const btn=$(`#keys button[data-k="${ch}"]`);
  if(G.w.includes(ch)){btn.classList.add('ok');tone(660,.08);tone(880,.1,.08);}else{btn.classList.add('no');G.f++;tone(200,.2,0,'sine');}
  btn.disabled=true;const done=[...G.w].every(c=>c===' '||G.g.has(c));
  if(done){G.over=true;render();st.w++;KIT.set('sm-st',st);sWin();confetti();setTimeout(()=>end(true),900);return;}
  if(G.f>=MAXF){G.over=true;render();st.l++;KIT.set('sm-st',st);sLose();setTimeout(()=>end(false),1100);return;}render();}
function end(win){modal(`<div class="big">${win?'⛄🎉':'💧'}</div><h2 style="text-align:center">${win?'Schneemann gerettet!':'Geschmolzen!'}</h2><p style="text-align:center">Das Wort war: <b>${G.w}</b></p><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Nochmal</button></div>`,null,false).then(v=>{if(v==='a'){if(cfg.mode==='2p')$('#btnMenu').onclick();else start();}else $('#btnMenu').onclick();showStat();});}
$('#keys').onclick=e=>{const b=e.target.closest('button');if(b)guess(b.dataset.k);};
document.addEventListener('keydown',e=>{if($('#game').classList.contains('hidden'))return;const k=e.key.toUpperCase();if(AB.includes(k))guess(k);});
$('#btnTip').onclick=()=>{if(!G||G.over)return;const miss=[...new Set([...G.w].filter(c=>c!==' '&&!G.g.has(c)))];if(!miss.length)return;if(G.f>=MAXF-1){infoBox('<p>Kein Tipp mehr möglich – sonst schmilzt der Schneemann! 😉</p>');return;}G.f++;guess(miss[Math.floor(Math.random()*miss.length)]);};
$('#btnMenu').onclick=()=>{$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');showStat();};
$('#btnStart').onclick=start;$('#secret').onkeydown=e=>{if(e.key==='Enter')start();};
window.onTheme=()=>{if(G)drawScene();};applyTheme();

initHelp('schneemann-raten');
</script>
