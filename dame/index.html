<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>🔴 So spielst du Dame</h2>
<h3>Ziel</h3><p>Schlage alle Steine deines Gegners – oder blockiere sie, sodass er nicht mehr ziehen kann.</p>
<h3>Ziehen</h3><ol><li>Gespielt wird nur auf den <b>dunklen Feldern</b>. Rot beginnt.</li><li>Tippe einen deiner Steine an, dann das grün markierte Zielfeld.</li><li>Steine ziehen <b>ein Feld schräg vorwärts</b>.</li></ol>
<h3>Schlagen</h3><ul><li>Steht ein gegnerischer Stein schräg neben dir und dahinter ist frei, springst du drüber – er ist geschlagen. Schlagen geht auch <b>rückwärts</b>.</li><li>Kannst du danach nochmal springen, geht es automatisch weiter.</li><li><b>Schlagzwang:</b> Wer schlagen kann, <i>muss</i> schlagen. Diese Steine haben einen gelben Rand.</li></ul>
<h3>Die Dame ♛</h3><p>Erreicht ein Stein die gegnerische Grundreihe, wird er zur <b>Dame</b>. Sie zieht und schlägt beliebig weit schräg – vorwärts und rückwärts.</p>
<div class="tip">💡 Tipp: Lass deine hintere Reihe so lange wie möglich stehen – dann bekommt der Gegner keine Dame. Mit „↶ Zug zurück“ kannst du Fehler rückgängig machen.</div>`;
/* Brett: 64 Felder, r=Rot (unten, zieht nach oben), b=Schwarz. Großbuchstabe = Dame */
let cfg=KIT.get('dame-cfg',{mode:'cpu',lvl:2,col:'r'});
let B,turn,hist,sel=null,over=null,lastMv=null,thinking=false,quiet=0,token=0;
const own=(p,c)=>p&&p.toLowerCase()===c,isK=p=>p&&p!==p.toLowerCase(),opp=c=>c==='r'?'b':'r';
const rc=i=>[i>>3,i&7],idx=(r,c)=>r*8+c,inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function init(){B=Array(64).fill('');for(let i=0;i<64;i++){const [r,c]=rc(i);if((r+c)%2===1){if(r<3)B[i]='b';else if(r>4)B[i]='r';}}turn='r';hist=[];sel=null;over=null;lastMv=null;quiet=0;}
const FWD={r:-1,b:1};
// alle Schlagfolgen für Stein an i
function caps(b,i){
  const p=b[i],c=p.toLowerCase(),k=isK(p),res=[];
  function dfs(pos,path,taken,brd){
    let any=false;const [r,cc]=rc(pos);
    for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
      if(!k){const mr=r+dr,mc=cc+dc,lr=r+2*dr,lc=cc+2*dc;if(!inb(lr,lc))continue;const m=idx(mr,mc),l=idx(lr,lc);
        if(brd[m]&&own(brd[m],opp(c))&&!taken.includes(m)&&!brd[l]){any=true;const nb=brd.slice();nb[l]=nb[pos];nb[pos]='';dfs(l,[...path,l],[...taken,m],nb);}}
      else{let rr=r+dr,cc2=cc+dc;while(inb(rr,cc2)&&!brd[idx(rr,cc2)]){rr+=dr;cc2+=dc;}
        if(!inb(rr,cc2))continue;const m=idx(rr,cc2);if(!own(brd[m],opp(c))||taken.includes(m))continue;
        let lr=rr+dr,lc=cc2+dc;while(inb(lr,lc)&&!brd[idx(lr,lc)]){any=true;const l=idx(lr,lc),nb=brd.slice();nb[l]=nb[pos];nb[pos]='';dfs(l,[...path,l],[...taken,m],nb);lr+=dr;lc+=dc;}}
    }
    if(!any&&taken.length)res.push({from:i,path,taken});
  }
  dfs(i,[],[],b);return res;
}
function moves(b,c){
  let cs=[];for(let i=0;i<64;i++)if(own(b[i],c))cs.push(...caps(b,i));
  if(cs.length)return cs;   // Schlagzwang
  const out=[];for(let i=0;i<64;i++){if(!own(b[i],c))continue;const [r,cc]=rc(i),k=isK(b[i]);
    for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
      if(!k){if(dr!==FWD[c])continue;const nr=r+dr,nc=cc+dc;if(inb(nr,nc)&&!b[idx(nr,nc)])out.push({from:i,path:[idx(nr,nc)],taken:[]});}
      else{let nr=r+dr,nc=cc+dc;while(inb(nr,nc)&&!b[idx(nr,nc)]){out.push({from:i,path:[idx(nr,nc)],taken:[]});nr+=dr;nc+=dc;}}}}
  return out;
}
function apply(b,m){const nb=b.slice(),to=m.path[m.path.length-1];let p=nb[m.from];nb[m.from]='';m.taken.forEach(t=>nb[t]='');
  const [r]=rc(to);if(!isK(p)&&((p==='r'&&r===0)||(p==='b'&&r===7)))p=p.toUpperCase();nb[to]=p;return nb;}
function evalB(b,c){let s=0;for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const [r,cc]=rc(i),me=own(p,c)?1:-1;
  let v=isK(p)?320:100;if(!isK(p)){const adv=p==='r'?7-r:r;v+=adv*4;if(cc===0||cc===7)v+=4;if((p==='r'&&r===7)||(p==='b'&&r===0))v+=6;}else v+=(3.5-Math.abs(3.5-r))*2+(3.5-Math.abs(3.5-cc))*2;s+=me*v;}return s;}
function search(b,c,d,a,be){const ms=moves(b,c);if(!ms.length)return -9999-d;if(d===0)return evalB(b,c);
  ms.sort((x,y)=>y.taken.length-x.taken.length);
  for(const m of ms){const s=-search(apply(b,m),opp(c),d-1,-be,-a);if(s>a)a=s;if(a>=be)break;}return a;}
function best(b,c,lvl){const ms=moves(b,c);if(lvl===1&&Math.random()<.5)return ms[Math.floor(Math.random()*ms.length)];
  const d=[0,1,4,7][lvl];let bm=null,bs=-1e9;
  for(const m of ms.sort(()=>Math.random()-.5)){const s=-search(apply(b,m),opp(c),d-1,-1e9,1e9)+(lvl===1?Math.random()*60:0);if(s>bs){bs=s;bm=m;}}return bm;}
/* Anzeige */
const human=()=>cfg.mode==='pvp'?turn:cfg.col;
const myCol=()=>cfg.mode==='online'?onCol:cfg.col;const bottom=()=>cfg.mode==='online'?onCol:cfg.mode==='cpu'?cfg.col:'r';
function render(){
  const ms=over?[]:moves(B,turn),canMove=!over&&!thinking&&(cfg.mode==='pvp'||turn===myCol());
  const mustSet=new Set(ms.filter(m=>m.taken.length).map(m=>m.from));
  const tg=sel!==null?ms.filter(m=>m.from===sel):[];
  const flip=bottom()==='b';let h='';
  for(let k=0;k<64;k++){const i=flip?63-k:k,[r,c]=rc(i),dark=(r+c)%2===1;
    let cls='sq '+(dark?'d':'l');if(lastMv&&(lastMv.from===i||lastMv.path.includes(i)))cls+=' last';if(sel===i)cls+=' sel';
    if(tg.some(m=>m.path[m.path.length-1]===i))cls+=' tgt';if(canMove&&mustSet.has(i))cls+=' must';
    if(canMove&&(ms.some(m=>m.from===i)||tg.length))cls+=' mov';
    const p=B[i];h+=`<div class="${cls}" data-i="${i}">${p?`<div class="pc ${p.toLowerCase()}${isK(p)?' k':''}${lastMv&&lastMv.path[lastMv.path.length-1]===i?' pop':''}"></div>`:''}</div>`;}
  $('#board').innerHTML=h;
  const cnt=c=>B.filter(p=>own(p,c)).length,nm=c=>cfg.mode==='online'?onName(c):cfg.mode==='cpu'?(c===cfg.col?'Du':'Computer'):(c==='r'?'Rot':'Schwarz');
  for(const [id,c] of [['#pBot',bottom()],['#pTop',opp(bottom())]]){const el=$(id);el.querySelector('.dot').style.background=c==='r'?'#d9443a':'#26292f';
    el.querySelector('.nm').textContent=nm(c)+(cfg.mode==='cpu'&&c!==cfg.col?' 🤖':'');el.querySelector('.caps').textContent=`hat ${12-cnt(opp(c))} geschlagen`;el.classList.toggle('cur',!over&&turn===c);}
  if(over)$('#status').textContent=over;
  else if(thinking)$('#status').innerHTML='<span style="opacity:.7">🤖 Computer überlegt …</span>';
  else $('#status').textContent=(cfg.mode==='online'?(turn===onCol?'Du bist dran':onName(turn)+' ist dran …'):cfg.mode==='cpu'?'Du bist dran':(turn==='r'?'Rot':'Schwarz')+' ist dran')+(mustSet.size?' – Schlagzwang!':'');
  $('#btnUndo').disabled=!hist.length||thinking;
  $$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.mode));$$('#lvlSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===cfg.lvl));$$('#colSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.col));$('#cpuOpts').classList.toggle('hidden',cfg.mode!=='cpu');
}
$('#board').onclick=e=>{const s=e.target.closest('.sq');if(!s||over||thinking)return;if((cfg.mode==='cpu'||cfg.mode==='online')&&turn!==myCol())return;
  const i=+s.dataset.i,ms=moves(B,turn);
  if(sel!==null){const m=ms.filter(x=>x.from===sel&&x.path[x.path.length-1]===i).sort((a,b)=>b.taken.length-a.taken.length)[0];if(m){if(cfg.mode==='online')NET.send({m,n:hist.length+1});doMove(m);return;}}
  if(ms.some(m=>m.from===i)){sel=i;tone(500,.04);}else{sel=null;if(own(B[i],turn)&&ms.some(m=>m.taken.length)){$('#status').textContent='Du musst schlagen! Die gelb markierten Steine können schlagen.';tone(220,.1);return;}}render();};
async function doMove(m){
  const tk=token;hist.push({B:B.slice(),turn,lastMv,quiet});sel=null;
  // Schritt für Schritt
  let pos=m.from;for(let k=0;k<m.path.length;k++){const to=m.path[k];const p=B[pos];B[pos]='';if(m.taken[k]!==undefined){B[m.taken[k]]='';tone(330,.08,0,'square',.08);}else tone(520,.05);B[to]=p;pos=to;lastMv={from:m.from,path:m.path.slice(0,k+1)};render();if(m.path.length>1)await sleep(260);if(tk!==token)return;}
  B=apply(hist[hist.length-1].B,m);lastMv=m;quiet=m.taken.length?0:(quiet+1);turn=opp(turn);checkEnd();render();
  if(!over&&cfg.mode==='cpu'&&turn!==cfg.col)cpuMove();
}
function checkEnd(){
  if(!moves(B,turn).length){const winner=opp(turn);
    if(cfg.mode==='online'){if(winner===onCol){over='🎉 Du hast gewonnen!';confetti();sWin();}else{over=onName(winner)+' gewinnt!';sLose();}}
    else if(cfg.mode==='cpu'){if(winner===cfg.col){over='🎉 Du hast gewonnen!';confetti();sWin();}else{over='Der Computer gewinnt 🤖';sLose();}}
    else{over=`🎉 ${winner==='r'?'Rot':'Schwarz'} gewinnt!`;confetti();sWin();}}
  else if(quiet>=50){over='Remis – 25 Züge ohne Schlagen 🤝';}
}
async function cpuMove(){thinking=true;render();const tk=token;await sleep(350);if(tk!==token)return;
  const m=best(B,turn,cfg.lvl);await sleep(250);if(tk!==token)return;thinking=false;if(m)doMove(m);}
function newGame(){token++;thinking=false;init();render();if(cfg.mode==='cpu'&&cfg.col!=='r')cpuMove();}
$('#btnNew').onclick=()=>{if(cfg.mode==='online')NET.send({reset:Date.now()});newGame();};
$('#btnUndo').onclick=()=>{if(cfg.mode==='online'){ONLINE.toast('Online kann man nicht zurücknehmen.');return;}if(!hist.length||thinking)return;token++;let h=hist.pop();if(cfg.mode==='cpu'&&h.turn!==cfg.col&&hist.length)h=hist.pop();B=h.B;turn=h.turn;lastMv=h.lastMv;quiet=h.quiet;over=null;sel=null;render();};
for(const [id,k,num] of [['modeSeg','mode',0],['lvlSeg','lvl',1],['colSeg','col',0]])
  $('#'+id).onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=num?+b.dataset.v:b.dataset.v;if(cfg[k]===v)return;if(k==='mode'&&v==='online'){NET.create();return;}if(k==='mode'&&cfg.mode==='online'&&window.NET)NET.leave();cfg[k]=v;KIT.set('dame-cfg',cfg);if(k==='lvl'){render();return;}newGame();};
window.onTheme=()=>{};
let onCol='r';const onName=c=>{const P=window.NET?NET.players():[];return ((P.find(x=>x.seat===(c==='r'?0:1))||{}).name||'?')+(c===onCol?' (du)':'');};if(cfg.mode==='online')cfg.mode='cpu';
if(window.NET&&NET.supported()){$$('.onl').forEach(b=>b.classList.remove('hidden'));
  NET.setup({title:'Dame',min:2,max:2,onStart(room,seat){onCol=seat===0?'r':'b';cfg.mode='online';newGame();},
    onState(st){if(cfg.mode!=='online')return;if(st.reset){newGame();return;}if(st.m&&st.n===hist.length+1){st.m.taken=st.m.taken?Object.values(st.m.taken):[];st.m.path=Object.values(st.m.path||{});doMove(st.m);}}});}
applyTheme();newGame();

initHelp('dame');
</script>
</body>
</html>
