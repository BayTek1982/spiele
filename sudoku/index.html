<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlen-Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#7b5cff;--acc-ink:#ffffff}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.sgrid{display:grid;width:min(94vw,470px);margin:0 auto;border:3px solid var(--txt);border-radius:10px;overflow:hidden;background:var(--txt);gap:1px;user-select:none;touch-action:manipulation}
.sc{aspect-ratio:1/1;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--fs,22px);cursor:pointer;position:relative}
.sc.giv{color:var(--txt)}
.sc.usr{color:var(--acc)}
.sc.bR{margin-right:2px}.sc.bB{margin-bottom:2px}
.sc.peer{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.sc.same{background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.sc.sel{background:color-mix(in srgb,var(--acc) 38%,var(--card))}
.sc.err{color:#e0453a!important;animation:shk .3s}
.sc .nt{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:calc(var(--fs) * .38);color:var(--mut);font-weight:700;line-height:1}
.sc .nt span{display:flex;align-items:center;justify-content:center}
.sc.done{animation:flash .6s}
@keyframes flash{50%{background:color-mix(in srgb,#2fa35a 45%,var(--card))}}
@keyframes shk{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.nums{display:grid;gap:6px;width:min(94vw,470px);margin:12px auto 0}
.nums button{padding:12px 0;font-size:22px;position:relative}
.nums button small{position:absolute;top:2px;right:5px;font-size:10px;color:var(--mut)}
.nums button.full{opacity:.35}
.tools{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.tools button.on{background:var(--acc);color:#fff}
.info{display:flex;justify-content:space-between;width:min(94vw,470px);margin:0 auto 8px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--mut)}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">🔢</span><h1>Zahlen-<b>Sudoku</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="setup">
    <div class="card opts">
      <div><div class="lbl">Größe</div><div class="seg" id="sizeSeg"><button data-v="4">4×4 (ab 5 J.)</button><button data-v="6">6×6</button><button data-v="9">9×9 Klassik</button></div></div>
      <div><div class="lbl">Schwierigkeit</div><div class="seg" id="lvlSeg"><button data-v="1">😊 Leicht</button><button data-v="2">🙂 Mittel</button><button data-v="3">😎 Schwer</button></div></div>
      <div class="row"><button class="primary" id="btnStart">Neues Rätsel</button><button id="btnCont" class="hidden">▶ Weiterspielen</button></div>
    </div>
    <div class="note" id="best" style="text-align:center"></div>
  </section>
  <section id="game" class="hidden">
    <div class="info"><span id="iLvl"></span><span id="iErr"></span><span id="iTime">0:00</span></div>
    <div class="sgrid" id="grid"></div>
    <div class="nums" id="nums"></div>
    <div class="tools"><button class="small" id="btnNote">✏️ Notizen</button><button class="small" id="btnDel">⌫ Löschen</button><button class="small" id="btnHint">💡 Tipp</button><button class="small" id="btnMenu">‹ Menü</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=8"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>🔢 So spielst du Sudoku</h2>
<h3>Ziel</h3><p>Fülle alle leeren Felder mit Zahlen.</p>
<h3>Die Regel</h3><p>In jeder <b>Reihe</b>, jeder <b>Spalte</b> und jedem dick umrandeten <b>Kasten</b> darf jede Zahl nur <b>einmal</b> vorkommen.</p>
<ul><li><b>4×4:</b> Zahlen 1–4 – perfekt zum Lernen.</li><li><b>6×6:</b> Zahlen 1–6, Kästen sind 2×3 groß.</li><li><b>9×9:</b> Das klassische Sudoku mit 1–9.</li></ul>
<h3>So geht's</h3><ol><li>Tippe ein leeres Feld an, dann unten eine Zahl.</li><li>Falsche Zahlen werden <b style="color:#e0453a">rot</b>.</li><li>Mit <b>✏️ Notizen</b> kannst du dir kleine Merk-Zahlen eintragen.</li><li><b>💡 Tipp</b> füllt ein Feld richtig aus.</li></ol>
<div class="tip">💡 Tipp: Such eine Reihe oder einen Kasten, in dem nur noch eine Zahl fehlt!</div>`;
let cfg={n:+KIT.get('su-n',4),lvl:+KIT.get('su-lvl',1)};let G=null,timer=null;
function bindSeg(id,val,cb){const el=$(id);const set=v=>{el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==String(v)));};set(val);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;set(b.dataset.v);cb(b.dataset.v);};}
bindSeg('#sizeSeg',cfg.n,v=>{cfg.n=+v;KIT.set('su-n',+v);});bindSeg('#lvlSeg',cfg.lvl,v=>{cfg.lvl=+v;KIT.set('su-lvl',+v);});
const box=n=>n===4?[2,2]:n===6?[2,3]:[3,3];// [Zeilen, Spalten] pro Kasten
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ok(g,n,r,c,v){const [br,bc]=box(n);for(let k=0;k<n;k++){if(g[r*n+k]===v||g[k*n+c]===v)return false;}const r0=r-r%br,c0=c-c%bc;for(let y=0;y<br;y++)for(let x=0;x<bc;x++)if(g[(r0+y)*n+c0+x]===v)return false;return true;}
function fill(g,n){const i=g.indexOf(0);if(i<0)return true;const r=Math.floor(i/n),c=i%n;for(const v of shuffle([...Array(n)].map((_,k)=>k+1))){if(ok(g,n,r,c,v)){g[i]=v;if(fill(g,n))return true;g[i]=0;}}return false;}
function count(g,n,lim){const i=g.indexOf(0);if(i<0)return 1;const r=Math.floor(i/n),c=i%n;let s=0;for(let v=1;v<=n;v++){if(ok(g,n,r,c,v)){g[i]=v;s+=count(g,n,lim);g[i]=0;if(s>=lim)break;}}return s;}
function make(n,lvl){const sol=Array(n*n).fill(0);fill(sol,n);const puz=sol.slice();
  const target={4:[6,8,10],6:[14,18,22],9:[38,46,53]}[n][lvl-1];let removed=0;
  for(const i of shuffle([...Array(n*n).keys()])){if(removed>=target)break;const v=puz[i];puz[i]=0;if(count(puz.slice(),n,2)!==1){puz[i]=v;continue;}removed++;}
  return {sol,puz};}
function start(saved){
  if(saved)G=saved;else{const {sol,puz}=make(cfg.n,cfg.lvl);G={n:cfg.n,lvl:cfg.lvl,sol,giv:puz.map(v=>v>0),val:puz.slice(),notes:Array(cfg.n*cfg.n).fill(0).map(()=>[]),err:0,t:0,sel:-1,note:false};}
  $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');
  const n=G.n,[br,bc]=box(n);$('#grid').style.gridTemplateColumns=`repeat(${n},1fr)`;$('#grid').style.setProperty('--fs',n===9?'clamp(16px,5vw,26px)':n===6?'clamp(20px,6.5vw,30px)':'clamp(26px,9vw,40px)');
  $('#grid').innerHTML=G.val.map((v,i)=>{const r=Math.floor(i/n),c=i%n;return `<div class="sc ${(c%bc===bc-1&&c<n-1)?'bR':''} ${(r%br===br-1&&r<n-1)?'bB':''}" data-i="${i}"></div>`;}).join('');
  $('#nums').style.gridTemplateColumns=`repeat(${n},1fr)`;$('#nums').innerHTML=[...Array(n)].map((_,k)=>`<button data-v="${k+1}">${k+1}<small></small></button>`).join('');
  $('#iLvl').textContent=`${n}×${n} · ${['','Leicht','Mittel','Schwer'][G.lvl]}`;clearInterval(timer);timer=setInterval(()=>{G.t++;$('#iTime').textContent=fmtT(G.t);if(G.t%5===0)save();},1000);render();}
const fmtT=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function render(){const n=G.n,[br,bc]=box(n),s=G.sel,sv=s>=0?G.val[s]:0;
  $$('#grid .sc').forEach((el,i)=>{const r=Math.floor(i/n),c=i%n,v=G.val[i];
    const peer=s>=0&&(Math.floor(s/n)===r||s%n===c||(Math.floor(Math.floor(s/n)/br)===Math.floor(r/br)&&Math.floor((s%n)/bc)===Math.floor(c/bc)));
    el.classList.toggle('giv',G.giv[i]);el.classList.toggle('usr',!G.giv[i]&&v>0);el.classList.toggle('sel',i===s);el.classList.toggle('peer',peer&&i!==s);el.classList.toggle('same',sv>0&&v===sv&&i!==s);
    el.classList.toggle('err',v>0&&!G.giv[i]&&v!==G.sol[i]);
    el.innerHTML=v?v:(G.notes[i].length?`<div class="nt">${[...Array(n)].map((_,k)=>`<span>${G.notes[i].includes(k+1)?k+1:''}</span>`).join('')}</div>`:'');});
  $$('#nums button').forEach(b=>{const v=+b.dataset.v;const cnt=G.val.filter((x,i)=>x===v&&x===G.sol[i]).length;b.classList.toggle('full',cnt>=n);b.querySelector('small').textContent=n-cnt||'';});
  $('#iErr').textContent=`Fehler: ${G.err}`;$('#btnNote').classList.toggle('on',G.note);}
$('#grid').onclick=e=>{const el=e.target.closest('.sc');if(!el)return;G.sel=+el.dataset.i;tone(500,.03);render();};
function put(v){const i=G.sel;if(i<0||G.giv[i]||G.val[i]===G.sol[i])return;
  if(G.note){const a=G.notes[i];G.notes[i]=a.includes(v)?a.filter(x=>x!==v):[...a,v];render();return;}
  G.val[i]=v;G.notes[i]=[];if(v!==G.sol[i]){G.err++;tone(180,.2,0,'sine');}else{tone(700,.07);clearNotes(i,v);checkUnits(i);}
  render();save();if(G.val.every((x,k)=>x===G.sol[k]))win();}
function clearNotes(i,v){const n=G.n,[br,bc]=box(n),r=Math.floor(i/n),c=i%n;G.notes.forEach((a,k)=>{const y=Math.floor(k/n),x=k%n;if(y===r||x===c||(Math.floor(y/br)===Math.floor(r/br)&&Math.floor(x/bc)===Math.floor(c/bc)))G.notes[k]=a.filter(z=>z!==v);});}
function checkUnits(i){const n=G.n,[br,bc]=box(n),r=Math.floor(i/n),c=i%n;const units=[[...Array(n)].map((_,k)=>r*n+k),[...Array(n)].map((_,k)=>k*n+c),[...Array(n)].map((_,k)=>(r-r%br+Math.floor(k/bc))*n+(c-c%bc+k%bc))];
  setTimeout(()=>units.forEach(u=>{if(u.every(k=>G.val[k]===G.sol[k])){u.forEach(k=>{const el=$$('#grid .sc')[k];el.classList.remove('done');void el.offsetWidth;el.classList.add('done');});tone(880,.1,0,'triangle',.12);}}),30);}
$('#nums').onclick=e=>{const b=e.target.closest('button');if(b)put(+b.dataset.v);};
document.addEventListener('keydown',e=>{if(!G||$('#game').classList.contains('hidden'))return;const v=+e.key;if(v>=1&&v<=G.n)put(v);if(e.key==='Backspace'||e.key==='Delete')$('#btnDel').onclick();
  const n=G.n;const mv={ArrowUp:-n,ArrowDown:n,ArrowLeft:-1,ArrowRight:1}[e.key];if(mv&&G.sel>=0){G.sel=Math.max(0,Math.min(n*n-1,G.sel+mv));render();}});
$('#btnNote').onclick=()=>{G.note=!G.note;render();};
$('#btnDel').onclick=()=>{const i=G.sel;if(i<0||G.giv[i]||G.val[i]===G.sol[i])return;G.val[i]=0;G.notes[i]=[];render();};
$('#btnHint').onclick=()=>{let i=G.sel;if(i<0||G.giv[i]||G.val[i]===G.sol[i]){const open=G.val.map((v,k)=>v!==G.sol[k]?k:-1).filter(k=>k>=0);if(!open.length)return;i=open[Math.floor(Math.random()*open.length)];G.sel=i;}
  const nn=G.note;G.note=false;put(G.sol[i]);G.note=nn;};
function save(){if(G)KIT.set('su-save',G);}
function win(){clearInterval(timer);KIT.set('su-save',null);const key=`su-best-${G.n}-${G.lvl}`;const b=KIT.get(key,0);const rec=!b||G.t<b;if(rec)KIT.set(key,G.t);sWin();confetti();
  modal(`<div class="big">🏆</div><h2 style="text-align:center">Geschafft!</h2><p style="text-align:center">Zeit: <b>${fmtT(G.t)}</b> · Fehler: <b>${G.err}</b>${rec?'<br>⭐ Neue Bestzeit!':''}</p><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Neues Rätsel</button></div>`,null,false).then(v=>{if(v==='a'){cfg.n=G.n;cfg.lvl=G.lvl;start();}else menu();});}
function menu(){clearInterval(timer);save();$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');showSetup();}
function showSetup(){const s=KIT.get('su-save',null);$('#btnCont').classList.toggle('hidden',!s);
  const bs=[4,6,9].map(n=>{const b=KIT.get(`su-best-${n}-${cfg.lvl}`,0);return b?`${n}×${n}: ${fmtT(b)}`:null;}).filter(Boolean);$('#best').textContent=bs.length?'Bestzeiten ('+['','Leicht','Mittel','Schwer'][cfg.lvl]+'): '+bs.join(' · '):'';}
$('#btnMenu').onclick=menu;$('#btnStart').onclick=()=>start();$('#btnCont').onclick=()=>start(KIT.get('su-save',null));
applyTheme();showSetup();
if(window.NET&&NET.supported()){NET.race({title:'Zahlen-Sudoku',lower:true,unit:'',fmt:v=>Math.floor(v/60)+':'+String(v%60).padStart(2,'0'),start:()=>start(),score:()=>G?G.t:0,ends:{win:()=>G.t}});}

initHelp('sudoku');
</script>
</body>
