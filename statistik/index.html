<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiele-Statistik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#21c3e6;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


:root{--maxw:1000px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .k{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.kpi .v{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.card h3{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.bars .b{display:grid;grid-template-columns:150px 1fr 64px;gap:8px;align-items:center;margin:5px 0;font-size:13.5px}
.bars .b .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bars .b .t{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.bars .b .t i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--acc),#8e5cf0)}
.bars .b .v{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px}
@media(max-width:520px){.bars .b{grid-template-columns:110px 1fr 54px}}
table.st{width:100%;border-collapse:collapse;font-size:13.5px}
.st th,.st td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.st th:nth-child(2),.st td:nth-child(2),.st th:nth-child(3),.st td:nth-child(3){text-align:left}
.st th{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);cursor:pointer;user-select:none}
.st th.on{color:var(--acc)}
.st td.r{font-family:'JetBrains Mono',monospace;color:var(--mut)}
.st tr:hover td{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.tw{overflow-x:auto}
svg.ch{width:100%;height:auto;display:block}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px}
.cols div{flex:1;background:linear-gradient(180deg,var(--acc),#8e5cf0);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);font-family:'JetBrains Mono',monospace}
.cols div:hover::after{content:attr(data-v);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--card);padding:1px 5px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.devs{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:8px 0}
.devs i{display:block;height:100%}
.note2{color:var(--mut);font-size:13px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">📊</span><h1>Spiele-<b>Statistik</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <div class="note2" style="margin:-4px 2px 12px">Anonyme Zählung: Es wird nur gezählt, <b>welches Spiel</b> wie oft geöffnet und wie lange gespielt wird – keine Namen, keine Konten, keine Geräte-Kennungen.</div>
  <div class="seg" id="rangeSeg" style="margin-bottom:12px"><button data-v="all">Gesamt</button><button data-v="30">30 Tage</button><button data-v="7">7 Tage</button><button data-v="1">Heute</button></div>
  <div id="out"><div class="card empty">⏳ Lade Statistik …</div></div>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=7"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>📊 Was zeigt die Statistik?</h2><ul><li><b>Aufrufe:</b> wie oft ein Spiel geöffnet wurde.</li><li><b>Spielzeit:</b> Minuten, in denen jemand wirklich gespielt hat (Seite offen <i>und</i> in den letzten 2 Minuten getippt).</li><li><b>Online-Partien:</b> wie oft ein Spiel online mit Freunden gestartet wurde.</li><li><b>Uhrzeit / Wochentag / Gerät:</b> wann und womit gespielt wird.</li></ul><p>Tippe in der Tabelle auf eine Spaltenüberschrift, um danach zu sortieren. Mit „CSV“ lädst du alles als Tabelle für Excel herunter.</p><p>Die Zählung ist anonym – es wird nicht gespeichert, <b>wer</b> spielt.</p>`;
let range=KIT.get('stat-range','all'),DATA=null,META={},sortK='v',sortDir=-1;
function bindSeg(id,val,cb){const el=$(id);const set=v=>{el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==String(v)));};set(val);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;set(b.dataset.v);cb(b.dataset.v);};}
bindSeg('#rangeSeg',range,v=>{range=v;KIT.set('stat-range',v);render();});
const CATN={winter:'❄️ Winter',knobel:'🧠 Knobeln',wissen:'🎓 Wissen',brett:'🎲 Brett & Karten',action:'🏃 Action',sport:'⚽ Sport',pflege:'🐉 Pflegen'};
const fmtN=n=>Math.round(n).toLocaleString('de-DE');const fmtT=m=>m>=60?(m/60).toLocaleString('de-DE',{maximumFractionDigits:1})+' Std':Math.round(m)+' Min';
const dayKey=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
async function loadMeta(){try{const h=await (await fetch('/index.html',{cache:'no-store'})).text();const d=new DOMParser().parseFromString(h,'text/html');
  d.querySelectorAll('a.tile').forEach(a=>{const href=a.getAttribute('href')||'';const id=href.replace(/^\.?\//,'').replace(/\/$/,'');if(!id||id.startsWith('http'))return;META[id]={n:a.querySelector('h2')?.textContent||id,e:a.querySelector('.ico')?.textContent.trim()||'🎮',cat:(a.dataset.cat||'').split(' ')[0]};});}catch(e){}
  META.start={n:'Startseite',e:'🏠',cat:''};}
const nm=id=>META[id]?META[id].e+' '+META[id].n:'🎮 '+id;
function agg(){const g={};const add=(id,f,v)=>{if(!g[id])g[id]={v:0,m:0,o:0};g[id][f]+=v||0;};
  if(range==='all'){for(const [id,o] of Object.entries(DATA.g||{}))for(const f of ['v','m','o'])add(id,f,o[f]);}
  else{const n=+range;const days=[];for(let k=0;k<n;k++){const t=new Date();t.setDate(t.getDate()-k);days.push(dayKey(t));}
    for(const d of days){const o=(DATA.d||{})[d]||{};for(const [id,x] of Object.entries(o))for(const f of ['v','m','o'])add(id,f,x[f]);}}
  return g;}
function render(){if(!DATA){return;}const g=agg();const rows=Object.entries(g).filter(([id])=>id!=='start').map(([id,o])=>({id,...o,avg:o.v?o.m/o.v:0}));
  const totV=rows.reduce((a,r)=>a+r.v,0),totM=rows.reduce((a,r)=>a+r.m,0),totO=rows.reduce((a,r)=>a+r.o,0);const startV=(g.start||{}).v||0;
  if(!rows.length&&!startV){$('#out').innerHTML='<div class="card empty">Für diesen Zeitraum gibt es noch keine Daten. 🙂<br>Sobald jemand spielt, erscheinen hier die Zahlen.</div>';return;}
  const top=[...rows].sort((a,b)=>b.v-a.v)[0],topT=[...rows].sort((a,b)=>b.m-a.m)[0];
  rows.sort((a,b)=>sortK==='n'?sortDir*nm(a.id).localeCompare(nm(b.id),'de'):sortDir*((a[sortK]||0)-(b[sortK]||0)));
  const maxV=Math.max(1,...rows.map(r=>r.v));const top10=[...rows].sort((a,b)=>b.v-a.v).slice(0,12);const topM=[...rows].sort((a,b)=>b.m-a.m).slice(0,12);const maxM=Math.max(1,...topM.map(r=>r.m));
  // Kategorien
  const cats={};rows.forEach(r=>{const c=(META[r.id]||{}).cat||'andere';cats[c]=cats[c]||{v:0,m:0};cats[c].v+=r.v;cats[c].m+=r.m;});const catArr=Object.entries(cats).sort((a,b)=>b[1].v-a[1].v);const maxC=Math.max(1,...catArr.map(c=>c[1].v));
  // Verlauf 30 Tage
  const days=[];for(let k=29;k>=0;k--){const t=new Date();t.setDate(t.getDate()-k);const key=dayKey(t);const o=(DATA.d||{})[key]||{};let v=0,m=0;for(const [id,x] of Object.entries(o)){v+=x.v||0;m+=x.m||0;}days.push({key,t,v,m});}
  const maxD=Math.max(1,...days.map(d=>d.v));const W=600,H=160;const pts=days.map((d,i)=>[20+i*(W-30)/29,H-20-(d.v/maxD)*(H-40)]);
  const line=`<svg class="ch" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".45"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
    ${[0,.5,1].map(f=>`<line x1="20" x2="${W-10}" y1="${H-20-f*(H-40)}" y2="${H-20-f*(H-40)}" stroke="var(--line)"/><text x="16" y="${H-16-f*(H-40)}" font-size="10" text-anchor="end" fill="var(--mut)">${Math.round(maxD*f)}</text>`).join('')}
    <path d="M${pts[0][0]},${H-20} ${pts.map(p=>'L'+p.join(',')).join(' ')} L${pts[29][0]},${H-20} Z" fill="url(#lg)"/><path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--acc)"><title>${days[i].t.toLocaleDateString('de-DE')}: ${days[i].v} Aufrufe, ${Math.round(days[i].m)} Min</title></circle>`).join('')}
    ${[0,7,14,21,29].map(i=>`<text x="${pts[i][0]}" y="${H-4}" font-size="10" text-anchor="middle" fill="var(--mut)">${days[i].t.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</text>`).join('')}</svg>`;
  const hrs=[...Array(24)].map((_,h)=>(DATA.h||{})[h]||0),maxH=Math.max(1,...hrs);const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];const wds=[1,2,3,4,5,6,0].map(w=>({w,v:(DATA.w||{})[w]||0})),maxW=Math.max(1,...wds.map(x=>x.v));
  const dev=DATA.dev||{};const dh=dev.handy||0,dc=dev.computer||0,dt=Math.max(1,dh+dc);
  const head=[['r','#'],['n','Spiel'],['c','Kategorie'],['v','Aufrufe'],['m','Spielzeit'],['avg','Ø pro Besuch'],['o','Online'],['p','Anteil']];
  $('#out').innerHTML=`<div class="kpis">
    <div class="kpi"><div class="k">Spiel-Aufrufe</div><div class="v">${fmtN(totV)}</div><div class="s">+ ${fmtN(startV)} Startseite</div></div>
    <div class="kpi"><div class="k">Spielzeit</div><div class="v">${fmtT(totM)}</div><div class="s">aktiv gespielt</div></div>
    <div class="kpi"><div class="k">Online-Partien</div><div class="v">${fmtN(totO)}</div><div class="s">mit Freunden</div></div>
    <div class="kpi"><div class="k">Beliebtestes Spiel</div><div class="v" style="font-size:18px">${top?nm(top.id):'–'}</div><div class="s">${top?fmtN(top.v)+' Aufrufe':''}</div></div>
    <div class="kpi"><div class="k">Längste Spielzeit</div><div class="v" style="font-size:18px">${topT&&topT.m?nm(topT.id):'–'}</div><div class="s">${topT&&topT.m?fmtT(topT.m):''}</div></div>
    <div class="kpi"><div class="k">Gespielte Spiele</div><div class="v">${rows.filter(r=>r.v).length}</div><div class="s">von ${Object.keys(META).length-1}</div></div></div>
  <div class="grid2"><div class="card"><h3>🏆 Meiste Aufrufe</h3><div class="bars">${top10.map(r=>`<div class="b"><span class="n">${esc(nm(r.id))}</span><span class="t"><i style="width:${r.v/maxV*100}%"></i></span><span class="v">${fmtN(r.v)}</span></div>`).join('')}</div></div>
    <div class="card"><h3>⏱️ Meiste Spielzeit</h3><div class="bars">${topM.filter(r=>r.m).map(r=>`<div class="b"><span class="n">${esc(nm(r.id))}</span><span class="t"><i style="width:${r.m/maxM*100}%;background:linear-gradient(90deg,#2fa35a,#21c3e6)"></i></span><span class="v">${fmtT(r.m)}</span></div>`).join('')||'<p class="note2">Noch keine Spielzeit.</p>'}</div></div></div>
  <div class="card"><h3>📈 Aufrufe der letzten 30 Tage</h3>${line}</div>
  <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">📋 Alle Spiele</h3><button class="small" id="btnCsv">⬇️ CSV für Excel</button></div><div class="tw"><table class="st" id="tbl"><tr>${head.map(([k,l])=>`<th data-k="${k}" class="${sortK===k?'on':''}">${l}${sortK===k?(sortDir<0?' ▼':' ▲'):''}</th>`).join('')}</tr>
    ${rows.map((r,i)=>`<tr><td class="r">${i+1}</td><td>${esc(nm(r.id))}</td><td>${CATN[(META[r.id]||{}).cat]||''}</td><td>${fmtN(r.v)}</td><td>${fmtT(r.m)}</td><td>${r.v?r.avg.toLocaleString('de-DE',{maximumFractionDigits:1})+' Min':'–'}</td><td>${fmtN(r.o)}</td><td>${totV?(r.v/totV*100).toLocaleString('de-DE',{maximumFractionDigits:1})+' %':'–'}</td></tr>`).join('')}
    ${Object.keys(META).filter(id=>id!=='start'&&!g[id]).map(id=>`<tr style="opacity:.45"><td class="r">–</td><td>${esc(nm(id))}</td><td>${CATN[META[id].cat]||''}</td><td>0</td><td>0 Min</td><td>–</td><td>0</td><td>0 %</td></tr>`).join('')}</table></div></div>
  <div class="grid2"><div class="card"><h3>🗂️ Kategorien</h3><div class="bars">${catArr.map(([c,o])=>`<div class="b"><span class="n">${CATN[c]||c}</span><span class="t"><i style="width:${o.v/maxC*100}%"></i></span><span class="v">${fmtN(o.v)}</span></div>`).join('')}</div></div>
    <div class="card"><h3>📱 Gerät (gesamt)</h3><div class="devs"><i style="width:${dh/dt*100}%;background:#ff4fa0"></i><i style="width:${dc/dt*100}%;background:#21c3e6"></i></div><p>📱 Handy/Tablet: <b>${fmtN(dh)}</b> (${Math.round(dh/dt*100)} %)<br>💻 Computer: <b>${fmtN(dc)}</b> (${Math.round(dc/dt*100)} %)</p></div></div>
  <div class="grid2"><div class="card"><h3>🕐 Uhrzeit (gesamt)</h3><div class="cols" style="margin-bottom:22px">${hrs.map((v,h)=>`<div style="height:${v/maxH*100}%" data-v="${h} Uhr: ${v}">${h%3===0?`<span>${h}</span>`:''}</div>`).join('')}</div></div>
    <div class="card"><h3>📅 Wochentag (gesamt)</h3><div class="cols" style="margin-bottom:22px">${wds.map(x=>`<div style="height:${x.v/maxW*100}%" data-v="${WD[x.w]}: ${x.v}"><span>${WD[x.w]}</span></div>`).join('')}</div></div></div>
  <div class="note2" style="text-align:center">Stand: ${new Date().toLocaleString('de-DE')} · <a href="#" id="reload">🔄 Aktualisieren</a></div>`;
  $('#tbl').onclick=e=>{const th=e.target.closest('th');if(!th)return;const k=th.dataset.k;if(k==='r'||k==='c'||k==='p'){if(k==='p'){sortK='v';}else return;}if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=k==='n'?1:-1;}render();};
  $('#btnCsv').onclick=()=>{const lines=[['Spiel','Kategorie','Aufrufe','Spielzeit (Min)','Ø Min pro Besuch','Online-Partien','Anteil %'].join(';')];rows.forEach(r=>lines.push([META[r.id]?META[r.id].n:r.id,(CATN[(META[r.id]||{}).cat]||'').replace(/^[^ ]+ /,''),r.v,Math.round(r.m),r.avg.toFixed(1).replace('.',','),r.o,totV?(r.v/totV*100).toFixed(1).replace('.',','):'0'].join(';')));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download=`spiele-statistik-${range}.csv`;a.click();};
  $('#reload').onclick=e=>{e.preventDefault();load();};}
async function load(){$('#out').innerHTML='<div class="card empty">⏳ Lade Statistik …</div>';
  if(!window.ONLINE||!ONLINE.available){$('#out').innerHTML='<div class="card empty">Die Statistik funktioniert nur auf <b>spiele.kompassapps.de</b>.</div>';return;}
  const ok=await ONLINE.ready;if(!ok){$('#out').innerHTML='<div class="card empty">Keine Verbindung zum Online-Speicher. Bitte später nochmal versuchen.</div>';return;}
  try{DATA=await ONLINE.B.get('stats')||{};}catch(e){$('#out').innerHTML=`<div class="card empty">Statistik konnte nicht geladen werden (${esc(e.code||e.message)}).<br>Sind die neuen Datenbank-Regeln schon veröffentlicht?</div>`;return;}render();}
applyTheme();loadMeta().then(load);

initHelp('statistik');
</script>
</body>
