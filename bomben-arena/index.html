<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bomben-Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#ff6a1a;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


:root{--maxw:820px}
.wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 26px var(--shadow);border:1px solid var(--line);touch-action:none;user-select:none;max-width:640px;margin:0 auto}
canvas{display:block;width:100%;height:auto}
.bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bar div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:13.5px}
.bar div.dead{opacity:.35;text-decoration:line-through}
.ctlpad{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;max-width:520px;margin:12px auto 0;user-select:none;-webkit-user-select:none}
.dpd{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:4px}
.dpd button,.bomb{padding:0;font-size:26px;touch-action:none;border-radius:14px}
.dpd button.on,.bomb.on{background:var(--acc);color:#fff}
.bomb{width:110px;height:110px;border-radius:50%;font-size:46px}
@media(min-width:900px) and (pointer:fine){.ctlpad{display:none}}

</style>

<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">💣</span><h1>Bomben-<b>Arena</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <section id="setup">
    <div class="card opts">
      <div><div class="lbl">Spielart</div><div class="seg" id="modeSeg"><button data-v="1">🙂 Allein gegen 3 Computer</button><button data-v="2">👥 Zu zweit + 2 Computer</button></div></div>
      <div><div class="lbl">Computer-Stärke</div><div class="seg" id="lvlSeg"><button data-v="1">😊 Leicht</button><button data-v="2">🙂 Mittel</button><button data-v="3">😎 Schwer</button></div></div>
      <div><div class="lbl">Runden bis zum Sieg</div><div class="seg" id="winSeg"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
      <div class="row"><button class="primary" id="btnStart">Los geht's 💣</button></div>
    </div>
    <div class="note">Zu zweit: Spieler 1 steuert mit dem Steuerkreuz (oder Pfeiltasten + Leertaste), Spieler 2 am Computer mit <b>W A S D + Q</b>.</div>
  </section>
  <section id="game" class="hidden">
    <div class="bar" id="bar"></div>
    <div class="wrap"><canvas id="cv" width="624" height="528"></canvas></div>
    <div class="ctlpad"><div class="dpd"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><span></span><button data-d="r">▶</button><span></span><button data-d="d">▼</button><span></span></div><button class="bomb" id="bBomb">💣</button></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="small" id="btnMenu">‹ Menü</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=4"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>💣 So spielst du Bomben-Arena</h2>
<h3>Ziel</h3><p>Sei der <b>Letzte</b>, der in der Arena übrig bleibt!</p>
<h3>Steuerung</h3><ul><li><b>Steuerkreuz</b> (oder Pfeiltasten): laufen</li><li><b>💣</b> (oder Leertaste): Bombe legen</li><li>Spieler 2: <b>W A S D</b> laufen, <b>Q</b> Bombe</li></ul>
<h3>So geht's</h3><ol><li>Bomben explodieren nach 2 Sekunden in einem <b>Kreuz</b>.</li><li>Holzkisten gehen kaputt – darin sind manchmal <b>Extras</b>.</li><li>Steinblöcke halten alles aus.</li><li>Lauf schnell weg, nachdem du eine Bombe gelegt hast! 😄</li></ol>
<h3>Extras</h3><ul><li>💣 <b>Mehr Bomben</b> gleichzeitig</li><li>🔥 <b>Größere Explosion</b></li><li>👟 <b>Schneller laufen</b></li></ul>`;
const C=13,R=11,T=48;const cv=$('#cv'),ctx=cv.getContext('2d');
const HEROES=[{n:'Du',c:'#2f7de1',e:'🙂'},{n:'Bot Rot',c:'#e0453a',e:'🤖'},{n:'Bot Grün',c:'#2fa35a',e:'🤖'},{n:'Bot Gelb',c:'#f2c21b',e:'🤖'}];
let cfg={mode:+KIT.get('bo-mode',1),lvl:+KIT.get('bo-lvl',2),win:+KIT.get('bo-win',2)};let G=null,wins=[0,0,0,0],raf=0,last=0;const keys={};
function bindSeg(id,val,cb){const el=$(id);const set=v=>{el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==String(v)));};set(val);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;set(b.dataset.v);cb(b.dataset.v);};}
bindSeg('#modeSeg',cfg.mode,v=>{cfg.mode=+v;KIT.set('bo-mode',+v);});bindSeg('#lvlSeg',cfg.lvl,v=>{cfg.lvl=+v;KIT.set('bo-lvl',+v);});bindSeg('#winSeg',cfg.win,v=>{cfg.win=+v;KIT.set('bo-win',+v);});
function newMatch(){wins=[0,0,0,0];round();}
function round(){const map=[];for(let y=0;y<R;y++){map.push([]);for(let x=0;x<C;x++){let v=0;if(x===0||y===0||x===C-1||y===R-1||(x%2===0&&y%2===0))v=1;else if(Math.random()<.68)v=2;map[y].push(v);}}
  const starts=[[1,1],[C-2,R-2],[C-2,1],[1,R-2]];for(const [sx,sy] of starts)for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const x=sx+dx,y=sy+dy;if(map[y][x]===2)map[y][x]=0;}
  const names=cfg.mode===2?[{n:'Spieler 1',c:'#2f7de1',e:'🙂'},{n:'Spieler 2',c:'#ff6ad5',e:'😎'},HEROES[2],HEROES[3]]:HEROES;
  G={map,items:{},bombs:[],flames:[],pl:starts.map(([x,y],i)=>({i,...names[i],x,y,tx:x,ty:y,mv:0,alive:true,bombs:1,range:2,speed:4.2,human:i===0||(cfg.mode===2&&i===1),think:0,dir:null,face:'d',deadT:0})),t:0,state:'run',parts:[]};
  $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');bar();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function bar(){$('#bar').innerHTML=G.pl.map((p,i)=>`<div class="${p.alive?'':'dead'}" style="border-color:${p.c}">${p.e} ${p.n} ${'🏆'.repeat(wins[i])}</div>`).join('');}
const solid=(x,y,ignoreBombAt)=>{if(x<0||y<0||x>=C||y>=R)return true;if(G.map[y][x])return true;return G.bombs.some(b=>b.x===x&&b.y===y&&!(ignoreBombAt&&ignoreBombAt[0]===x&&ignoreBombAt[1]===y));};
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function placeBomb(p){if(!p.alive)return;const x=Math.round(p.x),y=Math.round(p.y);if(G.bombs.some(b=>b.x===x&&b.y===y))return;if(G.bombs.filter(b=>b.o===p.i).length>=p.bombs)return;G.bombs.push({x,y,o:p.i,t:2.2,r:p.range});tone(300,.06,0,'square',.06);}
function blastTiles(b){const out=[[b.x,b.y]];for(const [dx,dy] of Object.values(DIRS)){for(let k=1;k<=b.r;k++){const x=b.x+dx*k,y=b.y+dy*k;if(G.map[y][x]===1)break;out.push([x,y]);if(G.map[y][x]===2)break;}}return out;}
function explode(b){G.bombs=G.bombs.filter(o=>o!==b);const tiles=blastTiles(b);tone(90,.35,0,'sawtooth',.18);tone(60,.4,.03,'square',.12);
  for(const [x,y] of tiles){G.flames.push({x,y,t:.55,c:x===b.x&&y===b.y});if(G.map[y][x]===2){G.map[y][x]=0;for(let k=0;k<8;k++)G.parts.push({x:x*T+T/2,y:y*T+T/2,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.6,c:'#b07a3a'});const r=Math.random();if(r<.32)G.items[x+','+y]=r<.12?'b':r<.24?'f':'s';}
    else if(G.items[x+','+y]&&!(G.map[y][x]))delete G.items[x+','+y];
    for(const o of G.bombs)if(o.x===x&&o.y===y)o.t=Math.min(o.t,.05);}}
function danger(){const d=Array.from({length:R},()=>Array(C).fill(99));for(const f of G.flames)d[f.y][f.x]=0;for(const b of G.bombs)for(const [x,y] of blastTiles(b))d[y][x]=Math.min(d[y][x],b.t);return d;}
function bfs(sx,sy,goal,avoid,maxD=40){const seen=new Set([sx+','+sy]);const q=[[sx,sy,null,0]];while(q.length){const [x,y,first,dist]=q.shift();if(dist>0&&goal(x,y))return {first,dist,x,y};if(dist>maxD)continue;
  for(const [k,[dx,dy]] of Object.entries(DIRS)){const nx=x+dx,ny=y+dy;const key=nx+','+ny;if(seen.has(key)||solid(nx,ny))continue;if(avoid&&avoid(nx,ny,dist+1))continue;seen.add(key);q.push([nx,ny,first||k,dist+1]);}}return null;}
function aiThink(p){const x=Math.round(p.x),y=Math.round(p.y);const d=danger();const spd=1/p.speed;
  const unsafe=(nx,ny,steps)=>d[ny][nx]<=steps*spd+.35;
  if(d[y][x]<99){const r=bfs(x,y,(a,b)=>d[b][a]===99,(a,b,s)=>d[b][a]<s*spd+.15&&d[b][a]!==99);p.dir=r?r.first:null;return;}
  const lvl=cfg.lvl;
  // Gegner in Reichweite?
  const enemyNear=G.pl.some(o=>o!==p&&o.alive&&((Math.round(o.x)===x&&Math.abs(Math.round(o.y)-y)<=p.range)||(Math.round(o.y)===y&&Math.abs(Math.round(o.x)-x)<=p.range)));
  const crateNear=Object.values(DIRS).some(([dx,dy])=>G.map[y+dy][x+dx]===2);
  if((enemyNear&&Math.random()<[0,.35,.7,.95][lvl])||(crateNear&&Math.random()<.8)){if(canEscape(p,x,y)){placeBomb(p);p.think=.05;p.dir=null;return;}}
  const item=bfs(x,y,(a,b)=>!!G.items[a+','+b],unsafe,lvl>=2?12:5);if(item&&Math.random()<.9){p.dir=item.first;return;}
  const tgt=lvl>=2&&Math.random()<.5?bfs(x,y,(a,b)=>G.pl.some(o=>o!==p&&o.alive&&Math.round(o.x)===a&&Math.round(o.y)===b),unsafe,30):null;
  const crate=bfs(x,y,(a,b)=>Object.values(DIRS).some(([dx,dy])=>G.map[b+dy]&&G.map[b+dy][a+dx]===2),unsafe,30);
  const pick=tgt&&(!crate||Math.random()<.5)?tgt:crate;if(pick){p.dir=pick.first;return;}
  const opts=Object.keys(DIRS).filter(k=>{const [dx,dy]=DIRS[k];return !solid(x+dx,y+dy)&&d[y+dy][x+dx]===99;});p.dir=opts.length?opts[Math.floor(Math.random()*opts.length)]:null;}
function canEscape(p,x,y){const fake={x,y,r:p.range,t:2.2};const tiles=new Set(blastTiles(fake).map(([a,b])=>a+','+b));const d=danger();G.bombs.push({x,y,o:-1,t:2.2,r:p.range});
  const r=bfs(x,y,(a,b)=>!tiles.has(a+','+b)&&d[b][a]===99,(a,b,s)=>d[b][a]<s/p.speed+.3,8);G.bombs.pop();return !!r&&r.dist<=5;}
function humanDir(p){if(p.i===0)return keys.u?'u':keys.d?'d':keys.l?'l':keys.r?'r':null;return keys.w?'u':keys.s?'d':keys.a?'l':keys.dd?'r':null;}
function step(dt){G.t+=dt;
  for(const b of [...G.bombs]){b.t-=dt;if(b.t<=0)explode(b);}
  for(const f of G.flames)f.t-=dt;G.flames=G.flames.filter(f=>f.t>0);
  for(const p of G.pl){if(!p.alive){p.deadT+=dt;continue;}
    if(!p.human){p.think-=dt;if(p.mv===0&&p.think<=0){aiThink(p);p.think=[0,.35,.18,.06][cfg.lvl];}}
    if(p.mv===0){const dir=p.human?humanDir(p):p.dir;if(dir){p.face=dir;const [dx,dy]=DIRS[dir];const cx=Math.round(p.x),cy=Math.round(p.y);if(!solid(cx+dx,cy+dy)){p.tx=cx+dx;p.ty=cy+dy;p.mv=1;}}}
    if(p.mv){const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.hypot(dx,dy),st=p.speed*dt;if(dist<=st){p.x=p.tx;p.y=p.ty;p.mv=0;if(!p.human)p.think=0;}else{p.x+=dx/dist*st;p.y+=dy/dist*st;}}
    const tx=Math.round(p.x),ty=Math.round(p.y);const it=G.items[tx+','+ty];if(it){delete G.items[tx+','+ty];if(it==='b')p.bombs++;if(it==='f')p.range++;if(it==='s')p.speed=Math.min(7,p.speed+.7);[700,900,1200].forEach((f,k)=>tone(f,.06,k*.05,'triangle',.1));}
    if(G.flames.some(f=>f.x===tx&&f.y===ty)){p.alive=false;tone(400,.1);tone(200,.3,.1,'sine',.15);for(let k=0;k<16;k++)G.parts.push({x:p.x*T+T/2,y:p.y*T+T/2,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.8,c:p.c});bar();}}
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;}G.parts=G.parts.filter(q=>q.life>0);
  const alive=G.pl.filter(p=>p.alive);if(G.state==='run'&&(alive.length<=1||(cfg.mode===1&&!G.pl[0].alive)||(cfg.mode===2&&!G.pl[0].alive&&!G.pl[1].alive))){G.state='end';setTimeout(roundEnd,1200);}}
function roundEnd(){const alive=G.pl.filter(p=>p.alive);let w=alive.length===1?alive[0]:null;if(!w&&alive.length>1)w=null;
  if(w)wins[w.i]++;bar();const champ=wins.findIndex(x=>x>=cfg.win);const humanWon=w&&w.human;if(humanWon){sWin();confetti();}else sLose();
  const txt=w?`${w.e} ${w.n} gewinnt die Runde!`:alive.length?'Die Computer kämpfen weiter – du bist raus!':'Unentschieden – alle erwischt! 💥';
  if(champ>=0){modal(`<div class="big">🏆</div><h2 style="text-align:center">${G.pl[champ].n} ist Arena-Champion!</h2><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Neues Turnier</button></div>`,null,false).then(v=>v==='a'?newMatch():menu());}
  else modal(`<div class="big">${humanWon?'🎉':'💥'}</div><h2 style="text-align:center">${txt}</h2><p style="text-align:center">${G.pl.map((p,i)=>`${p.e} ${wins[i]}`).join(' · ')}</p><div class="row"><button data-v="m">Menü</button><button class="primary" data-v="a">Nächste Runde</button></div>`,null,false).then(v=>v==='a'?round():menu());}
function drawHero(p){const px=p.x*T+T/2,py=p.y*T+T/2;const bob=p.mv?Math.sin(G.t*20)*2:0;ctx.save();ctx.translate(px,py+bob);
  ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,18-bob,14,5,0,0,7);ctx.fill();
  ctx.fillStyle=p.c;ctx.beginPath();ctx.roundRect(-14,-4,28,20,8);ctx.fill();// Körper
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-10,14,0,7);ctx.fill();ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.stroke();// Kopf
  const ex={l:-4,r:4,u:0,d:0}[p.face],ey={u:-3,d:1,l:0,r:0}[p.face];ctx.fillStyle='#222';if(p.face!=='u'){ctx.beginPath();ctx.arc(-5+ex,-11+ey,2.4,0,7);ctx.arc(5+ex,-11+ey,2.4,0,7);ctx.fill();}
  ctx.strokeStyle=p.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,-30);ctx.stroke();ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(0,-31,3.5,0,7);ctx.fill();// Antenne
  ctx.restore();}
function draw(){const dark=theme==='dark';ctx.fillStyle=dark?'#2a4a2a':'#8fcf6a';ctx.fillRect(0,0,C*T,R*T);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){const v=G.map[y][x];const X=x*T,Y=y*T;if(!v&&(x+y)%2){ctx.fillStyle=dark?'#294529':'#86c562';ctx.fillRect(X,Y,T,T);}
    if(v===1){ctx.fillStyle='#7a8290';ctx.fillRect(X,Y,T,T);ctx.fillStyle='#9aa2b0';ctx.fillRect(X+3,Y+3,T-6,T-14);ctx.fillStyle='#5a6270';ctx.fillRect(X,Y+T-6,T,6);}
    if(v===2){ctx.fillStyle='#c98a4b';ctx.fillRect(X+2,Y+2,T-4,T-4);ctx.strokeStyle='#8a5a2b';ctx.lineWidth=3;ctx.strokeRect(X+4,Y+4,T-8,T-8);ctx.beginPath();ctx.moveTo(X+6,Y+6);ctx.lineTo(X+T-6,Y+T-6);ctx.moveTo(X+T-6,Y+6);ctx.lineTo(X+6,Y+T-6);ctx.stroke();}}
  ctx.font='28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';for(const [k,v] of Object.entries(G.items)){const [x,y]=k.split(',').map(Number);if(G.map[y][x])continue;ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.arc(x*T+T/2,y*T+T/2,18+Math.sin(G.t*6)*2,0,7);ctx.fill();ctx.fillText({b:'💣',f:'🔥',s:'👟'}[v],x*T+T/2,y*T+T/2+2);}
  for(const b of G.bombs){const s=1+Math.sin(G.t*(b.t<.7?30:10))*.08;const X=b.x*T+T/2,Y=b.y*T+T/2;ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(X,Y+16,14,5,0,0,7);ctx.fill();ctx.fillStyle='#1d1d24';ctx.beginPath();ctx.arc(X,Y+2,16*s,0,7);ctx.fill();ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.arc(X-5,Y-4,5,0,7);ctx.fill();
    ctx.strokeStyle='#a0703a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X+8,Y-10);ctx.quadraticCurveTo(X+14,Y-20,X+10,Y-24);ctx.stroke();ctx.fillStyle=Math.random()<.5?'#ffd23f':'#ff6a1a';ctx.beginPath();ctx.arc(X+10,Y-25,4,0,7);ctx.fill();}
  for(const f of G.flames){const a=Math.min(1,f.t*3);const X=f.x*T,Y=f.y*T;ctx.globalAlpha=a;const g=ctx.createRadialGradient(X+T/2,Y+T/2,2,X+T/2,Y+T/2,T*.7);g.addColorStop(0,'#fff6b0');g.addColorStop(.4,'#ffb21a');g.addColorStop(1,'#ff4a1a00');ctx.fillStyle=g;ctx.fillRect(X-4,Y-4,T+8,T+8);ctx.globalAlpha=1;}
  for(const p of [...G.pl].sort((a,b)=>a.y-b.y))if(p.alive)drawHero(p);
  for(const q of G.parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.c;ctx.fillRect(q.x-3,q.y-3,6,6);}ctx.globalAlpha=1;}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(G){if(G.state!=='pause')step(dt);draw();}raf=requestAnimationFrame(loop);}
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'w',a:'a',s:'s',d:'dd'};
document.addEventListener('keydown',e=>{if(!G)return;const k=KM[e.key]||KM[e.key.toLowerCase()];if(k){keys[k]=true;e.preventDefault();}if(e.code==='Space'){placeBomb(G.pl[0]);e.preventDefault();}if(e.key.toLowerCase()==='q'&&cfg.mode===2)placeBomb(G.pl[1]);});
document.addEventListener('keyup',e=>{const k=KM[e.key]||KM[e.key.toLowerCase()];if(k)keys[k]=false;});
$$('.dpd button').forEach(b=>{const d=b.dataset.d;const on=e=>{e.preventDefault();keys[d]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};const off=()=>{keys[d]=false;b.classList.remove('on');};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.oncontextmenu=e=>e.preventDefault();});
$('#bBomb').addEventListener('pointerdown',e=>{e.preventDefault();if(G)placeBomb(G.pl[0]);$('#bBomb').classList.add('on');setTimeout(()=>$('#bBomb').classList.remove('on'),120);});
function menu(){cancelAnimationFrame(raf);G=null;$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');}
$('#btnMenu').onclick=menu;$('#btnStart').onclick=newMatch;applyTheme();

initHelp('bomben-arena');
</script>
</body>
