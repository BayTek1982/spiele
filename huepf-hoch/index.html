<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hüpf-Hoch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#ff7a59;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.boardwrap{position:relative;width:min(94vw,400px);margin:0 auto}
canvas{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:16px;background:color-mix(in srgb,var(--bg2) 70%,transparent);text-align:center;padding:18px}
.over h2{font-family:'JetBrains Mono',monospace;margin:0;font-size:22px}
.over p{margin:0;color:var(--mut);line-height:1.45;max-width:290px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px;color:var(--mut);text-align:left;margin-top:4px}
.legend i{display:inline-block;width:22px;height:7px;border-radius:4px;margin-right:6px;vertical-align:middle}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">🐸</span><h1>Hüpf-<b>Hoch</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <div class="stats">
    <div class="stat"><div class="k">Höhe</div><div class="v" id="sc">0</div></div>
    <div class="stat"><div class="k">Rekord</div><div class="v" id="hi">0</div></div>
  </div>
  <div class="boardwrap">
    <canvas id="cv"></canvas>
    <div class="over" id="over"><h2 id="ovT">🐸 Hüpf-Hoch</h2>
      <p id="ovP">Hüpfi springt von allein. Lenke ihn nach links und rechts – wie hoch kommst du?</p>
      <div class="legend" id="legend"><span><i style="background:#3fbf6f"></i>normal</span><span><i style="background:#3b8bff"></i>bewegt sich</span><span><i style="background:#a0703c"></i>bricht weg</span><span>🟨 Feder: Super-Sprung</span></div>
      <button class="primary" id="btnGo">Los geht's</button>
      <p style="font-size:13px">Steuern: linke/rechte Bildschirmhälfte gedrückt halten oder Pfeiltasten</p>
      <button class="small hidden" id="btnTilt">📱 Mit Handy-Neigen steuern</button>
    </div>
  </div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="small" id="btnPause">⏸ Pause</button></div>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=8"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>🐸 So spielst du Hüpf-Hoch</h2>
<h3>Ziel</h3><p>Der Frosch <b>Hüpfi</b> springt von allein. Lenke ihn auf die Plattformen und komm so hoch wie möglich!</p>
<h3>Steuerung</h3><ul><li><b>Handy:</b> Linke Bildschirmhälfte gedrückt halten = nach links, rechte Hälfte = nach rechts. Oder „Mit Handy-Neigen steuern“ antippen und das Handy kippen.</li><li><b>Computer:</b> Pfeiltasten links/rechts.</li><li>Fliegst du links aus dem Bild, kommst du rechts wieder rein.</li></ul>
<h3>Die Plattformen</h3><ul><li>🟩 <b>Grün:</b> ganz normal</li><li>🟦 <b>Blau:</b> bewegt sich hin und her</li><li>🟫 <b>Braun:</b> bricht weg – darauf kannst du nicht springen!</li><li>🟨 <b>Feder:</b> Super-Sprung nach oben</li></ul>
<p>Fällst du unten raus, ist das Spiel vorbei. Je höher du kommst, desto schwieriger wird es.</p>
<div class="tip">💡 Tipp: Schau immer schon nach der <i>nächsten</i> Plattform, während du noch fliegst.</div>`;
const VW=360,VH=600,cv=$('#cv'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=VW*dpr;cv.height=VH*dpr;ctx.scale(dpr,dpr);
const G=1500,JUMP=-720,SPRING=-1150,PW=58,PH=12;
let p,plats,camY,maxH,running=false,paused=false,last=0,keys={l:false,r:false},tilt=null,useTilt=false,parts=[],stars=[];
function rnd(a,b){return a+Math.random()*(b-a);}
function makePlat(y,h){
  const diff=Math.min(1,h/6000);let t='n';const r=Math.random();
  if(r<.12+diff*.3)t='m';
  const pl={x:rnd(4,VW-PW-4),y,t,vx:t==='m'?rnd(50,90+diff*80)*(Math.random()<.5?-1:1):0,spring:false,broken:false,vy:0};
  if(t==='n'&&Math.random()<.07)pl.spring=true;return pl;
}
function reset(){
  p={x:VW/2-16,y:VH-120,vx:0,vy:JUMP,face:1,squash:0};camY=0;maxH=0;parts=[];
  plats=[{x:VW/2-PW/2,y:VH-60,t:'n',vx:0}];let y=VH-60;
  while(y>-VH){y-=rnd(55,80);plats.push(makePlat(y,0));}
  stars=Array.from({length:40},()=>({x:Math.random()*VW,y:Math.random()*VH,s:Math.random()*1.6+.4}));
  $('#sc').textContent=0;$('#hi').textContent=KIT.get('huepf-hi',0);
}
function start(){reset();running=true;paused=false;$('#over').classList.add('hidden');last=performance.now();requestAnimationFrame(loop);}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;if(!paused)update(dt);draw();if(running)requestAnimationFrame(loop);}
function update(dt){
  let ax=0;if(keys.l)ax-=1;if(keys.r)ax+=1;
  if(useTilt&&tilt!==null)p.vx=Math.max(-420,Math.min(420,tilt*18));
  else p.vx=ax*330+(ax===0?p.vx*.0:0);
  if(p.vx<-5)p.face=-1;else if(p.vx>5)p.face=1;
  p.x+=p.vx*dt;if(p.x<-30)p.x=VW;if(p.x>VW)p.x=-30;
  const oldY=p.y;p.vy+=G*dt;p.y+=p.vy*dt;p.squash=Math.max(0,p.squash-dt*4);
  // Plattformen
  const diff=Math.min(1,maxH/6000);
  for(const pl of plats){
    if(pl.t==='m'){pl.x+=pl.vx*dt;if(pl.x<2||pl.x>VW-PW-2)pl.vx*=-1;}
    if(pl.broken){pl.vy+=G*dt;pl.y+=pl.vy*dt;continue;}
    if(p.vy>0&&oldY+40<=pl.y&&p.y+40>=pl.y&&p.x+26>pl.x&&p.x+6<pl.x+PW){
      if(pl.t==='b'){pl.broken=true;pl.vy=0;tone(180,.12,0,'square',.08);continue;}
      p.y=pl.y-40;
      if(pl.spring&&p.x+16>pl.x+PW/2-14&&p.x+16<pl.x+PW/2+14){p.vy=SPRING;tone(500,.08);tone(900,.15,.06);pl.sprung=.3;}
      else{p.vy=JUMP;tone(520+Math.random()*80,.06,0,'sine',.12);}
      p.squash=1;for(let k=0;k<6;k++)parts.push({x:p.x+16,y:pl.y,vx:rnd(-80,80),vy:rnd(-120,-30),t:.4});
    }
    if(pl.sprung)pl.sprung=Math.max(0,pl.sprung-dt);
  }
  // Kamera
  const screenY=p.y-camY;if(screenY<VH*.4)camY=p.y-VH*.4;
  const h=Math.max(0,Math.round((VH-120-p.y)/10));if(h>maxH){maxH=h;$('#sc').textContent=maxH;}
  // neue Plattformen
  plats=plats.filter(pl=>pl.y-camY<VH+60);
  let top=Math.min(...plats.map(pl=>pl.y));
  while(top>camY-80){const gap=rnd(55,75+diff*55);top-=gap;plats.push(makePlat(top,maxH*10));if(Math.random()<.18+diff*.25){const b=makePlat(top+gap/2,0);b.t='b';b.vx=0;b.spring=false;plats.push(b);}}
  parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.t-=dt;});parts=parts.filter(q=>q.t>0);
  if(p.y-camY>VH+40)gameOver();
}
function gameOver(){running=false;const hi=KIT.get('huepf-hi',0),rec=maxH>hi;if(rec)KIT.set('huepf-hi',maxH);
  $('#hi').textContent=KIT.get('huepf-hi',0);$('#ovT').textContent=rec&&maxH?'🏆 Neuer Rekord!':'Runtergefallen!';
  $('#ovP').innerHTML=`Du bist <b>${maxH}</b> hoch gekommen.`;$('#legend').classList.add('hidden');$('#btnGo').textContent='Nochmal';$('#over').classList.remove('hidden');
  if(rec&&maxH){confetti();sWin();}else sLose();draw();}
function drawHuepfi(x,y){
  const sq=p.squash,w=32*(1+sq*.25),h=34*(1-sq*.22);ctx.save();ctx.translate(x+16,y+40);
  ctx.fillStyle='#2e9e57';ctx.fillRect(-11,-8,6,8);ctx.fillRect(5,-8,6,8); // Beine
  ctx.fillStyle='#45c06e';ctx.beginPath();ctx.ellipse(0,-6-h/2,w/2,h/2,0,0,7);ctx.fill();
  ctx.fillStyle='#bff2cf';ctx.beginPath();ctx.ellipse(0,-6-h*.38,w*.3,h*.25,0,0,7);ctx.fill();
  for(const s of[-1,1]){ctx.fillStyle='#45c06e';ctx.beginPath();ctx.arc(s*8,-6-h+2,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*8,-6-h+2,5,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s*8+p.face*1.5,-6-h+2+(p.vy<0?-1:1),2.4,0,7);ctx.fill();}
  ctx.strokeStyle='#1d6a39';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-6-h*.62,5,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.restore();
}
function draw(){
  const dark=theme==='dark';
  const g=ctx.createLinearGradient(0,0,0,VH);const shift=Math.min(1,maxH/5000);
  if(dark){g.addColorStop(0,`rgb(${12-shift*6},${16-shift*8},${30+shift*10})`);g.addColorStop(1,'#1f2a3a');}else{g.addColorStop(0,`rgb(${190-shift*60},${225-shift*60},255)`);g.addColorStop(1,'#f6f1e4');}
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle=dark?'rgba(255,255,255,.6)':'rgba(255,255,255,.8)';for(const s of stars){const yy=((s.y-camY*.15)%VH+VH)%VH;ctx.globalAlpha=dark?.7:.5;ctx.beginPath();ctx.arc(s.x,yy,s.s*(dark?1:3),0,7);ctx.fill();}ctx.globalAlpha=1;
  for(const pl of plats){const y=pl.y-camY;if(y<-20||y>VH+20)continue;
    const col=pl.t==='m'?'#3b8bff':pl.t==='b'?'#a0703c':'#3fbf6f';ctx.fillStyle=col;
    ctx.save();if(pl.broken){ctx.translate(pl.x+PW/2,y);ctx.rotate(.3);ctx.translate(-(pl.x+PW/2),-y);ctx.globalAlpha=.7;}
    ctx.beginPath();ctx.roundRect?ctx.roundRect(pl.x,y,PW,PH,6):ctx.rect(pl.x,y,PW,PH);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(pl.x+6,y+2,PW-12,3);
    if(pl.t==='b'){ctx.strokeStyle='#5e3d1c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pl.x+PW*.45,y);ctx.lineTo(pl.x+PW*.55,y+PH);ctx.stroke();}
    ctx.restore();
    if(pl.spring){const sh=pl.sprung?14:8;ctx.fillStyle='#f2c21b';ctx.fillRect(pl.x+PW/2-8,y-sh,16,4);ctx.strokeStyle='#9aa3ad';ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<3;k++){ctx.moveTo(pl.x+PW/2-6,y-k*sh/3-1);ctx.lineTo(pl.x+PW/2+6,y-k*sh/3-sh/6-1);}ctx.stroke();}
  }
  ctx.fillStyle='rgba(255,255,255,.7)';for(const q of parts){ctx.globalAlpha=q.t/.4;ctx.beginPath();ctx.arc(q.x,q.y-camY,2.5,0,7);ctx.fill();}ctx.globalAlpha=1;
  if(p)drawHuepfi(p.x,p.y-camY);
  if(paused){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,VW,VH);ctx.fillStyle='#fff';ctx.font='bold 22px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.fillText('PAUSE',VW/2,VH/2);}
}
// Steuerung
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){keys.l=true;e.preventDefault();}if(e.key==='ArrowRight'||e.key==='d'){keys.r=true;e.preventDefault();}if(e.key===' '){e.preventDefault();running?togglePause():start();}});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=false;if(e.key==='ArrowRight'||e.key==='d')keys.r=false;});
const touches=new Map();
function updTouch(){keys.l=false;keys.r=false;for(const s of touches.values()){if(s==='l')keys.l=true;else keys.r=true;}}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();touches.set(e.pointerId,e.clientX-r.left<r.width/2?'l':'r');updTouch();cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);e.preventDefault();});
const up=e=>{touches.delete(e.pointerId);updTouch();};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
if(window.DeviceOrientationEvent&&('ontouchstart' in window))$('#btnTilt').classList.remove('hidden');
$('#btnTilt').onclick=async()=>{try{if(DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0;}
  window.addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=e.gamma;});useTilt=true;$('#btnTilt').textContent='✅ Neigen ist an';}catch(err){$('#btnTilt').textContent='Neigen geht hier leider nicht';}};
function togglePause(){if(!running)return;paused=!paused;$('#btnPause').textContent=paused?'▶ Weiter':'⏸ Pause';}
$('#btnPause').onclick=togglePause;$('#btnGo').onclick=start;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause();});
window.onTheme=()=>draw();
reset();applyTheme();draw();
if(window.NET&&NET.supported()){NET.race({title:'Hüpf-Hoch',unit:'m',start:()=>start(),score:()=>Math.round(maxH||0),ends:{gameOver:()=>Math.round(maxH||0)}});}
if(window.NET&&NET.supported()){NET.ghostify({ctx:()=>ctx,pos:()=>p?{x:Math.round(p.x+16),y:Math.round(p.y+14)}:null,map:o=>[o.x,o.y-camY]});}

initHelp('huepf-hoch');
</script>
