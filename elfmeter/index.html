<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elfmeter-Duell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('bs-theme'))||'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
<style>
:root{--acc:#2fd06e;--acc-ink:#14181e}
:root{--bg1:#1f2630;--bg2:#141920;--card:#27303b;--card2:#2f3946;--line:#3a4552;--txt:#eef1f5;--mut:#a7b1bd;--cell:#1b222b;--shadow:rgba(0,0,0,.45)}
[data-theme=light]{--bg1:#f4f1ea;--bg2:#e9e4d8;--card:#ffffff;--card2:#f2eee6;--line:#ddd5c6;--txt:#1f2630;--mut:#6b7380;--cell:#f7f4ee;--shadow:rgba(60,50,30,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--txt);min-height:100vh;transition:background .3s,color .3s;
 background:radial-gradient(900px 500px at 12% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(700px 500px at 110% 15%,rgba(33,195,230,.08),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
#app{max-width:var(--maxw,640px);margin:0 auto;padding:14px 12px 40px}
.hidden{display:none!important}
a.back{color:var(--mut);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:0 0 8px 2px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
header .logo{font-size:26px}
header h1{font-family:'JetBrains Mono',monospace;font-size:21px;margin:0;font-weight:800;letter-spacing:-.5px}
header h1 b{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:6px}
.ib{padding:7px 10px!important;font-size:17px!important;line-height:1}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);transition:filter .15s,transform .1s}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:var(--acc-ink,#14181e);border-color:var(--acc)}
button.small{padding:7px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 8px;color:var(--mut);line-height:1.45}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:8px 6px;border-radius:9px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.opts{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800}
.note{font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;color:var(--txt)}
.modal .box h2{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:19px}
.modal .box p,.modal .box li{line-height:1.5}
.modal .row{justify-content:flex-end;margin-top:14px}
.big{font-size:46px;text-align:center;margin:2px 0 6px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;margin-top:12px;user-select:none}
.pad button{font-size:22px;padding:0;touch-action:manipulation}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help h2{margin:0 0 6px;font-family:'JetBrains Mono',monospace;font-size:19px}
.help h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}
.help p,.help li{line-height:1.5;margin:0 0 6px}
.help ol,.help ul{margin:0 0 4px;padding-left:20px}
.help .tip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
/* iPhone: kein „Kopieren“-Menü / keine Textauswahl beim langen Drücken */
button,.seg,canvas,svg,.tile,.ctrl,.ctlpad,.pads,.dpd,.keys,.nums,.wrap,.board,.hud,[data-i],[data-k]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation}


.idea{margin:-6px 2px 14px;font-size:14px;color:var(--mut)}.idea b{color:var(--acc)}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.team{padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);text-align:center;font-weight:800;font-size:12.5px;cursor:pointer}
.team .f{font-size:24px;display:block}
.team.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card))}
.board{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.board .tm{flex:1;min-width:0}
.board .nm{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .dots{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.board .dots i{width:14px;height:14px;border-radius:50%;background:var(--line);font-style:normal;font-size:9px;display:flex;align-items:center;justify-content:center}
.board .dots i.g{background:#2fbf6a}.board .dots i.m{background:#e5564b}
.board .res{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;padding:0 6px}
.board .tm.r{text-align:right}.board .tm.r .dots{justify-content:flex-end}
#stage{position:relative;width:min(96vw,560px);margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage svg{display:block;width:100%;height:auto}
.zones{position:absolute;left:20.5%;right:20.5%;top:24%;height:39.3%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3px}
.zones button{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.45);border-radius:10px;padding:0;color:#fff;font-size:22px;font-weight:900;opacity:.9}
.zones button:hover{background:rgba(255,255,255,.2)}
.aimlayer{position:absolute;inset:0;cursor:crosshair}
#msg{text-align:center;font-weight:900;font-size:18px;min-height:28px;margin:10px 0 6px}
.meter{position:relative;height:26px;border-radius:13px;overflow:hidden;width:min(90vw,420px);margin:6px auto;background:linear-gradient(90deg,#3a6ea5 0 35%,#2fbf6a 35% 80%,#f2c21b 80% 90%,#e5564b 90%);border:2px solid var(--line)}
.meter i{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #000;border-radius:3px}
.meterlbl{display:flex;justify-content:space-between;width:min(90vw,420px);margin:0 auto;font-size:11px;color:var(--mut);font-family:'JetBrains Mono',monospace}
.cover{position:absolute;inset:0;background:rgba(10,14,20,.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.cover h2{margin:0;font-family:'JetBrains Mono',monospace}
.role{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;background:var(--card);border:1px solid var(--line)}

</style>
</head>
<body>
<div id="app">
  <a class="back hidden" id="hubLink" href="../">‹ Alle Spiele</a>
  <header><span class="logo">⚽</span><h1>Elfmeter-<b>Duell</b></h1><div class="hbtns"><button class="ib" id="btnHelp" title="Anleitung">📖</button><button class="ib" id="btnSound" title="Ton">🔊</button><button class="ib" id="btnTheme" title="Hell / Dunkel">☀️</button></div></header>

  <div class="idea">💡 Eine Spielidee von <b>Ilyas</b> – mitgebracht von <b>Isajah</b></div>
  <section id="setup">
    <div class="card opts">
      <div><div class="lbl">Spielart</div><div class="seg" id="modeSeg"><button data-v="cpu">🤖 Gegen Computer</button><button data-v="pvp">👥 Zu zweit</button></div></div>
      <div id="lvlBox"><div class="lbl">Stärke</div><div class="seg" id="lvlSeg"><button data-v="1">Leicht</button><button data-v="2">Mittel</button><button data-v="3">Profi</button></div></div>
      <div><div class="lbl" id="t1lbl">Deine Mannschaft</div><div class="teams" id="t1"></div></div>
      <div><div class="lbl" id="t2lbl">Gegner</div><div class="teams" id="t2"></div></div>
    </div>
    <div class="row"><button class="primary" id="btnStart">Anpfiff! ⚽</button></div>
  </section>
  <section id="game" class="hidden">
    <div class="board"><div class="tm"><div class="nm" id="n1"></div><div class="dots" id="d1"></div></div><div class="res" id="res">0:0</div><div class="tm r"><div class="nm" id="n2"></div><div class="dots" id="d2"></div></div></div>
    <div style="text-align:center;margin-bottom:6px"><span class="role" id="role"></span></div>
    <div id="stage">
      <svg id="svg" viewBox="0 0 400 300"></svg>
      <div class="zones hidden" id="zones"></div>
      <div class="aimlayer hidden" id="aim"></div>
      <div class="cover hidden" id="cover"></div>
    </div>
    <div id="msg"></div>
    <div id="meterBox" class="hidden"><div class="meter" id="meter"><i id="needle"></i></div><div class="meterlbl"><span>schwach</span><span>perfekt</span><span>zu fest</span></div></div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="primary hidden" id="btnShoot">Schießen!</button><button class="small" id="btnMenu">‹ Menü</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
</div>
<script src="/online/config.js?v=3"></script><script src="/online/online.js?v=9"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KIT={get(k,d){try{const v=JSON.parse(localStorage.getItem('bs-'+k));return v??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('bs-'+k,JSON.stringify(v));}catch(e){}}};
let theme=KIT.get('theme','dark'),soundOn=KIT.get('sound',true);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(){document.documentElement.dataset.theme=theme;$('#btnTheme').textContent=theme==='dark'?'☀️':'🌙';if(window.onTheme)window.onTheme();}
$('#btnTheme').onclick=()=>{theme=theme==='dark'?'light':'dark';KIT.set('theme',theme);applyTheme();};
$('#btnSound').onclick=()=>{soundOn=!soundOn;KIT.set('sound',soundOn);if(window.onSound)try{window.onSound()}catch(e){};$('#btnSound').textContent=soundOn?'🔊':'🔇';};
$('#btnSound').textContent=soundOn?'🔊':'🔇';
let actx=null;
document.addEventListener('pointerdown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true});
document.addEventListener('keydown',()=>{try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}});
function tone(f,d=.1,delay=0,type='triangle',v=.18){if(!soundOn||!actx||actx.state!=='running')return;try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sWin=()=>[523,659,784,1046].forEach((f,k)=>tone(f,.18,k*.12));
const sLose=()=>[392,330,262].forEach((f,k)=>tone(f,.22,k*.15,'sine'));
function confetti(){try{
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,cols=['#e8b04b','#21c3e6','#e0453a','#2fa35a','#f2c21b','#ffffff','#7b5cff'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.028-H*.008,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*dpr,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0008;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}if(t<170)requestAnimationFrame(f);else c.remove();})();
}catch(e){}}
function modal(html,setup,dismiss=true){return new Promise(res=>{const m=$('#modal'),box=$('#modalBox');box.innerHTML=html;m.classList.remove('hidden');
  const close=v=>{m.classList.add('hidden');box.innerHTML='';m.onclick=null;res(v);};
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>close(b.dataset.v));if(setup)setup(box,close);
  m.onclick=e=>{if(e.target===m&&dismiss)close(null);};});}
const confirmBox=(text,yes='Ja',no='Abbrechen')=>modal(`<p>${text}</p><div class="row"><button data-v="0">${no}</button><button class="primary" data-v="1">${yes}</button></div>`).then(v=>v==='1');
const infoBox=(html,btn='OK')=>modal(html+`<div class="row"><button class="primary" data-v="1">${btn}</button></div>`);
// Swipe-Hilfe
function onSwipe(el,cb){let sx=0,sy=0,act=false;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true;},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>22){cb(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));act=false;}e.preventDefault();},{passive:false});
  el.addEventListener('touchend',()=>act=false);}
setTimeout(()=>{if(!(window.claude&&window.claude.use))$('#hubLink').classList.remove('hidden');},1500);

function showHelp(){if(!window.HELP)return;return modal(`<div class="help">${window.HELP}</div><div class="row"><button class="primary" data-v="1">Los geht's!</button></div>`);}
$('#btnHelp').onclick=showHelp;
function initHelp(id){if(window.HELP&&!KIT.get('help-seen-'+id,false)){KIT.set('help-seen-'+id,true);setTimeout(showHelp,350);}}

/* iPhone: langes Drücken auf Knöpfe/Spielfeld soll kein Menü öffnen */
document.addEventListener('contextmenu',e=>{if(e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.keys,.nums,.board'))e.preventDefault();});
document.addEventListener('selectstart',e=>{if(e.target.closest&&e.target.closest('button,canvas,svg,.wrap,.ctrl,.pads,.dpd,.board'))e.preventDefault();});


window.HELP=`<h2>⚽ So spielst du Elfmeter-Duell</h2>
<p>Ein Elfmeterschießen wie bei der WM: Abwechselnd bist du <b>Schütze</b> und <b>Torwart</b>. Jeder hat 5 Schüsse. Steht es danach unentschieden, geht es weiter, bis einer trifft und der andere nicht.</p>
<h3>⚽ Als Schütze</h3><ol><li><b>Tippe ins Tor</b>, wohin du schießen willst. Die Ecken sind am schwersten zu halten – aber auch leichter verschossen!</li><li>Jetzt läuft die <b>Kraft-Anzeige</b> hin und her. Tippe auf <b>„Schießen!“</b>, wenn die Nadel im <b>grünen Bereich</b> ist.</li><li>Blau = zu schwach, der Torwart hält leichter. Gelb = etwas ungenau. Rot = viel zu fest – der Ball fliegt oft drüber oder daneben!</li></ol>
<h3>🧤 Als Torwart</h3><ol><li>Der Schütze läuft an. Tippe auf eines der <b>6 Felder</b> im Tor, um in diese Ecke zu springen.</li><li>Du kannst schon während des Anlaufs raten – oder auf den Schuss warten. Aber Vorsicht: Der Ball ist schnell!</li></ol>
<h3>Spielarten</h3><ul><li><b>🤖 Gegen Computer:</b> Leicht, Mittel oder Profi.</li><li><b>👥 Zu zweit:</b> Am selben Handy. Der Schütze wählt geheim, dann gibt er das Handy dem Torwart, der rät, wohin er springt.</li></ul>
<div class="tip">💡 Tipp: Schieß nicht immer in dieselbe Ecke – der Computer merkt sich das!</div>`;
const TEAMS=[{k:'de',n:'Deutschland',f:'🇩🇪',c:'#f4f4f4',s:'#111',k2:'#2b2b2b'},{k:'tr',n:'Türkei',f:'🇹🇷',c:'#d8232a',s:'#fff',k2:'#f2c21b'},{k:'br',n:'Brasilien',f:'🇧🇷',c:'#f6d417',s:'#1f9d4a',k2:'#1e5bb8'},{k:'fr',n:'Frankreich',f:'🇫🇷',c:'#1d3e8a',s:'#fff',k2:'#2fbf6a'},
  {k:'es',n:'Spanien',f:'🇪🇸',c:'#c8102e',s:'#f6c700',k2:'#111'},{k:'it',n:'Italien',f:'🇮🇹',c:'#1f6fd1',s:'#fff',k2:'#ff8a00'},{k:'ar',n:'Argentinien',f:'🇦🇷',c:'#8ecbf0',s:'#fff',k2:'#5b2a86'},{k:'pt',n:'Portugal',f:'🇵🇹',c:'#a8122c',s:'#1f8a3b',k2:'#222'}];
let cfg=KIT.get('elf-cfg',{mode:'cpu',lvl:2,t1:'de',t2:'tr'});
const team=k=>TEAMS.find(t=>t.k===k);
function renderSetup(){
  $$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg.mode));$$('#lvlSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===cfg.lvl));
  $('#lvlBox').classList.toggle('hidden',cfg.mode!=='cpu');$('#t1lbl').textContent=cfg.mode==='cpu'?'Deine Mannschaft':'Spieler 1';$('#t2lbl').textContent=cfg.mode==='cpu'?'Computer-Mannschaft':'Spieler 2';
  for(const id of ['t1','t2'])$('#'+id).innerHTML=TEAMS.map(t=>`<div class="team ${cfg[id]===t.k?'on':''}" data-k="${t.k}"><span class="f">${t.f}</span>${t.n}</div>`).join('');
}
for(const id of ['t1','t2'])$('#'+id).onclick=e=>{const t=e.target.closest('.team');if(!t)return;const o=id==='t1'?'t2':'t1';if(cfg[o]===t.dataset.k)cfg[o]=cfg[id];cfg[id]=t.dataset.k;KIT.set('elf-cfg',cfg);renderSetup();};
$('#modeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.mode=b.dataset.v;KIT.set('elf-cfg',cfg);renderSetup();};
$('#lvlSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.lvl=+b.dataset.v;KIT.set('elf-cfg',cfg);renderSetup();};

/* ===== Szene ===== */
const GX1=82,GX2=318,GY1=72,GY2=190; // Torrahmen (innen)
const ZONES=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]];
const zoneCenter=z=>[GX1+(z[0]+.5)*(GX2-GX1)/3,GY1+(z[1]+.5)*(GY2-GY1)/2];
const DIVE={'0,0':[118,100,-55],'1,0':[200,92,0],'2,0':[282,100,55],'0,1':[112,162,-80],'1,1':[200,158,0],'2,1':[288,162,80]};
function scene(){
  let net='';for(let x=GX1;x<=GX2;x+=12)net+=`<line x1="${x}" y1="${GY1}" x2="${x+(x-200)*.08}" y2="${GY2+6}" />`;for(let y=GY1;y<=GY2;y+=12)net+=`<line x1="${GX1-2}" y1="${y}" x2="${GX2+2}" y2="${y}"/>`;
  let stripes='';for(let k=0;k<8;k++)stripes+=`<rect x="0" y="${190+k*14}" width="400" height="14" fill="${k%2?'#3c9a4a':'#348b41'}"/>`;
  let crowd='';for(let k=0;k<70;k++){const x=(k*37)%400+(k%3)*4,y=10+(k*13)%42;crowd+=`<circle cx="${x}" cy="${y}" r="${4+(k%3)}" fill="${['#e0453a','#f2c21b','#2f7de1','#fff','#2fbf6a','#ff9f1c'][k%6]}" opacity=".55"/>`;}
  $('#svg').innerHTML=`<defs><radialGradient id="ballg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfd5dc"/></radialGradient></defs>
  <rect width="400" height="190" fill="#1b2a44"/>${crowd}<rect y="56" width="400" height="16" fill="#0f1a2c"/><text x="200" y="67.5" fill="#9fb3d1" font-size="9" font-family="JetBrains Mono,monospace" text-anchor="middle" letter-spacing="3">KOMPASS ARENA</text>
  <rect y="72" width="400" height="118" fill="#2b6b38"/>${stripes}
  <g stroke="rgba(255,255,255,.35)" stroke-width=".8">${net}</g>
  <rect x="${GX1-5}" y="${GY1-5}" width="5" height="${GY2-GY1+5}" fill="#fff"/><rect x="${GX2}" y="${GY1-5}" width="5" height="${GY2-GY1+5}" fill="#fff"/><rect x="${GX1-5}" y="${GY1-5}" width="${GX2-GX1+10}" height="5" fill="#fff"/>
  <path d="M10 ${GY2+4} H390" stroke="#fff" stroke-width="2" opacity=".8"/><path d="M60 ${GY2+4} L40 238 H360 L340 ${GY2+4}" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
  <ellipse cx="200" cy="272" rx="4" ry="2" fill="#fff"/>
  <g id="keeper"></g><ellipse id="bshadow" cx="200" cy="276" rx="11" ry="3" fill="rgba(0,0,0,.35)"/><g id="ball"><circle r="11" fill="url(#ballg)" stroke="#333" stroke-width="1"/><path d="M0-4 L4-1 L2.5 4 L-2.5 4 L-4-1Z" fill="#222"/><path d="M0-11 L0-4 M4-1 L10-3 M2.5 4 L6 9 M-2.5 4 L-6 9 M-4-1 L-10-3" stroke="#222" stroke-width="1"/></g>
  <g id="shooter"></g><g id="fx"></g>`;
}
function drawKeeper(t,x,y,rot,arms){ // Torwart
  const k=$('#keeper');k.setAttribute('transform',`translate(${x} ${y}) rotate(${rot})`);
  const a=arms??0;
  k.innerHTML=`<rect x="-9" y="8" width="7" height="24" rx="3" fill="#222"/><rect x="2" y="8" width="7" height="24" rx="3" fill="#222"/>
   <rect x="-13" y="-20" width="26" height="32" rx="7" fill="${t.k2}"/><text x="0" y="1" font-size="11" font-weight="900" text-anchor="middle" fill="#fff" font-family="Nunito">1</text>
   <g transform="rotate(${-40-a} -11 -15)"><rect x="-34" y="-19" width="24" height="7" rx="3" fill="${t.k2}"/><circle cx="-35" cy="-15.5" r="5.5" fill="#f2f2f2" stroke="#999"/></g>
   <g transform="rotate(${40+a} 11 -15)"><rect x="10" y="-19" width="24" height="7" rx="3" fill="${t.k2}"/><circle cx="35" cy="-15.5" r="5.5" fill="#f2f2f2" stroke="#999"/></g>
   <circle cx="0" cy="-29" r="9" fill="#e9b98f"/><path d="M-9-31 Q0-42 9-31" fill="#3a2a1a"/>`;
}
function drawShooter(t,x,y,kick){
  const s=$('#shooter');s.setAttribute('transform',`translate(${x} ${y})`);
  s.innerHTML=`<rect x="-10" y="18" width="8" height="${kick?20:26}" rx="3" fill="#222" transform="rotate(${kick?-35:0} -6 18)"/><rect x="2" y="18" width="8" height="26" rx="3" fill="#222"/>
   <rect x="-12" y="18" width="24" height="12" rx="3" fill="${t.s}"/><rect x="-15" y="-14" width="30" height="34" rx="8" fill="${t.c}" stroke="rgba(0,0,0,.2)"/>
   <text x="0" y="8" font-size="13" font-weight="900" text-anchor="middle" fill="${t.s}" font-family="Nunito">9</text>
   <rect x="-22" y="-10" width="8" height="22" rx="4" fill="${t.c}"/><rect x="14" y="-10" width="8" height="22" rx="4" fill="${t.c}"/><circle cx="0" cy="-23" r="10" fill="#3a2a1a"/>`;
}
function setBall(x,y,r){const b=$('#ball');b.setAttribute('transform',`translate(${x} ${y}) scale(${r/11})`);$('#bshadow').setAttribute('cx',x);$('#bshadow').setAttribute('cy',Math.min(276,y+r*.6+ (276-y)*.0));$('#bshadow').setAttribute('rx',r);}
const lerp=(a,b,t)=>a+(b-a)*t,ease=t=>1-(1-t)*(1-t);
function anim(ms,fn){return new Promise(res=>{const t0=performance.now();(function f(n){const t=Math.min(1,(n-t0)/ms);fn(t);if(t<1)requestAnimationFrame(f);else res();})(t0);});}
/* Ton */
const sWhistle=()=>{tone(2600,.12,0,'sine',.12);tone(2600,.3,.18,'sine',.12);};
const sKick=()=>tone(110,.12,0,'sine',.35);
function sCrowd(good){if(!soundOn||!actx||actx.state!=='running')return;try{const len=actx.sampleRate*1.4,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);
  const src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();src.buffer=buf;f.type='bandpass';f.frequency.value=good?900:350;g.gain.value=good?.35:.25;src.connect(f).connect(g).connect(actx.destination);src.start();}catch(e){}}

/* ===== Spielablauf ===== */
let G=null,meterT=null,meterV=0,meterDir=1,aimPt=null,token=0,keeperPick=null,history=[];
function start(){
  token++;const A=team(cfg.t1),B=team(cfg.t2);
  G={T:[A,B],names:EON?NET.players().slice(0,2).map(p=>p.name):cfg.mode==='cpu'?['Du','Computer']:['Spieler 1','Spieler 2'],res:[[],[]],turn:0,kicks:0,over:false};history=[];
  $('#setup').classList.add('hidden');$('#game').classList.remove('hidden');scene();sWhistle();nextKick();
}
const shooterIdx=()=>G.kicks%2; // 0 = Team 1 schießt
function board(){
  for(const i of[0,1]){$('#n'+(i+1)).textContent=`${G.T[i].f} ${G.names[i]}`;const r=G.res[i];const slots=Math.max(5,r.length);
    $('#d'+(i+1)).innerHTML=Array.from({length:slots},(_,k)=>`<i class="${r[k]===undefined?'':r[k]?'g':'m'}">${r[k]===undefined?'':r[k]?'⚽':'✕'}</i>`).join('');}
  const g=i=>G.res[i].filter(Boolean).length;$('#res').textContent=`${g(0)}:${g(1)}`;
}
function decided(){const [a,b]=G.res,ga=a.filter(Boolean).length,gb=b.filter(Boolean).length;
  if(a.length<=5&&b.length<=5){const ra=5-a.length,rb=5-b.length;if(ga+ra<gb||gb+rb<ga)return true;if(a.length===5&&b.length===5)return ga!==gb;return false;}
  return a.length===b.length&&ga!==gb;}
function resetPositions(){const s=G.T[shooterIdx()],k=G.T[1-shooterIdx()];drawKeeper(k,200,158,0,0);drawShooter(s,150,276,false);setBall(200,268,11);$('#fx').innerHTML='';}
async function nextKick(){
  board();if(decided())return finish();
  const si=shooterIdx(),tk=++token;resetPositions();$('#zones').classList.add('hidden');$('#aim').classList.add('hidden');$('#meterBox').classList.add('hidden');$('#btnShoot').classList.add('hidden');
  const n=G.res[si].length+1;
  if(EON){eKick(si,tk,n);return;}
  if(cfg.mode==='cpu'){
    if(si===0){$('#role').textContent=`⚽ Du schießt – ${n}. Elfmeter`;$('#msg').textContent='Tippe ins Tor: Wohin willst du schießen?';aimMode(tk);}
    else{$('#role').textContent=`🧤 Du bist Torwart – ${n}. Elfmeter`;cpuShoots(tk);}
  }else{
    const sn=G.names[si],kn=G.names[1-si];$('#role').textContent=`⚽ ${sn} schießt · 🧤 ${kn} hält`;
    await cover(`<h2>⚽ ${G.T[si].f} ${sn}</h2><p>Du bist dran mit Schießen!<br>${kn}: bitte wegschauen 🙈</p>`,'Ich bin bereit');if(tk!==token)return;
    $('#msg').textContent='Tippe ins Tor: Wohin willst du schießen?';aimMode(tk);
  }
}
function cover(html,btn){return new Promise(res=>{const c=$('#cover');c.innerHTML=html+`<button class="primary">${btn}</button>`;c.classList.remove('hidden');c.querySelector('button').onclick=()=>{c.classList.add('hidden');res();};});}
/* Schütze: zielen + Kraft */
function aimMode(tk){
  aimPt=null;const a=$('#aim');a.classList.remove('hidden');
  a.onclick=e=>{if(tk!==token)return;const r=$('#svg').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*400,y=(e.clientY-r.top)/r.height*300;
    if(y>GY2+30){return;}aimPt=[Math.max(GX1-30,Math.min(GX2+30,x)),Math.max(GY1-30,Math.min(GY2-4,y))];
    $('#fx').innerHTML=`<g transform="translate(${aimPt[0]} ${aimPt[1]})"><circle r="10" fill="none" stroke="#ffd23f" stroke-width="2.5"/><path d="M-15 0H-6M6 0H15M0-15V-6M0 6V15" stroke="#ffd23f" stroke-width="2.5"/></g>`;
    tone(700,.04);$('#msg').textContent='Jetzt im richtigen Moment „Schießen!“ tippen – Nadel im Grünen!';startMeter(tk);};
}
function startMeter(tk){
  $('#meterBox').classList.remove('hidden');$('#btnShoot').classList.remove('hidden');clearInterval(meterT);meterV=0;meterDir=1;
  const sp=[0,.016,.022,.03][cfg.mode==='cpu'?cfg.lvl:2];
  meterT=setInterval(()=>{meterV+=meterDir*sp;if(meterV>=1){meterV=1;meterDir=-1;}if(meterV<=0){meterV=0;meterDir=1;}$('#needle').style.left=(meterV*100)+'%';},16);
  $('#btnShoot').onclick=()=>{if(tk!==token||!aimPt)return;clearInterval(meterT);$('#btnShoot').classList.add('hidden');$('#aim').classList.add('hidden');$('#aim').onclick=null;humanShot(tk,aimPt.slice(),meterV);};
}
function shotResult(target,power){
  // Kraft verändert die Genauigkeit
  let [x,y]=target,dev=power>.9?36:power>.8?14:power<.35?6:5;x+=(Math.random()-.5)*2*dev;y+=(Math.random()-.5)*2*dev-(power>.9?22:0);
  const speed=power<.35?.55:power<.8?.85+power*.15:1.05;return {x,y,power,speed};
}
async function humanShot(tk,target,power){
  const S=shotResult(target,power);if(EON){NET.put('k'+G.kicks+'/s',S);$('#msg').textContent='Schuss abgegeben! Warte auf den Torwart … 🧤';return;}history.push(target[0]<168?0:target[0]>232?2:1);
  // Torwart (Computer oder Mensch) entscheidet
  let dive;
  if(cfg.mode==='cpu'){dive=cpuKeeperGuess(S);}
  else{await cover(`<h2>🧤 ${G.T[1-shooterIdx()].f} ${G.names[1-shooterIdx()]}</h2><p>Jetzt bist du Torwart!<br>Tippe gleich auf das Feld, in das du springst.</p>`,'Los!');if(tk!==token)return;
    dive=await pickZone(tk,null);}
  await play(tk,S,dive,false);
}
function cpuKeeperGuess(S){
  const lv=cfg.lvl,col=S.x<168?0:S.x>232?2:1,row=S.y<131?0:1;
  const fav=history.length>=3?[0,1,2].sort((a,b)=>history.filter(h=>h===b).length-history.filter(h=>h===a).length)[0]:null;
  let c=Math.floor(Math.random()*3),r=Math.random()<.5?0:1;
  const read=[0,.2,.33,.45][lv];if(Math.random()<read)c=col;else if(fav!==null&&Math.random()<.3*lv/3)c=fav;
  if(Math.random()<read*.8)r=row;if(lv===1&&Math.random()<.25){c=1;r=1;}
  return [c,r];
}
function pickZone(tk,deadline){return new Promise(res=>{const z=$('#zones');z.innerHTML=ZONES.map((q,i)=>`<button data-i="${i}">${['↖','⬆','↗','↙','⬇','↘'][i]}</button>`).join('');z.classList.remove('hidden');
  let done=false;keeperPick=null;const fin=v=>{if(done)return;done=true;z.classList.add('hidden');res(v);};
  z.onclick=e=>{const b=e.target.closest('button');if(!b||tk!==token)return;keeperPick=ZONES[+b.dataset.i];tone(500,.04);fin(keeperPick);};
  if(deadline)deadline.then(()=>fin(keeperPick||[1,1]));});}
/* Computer schießt, du hältst */
async function cpuShoots(tk){
  const lv=cfg.lvl,zs=ZONES[Math.floor(Math.random()*6)];let [cx,cy]=zoneCenter(zs);cx+=(Math.random()-.5)*40;cy+=(Math.random()-.5)*30;
  if(zs[0]===0)cx-=12;if(zs[0]===2)cx+=12;
  const power=lv===1?.45+Math.random()*.35:lv===2?.55+Math.random()*.35:.62+Math.random()*.3;
  const S=shotResult([cx,cy],power);
  $('#msg').textContent='Der Schütze läuft an … Tippe die Ecke, in die du springst!';
  let picked=null;const z=$('#zones');z.innerHTML=ZONES.map((q,i)=>`<button data-i="${i}">${['↖','⬆','↗','↙','⬇','↘'][i]}</button>`).join('');z.classList.remove('hidden');
  z.onclick=e=>{const b=e.target.closest('button');if(!b||tk!==token||picked)return;picked=ZONES[+b.dataset.i];tone(500,.04);z.querySelectorAll('button').forEach((x,i)=>x.style.background=ZONES[i]===picked?'rgba(255,210,63,.45)':'');};
  // Anlauf
  const t=G.T[shooterIdx()];await anim(lv===1?1400:1100,p=>drawShooter(t,lerp(150,182,p),lerp(276,258,p),false));if(tk!==token)return;
  await play(tk,S,()=>picked,true);
  z.classList.add('hidden');
}
/* Schuss abspielen */
async function play(tk,S,dive,keeperIsHuman){
  const si=shooterIdx(),st=G.T[si],kt=G.T[1-si];
  if(!keeperIsHuman){await anim(700,p=>drawShooter(st,lerp(150,182,p),lerp(276,258,p),false));if(tk!==token)return;}
  drawShooter(st,182,258,true);sKick();
  const flight=Math.round((keeperIsHuman?[0,1300,900,650][cfg.mode==='cpu'?cfg.lvl:2]:650)/(S.speed));
  let diveZone=typeof dive==='function'?null:dive,diveStarted=false,dx=200,dy=158,drot=0;
  await anim(flight,p=>{
    const e=ease(p),bx=lerp(200,S.x,e),by=lerp(268,S.y,e)-Math.sin(Math.PI*p)*18,r=lerp(11,7,e);setBall(bx,by,r);
    if(typeof dive==='function'&&!diveZone){const d=dive();if(d)diveZone=d;}
    const startAt=keeperIsHuman?0:.25;
    if(diveZone&&p>startAt){if(!diveStarted){diveStarted={t:p,x:dx,y:dy};}
      const D=DIVE[diveZone.join()],q=Math.min(1,(p-diveStarted.t)/.5);dx=lerp(diveStarted.x,D[0],ease(q));dy=lerp(diveStarted.y,D[1],ease(q));drot=lerp(0,D[2],ease(q));drawKeeper(kt,dx,dy,drot,q*40);}
  });
  if(tk!==token)return;
  // Ergebnis
  const inGoal=S.x>GX1+4&&S.x<GX2-4&&S.y>GY1+4&&S.y<GY2;
  const post=!inGoal&&((Math.abs(S.x-GX1)<9||Math.abs(S.x-GX2)<9)&&S.y>GY1-6&&S.y<GY2||Math.abs(S.y-GY1)<8&&S.x>GX1-6&&S.x<GX2+6);
  let saved=false;
  if(inGoal&&diveZone){const D=DIVE[diveZone.join()],reach=(S.power<.35?54:40)+(cfg.mode==='cpu'&&!keeperIsHuman?[0,-4,0,5][cfg.lvl]:0)+(keeperIsHuman&&cfg.mode==='cpu'?[0,10,4,0][cfg.lvl]:0);
    saved=Math.hypot(S.x-D[0],S.y-D[1])<reach;}
  else if(inGoal&&!diveZone){saved=Math.hypot(S.x-200,S.y-158)<30;}
  const goal=inGoal&&!saved;
  // Nachspiel-Animation
  if(saved){await anim(350,p=>setBall(lerp(S.x,S.x+(S.x<200?-60:60),p),lerp(S.y,S.y+40,p),7));}
  else if(goal){await anim(250,p=>setBall(S.x,lerp(S.y,S.y+6,p),7));$('#fx').innerHTML=`<text x="200" y="40" text-anchor="middle" font-size="34" font-weight="900" fill="#ffd23f" font-family="Nunito" stroke="#000" stroke-width="1">TOOOR!</text>`;}
  else{await anim(300,p=>setBall(lerp(S.x,S.x+(S.x<200?-30:30),p),lerp(S.y,S.y-20,p),6));}
  G.res[si].push(goal);
  const shooterHuman=cfg.mode==='pvp'||si===0;
  let txt;
  if(goal)txt=cfg.mode==='cpu'?(si===0?'⚽ TOR! Super geschossen!':'Tor für den Computer 😕'):`⚽ TOR für ${G.names[si]}!`;
  else if(saved)txt=cfg.mode==='cpu'?(si===0?'🧤 Gehalten! Der Torwart war dran.':'🧤 GEHALTEN! Klasse Parade!'):`🧤 ${G.names[1-si]} hält!`;
  else txt=post?'💥 Pfosten! Kein Tor.':(S.y<GY1?'⬆ Drüber! Kein Tor.':'↔ Daneben! Kein Tor.');
  $('#msg').textContent=txt;
  const goodForHuman=cfg.mode==='pvp'?goal:(si===0?goal:!goal);
  sCrowd(goodForHuman);if(goal)tone(523,.1,.1);else if(saved&&keeperIsHuman&&cfg.mode==='cpu')[659,784].forEach((f,k)=>tone(f,.1,k*.08));
  board();G.kicks++;
  await sleep(1700);if(tk!==token)return;nextKick();
}
function finish(){
  const g=i=>G.res[i].filter(Boolean).length,a=g(0),b=g(1);board();sWhistle();
  $('#zones').classList.add('hidden');$('#aim').classList.add('hidden');$('#meterBox').classList.add('hidden');
  let h;if(cfg.mode==='cpu'){if(a>b){h=`<div class="big">🏆</div><h2>Du gewinnst ${a}:${b}!</h2>`;confetti();sWin();}else{h=`<div class="big">😕</div><h2>Der Computer gewinnt ${b}:${a}</h2>`;sLose();}}
  else{const w=a>b?0:1;h=`<div class="big">🏆</div><h2>${G.T[w].f} ${G.names[w]} gewinnt ${Math.max(a,b)}:${Math.min(a,b)}!</h2>`;confetti();sWin();}
  $('#msg').textContent='Abpfiff!';
  const c=$('#cover');c.innerHTML=h+'<div class="row" style="justify-content:center"><button class="primary" id="cAgain">Nochmal</button><button id="cMenu">Menü</button></div>';c.classList.remove('hidden');
  if(EON){const me=(NET.me()||{}).name,w=a>b?0:1;if(G.names[w]!==me){sLose();}$('#cAgain').style.display=NET.isHost()?'':'none';$('#cAgain').onclick=()=>{c.classList.add('hidden');NET.clearData().then(()=>NET.again());};$('#cMenu').textContent='Verlassen';$('#cMenu').onclick=()=>{c.classList.add('hidden');NET.leave();eOff();};return;}
  $('#cAgain').onclick=()=>{c.classList.add('hidden');start();};$('#cMenu').onclick=()=>{c.classList.add('hidden');toMenu();};
}
function toMenu(){token++;clearInterval(meterT);$('#cover').classList.add('hidden');$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');renderSetup();}
$('#btnMenu').onclick=toMenu;$('#btnStart').onclick=start;
window.onTheme=()=>{};applyTheme();renderSetup();
/* ---------- Online: echtes Elfmeterschießen gegeneinander ---------- */
var EON=false,EOD={},eSeat=0,eStarted=false,ePlayed={},eKeep=null;
function eKick(si,tk,n){const sn=G.names[si],kn=G.names[1-si];$('#role').textContent=`⚽ ${sn} schießt · 🧤 ${kn} hält`;
  if(eSeat===si){$('#msg').textContent=`Du schießt (${n}. Elfmeter)! Tippe ins Tor: Wohin?`;aimMode(tk);}
  else{$('#msg').textContent=`Du bist Torwart! Tippe die Ecke, in die du springst – ${sn} zielt gerade …`;pickZone(tk,null).then(z=>{if(tk!==token)return;NET.put('k'+G.kicks+'/d',z);$('#msg').textContent='Ecke gewählt! Warte auf den Schuss … ⚽';});}
  ePump();}
function ePump(){if(!EON||!G||G.over)return;const k=EOD['k'+G.kicks];if(!k||!k.s||!k.d||ePlayed[G.kicks])return;ePlayed[G.kicks]=1;const z=Object.values(k.d).map(Number);
  $('#zones').classList.add('hidden');$('#aim').classList.add('hidden');$('#meterBox').classList.add('hidden');$('#btnShoot').classList.add('hidden');play(token,k.s,z,false);}
function eBegin(c){eStarted=true;ePlayed={};eKeep=eKeep||{mode:cfg.mode,t1:cfg.t1,t2:cfg.t2};cfg.mode='pvp';cfg.t1=c.t1;cfg.t2=c.t2;start();}
function eOff(){EON=false;eStarted=false;if(eKeep){cfg.mode=eKeep.mode;cfg.t1=eKeep.t1;cfg.t2=eKeep.t2;eKeep=null;}toMenu();}
if(window.NET&&NET.supported()){NET.coop({title:'Elfmeter',label:'Online gegeneinander',note:'Echtes Elfmeterschießen: Einer schießt, der andere hält – live auf zwei Handys!',min:2,max:2,
  start(room,seat){EON=true;eStarted=false;EOD={};eSeat=seat;$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#msg').textContent='⏳ Gleich geht’s los …';if(NET.isHost())NET.put('cfg',{t1:cfg.t1,t2:cfg.t2});},
  onData(d){EOD=d||{};if(!EON)return;if(!eStarted&&d.cfg){eBegin(d.cfg);return;}ePump();},
  stop(){if(EON)eOff();}});}

initHelp('elfmeter');
</script>
